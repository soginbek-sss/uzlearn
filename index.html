y the time, already kabi so'zlar bilan keladi.\n\nMasalan: By the time we arrived, they had gone. / He had eaten before I came. / After she had finished, she left.\n\nEslab qoling: vaqt tartibi aniq bo'lsa (avval, keyin), Past Perfect shart emas. Lekin tushunarli bo'lish uchun ishlatish yaxshi.","misollar":[{"ingliz":"When we arrived, the film had already started.","uzbek":"Biz yetib kelganimizda film allaqachon boshlangan edi."},{"ingliz":"She had studied English before she moved to London.","uzbek":"U Londonga ko'chishdan oldin ingliz tilini o'rgangan edi."},{"ingliz":"I couldn't get in because I had left my key at home.","uzbek":"Men kira olmadim, chunki kalitni uyda qoldirgan edim."},{"ingliz":"After he had eaten dinner, he watched TV.","uzbek":"Kechki ovqatni yeb bo'lgach, u televizor ko'rdi."}],"xato":"O'zbekchada '-gan edi' shakli bor, lekin ko'pchilik uni ishlatmaydi va ikki voqeani ham oddiy o'tgan zamonda aytadi. Natijada qaysi biri avval bo'lgani yo'qoladi. Xato: 'When I arrived, he already left'. To'g'risi: 'When I arrived, he had already left'.","mashqlar":[{"savol":"(kalit oldin qoldirilgan) I couldn't get in because I ___ my key at home.","variantlar":["was leaving","left","had left","have left"],"togri":2,"izoh":"Qoldirish eshikni ochishga urinishdan oldin bo'lgan: had left."},{"savol":"By the time we arrived, the concert ___.","variantlar":["has finished","had finished","finishes","was finish"],"togri":1,"izoh":"By the time bilan oldin tugagan harakat: had finished."},{"savol":"(ko'chishdan oldin o'qigan) She ___ English before she moved to London.","variantlar":["had studied","has studied","studies","was studying"],"togri":0,"izoh":"O'qish ko'chishdan oldin bo'lgan: had studied."},{"savol":"After he ___ dinner, he watched TV.","variantlar":["had eaten","eats","is eating","has eaten"],"togri":0,"izoh":"Ovqat yeyish televizor ko'rishdan oldin tugagan: had eaten."}]},{"raqam":29,"sarlavha":"Hozirgi tugallanmagan davomli — Present Perfect Continuous","daraja":"B1","tayyor":true,"qoida":"📌 O'tmishdan boshlanib hozirgacha davom etayotgan ish. Asosiy e'tibor ish davom etayotganiga qaratiladi.\n\nTuzilishi: have / has been + fe'l-ing\n▸ I have been studying for two hours. (Ikki soatdan beri o'qiyapman.)\n▸ She has been working here since 2020. (2020-yildan beri shu yerda ishlaydi.)\n▸ They have been waiting for an hour. (Ular bir soatdan beri kutishyapti.)\n\nhave — I, you, we, they bilan; has — he, she, it bilan.","ogatish":"🧭 Qadam-baqadam:\n1) Ish hozir ham davom etyaptimi? Ha bo'lsa, shu zamon.\n2) Egaga qarab have yoki has tanlang, keyin been.\n3) Fe'lga -ing qo'shing: work → working.\n4) Muddat uchun for (davr): for two hours. Boshlangan vaqt uchun since: since Monday.\n\nMasalan: I have been learning English for two years. / How long have you been waiting? / It has been raining since morning.","misollar":[{"ingliz":"I have been learning English for two years.","uzbek":"Men ikki yildan beri ingliz tilini o'rganyapman."},{"ingliz":"She is tired because she has been working all day.","uzbek":"U charchagan, chunki kun bo'yi ishlagan."},{"ingliz":"We have been waiting for an hour.","uzbek":"Biz bir soatdan beri kutyapmiz."},{"ingliz":"I have known him for ten years.","uzbek":"Men uni o'n yildan beri bilaman."}],"xato":"O'zbekchada 'o'rganyapman' davom etayotgan harakatni bildiradi va 'ikki yildan beri' qo'shilsa ham shakl o'zgarmaydi. Inglizchada esa for/since bilan hozirgi oddiy zamon ishlatilmaydi. Xato: 'I am learning English for two years'. To'g'risi: 'I have been learning English for two years'. Holat fe'llarida: 'I have been knowing' xato.","mashqlar":[{"savol":"I ___ English for two years.","variantlar":["have been learning","learn","was learning","am learning"],"togri":0,"izoh":"For two years bilan hozirgacha davom etgan jarayon: have been learning."},{"savol":"She is tired. She ___ in the garden since morning.","variantlar":["worked","works","has been working","is working"],"togri":2,"izoh":"Since morning — hozirgacha davom etgan jarayon va natija ko'rinib turibdi: has been working."},{"savol":"We ___ waiting for an hour.","variantlar":["had","have been","are","was"],"togri":1,"izoh":"For an hour — davom etgan jarayon: have been waiting."},{"savol":"(hali ham tanishman) I ___ him for ten years.","variantlar":["have been knowing","have known","am knowing","knew"],"togri":1,"izoh":"Know holat fe'li, davomli shaklda ishlatilmaydi: have known."}]},{"raqam":30,"sarlavha":"2-tur shart gaplar — Second Conditional","daraja":"B1","tayyor":true,"qoida":"📌 Hozirgi yoki kelajakdagi xayoliy vaziyat — haqiqat emas, faraz.\n\nTuzilishi: If + Past Simple, would + fe'l\n▸ If I had money, I would buy a car. (Pulim bo'lsa, mashina sotib olardim.)\n▸ If she studied more, she would pass the exam. (Ko'proq o'qisa, imtihondan o'tardi.)\n▸ If I were you, I would study harder. (Men sizning o'rnimda bo'lsam, ko'proq o'qirdim.)\n\nEslatma: 'if I were' — rasmiy va maslahat ohangida barcha egalar bilan ishlatiladi.","ogatish":"🧭 Qadam-baqadam:\n1) If qismida Past Simple: had, went, knew, were.\n2) Asosiy qismda would + oddiy fe'l: would buy, would help, would travel.\n3) Tartibni almashtirish mumkin: I would buy a car if I had money. (Vergul kerak emas.)\n\nMasalan: If I were rich, I would travel the world. / If we had time, we would help. / If it rained, they would stay home.\n\nEslab qoling: 'if' qismida would ishlatilmaydi: 'If I would have' xato.","misollar":[{"ingliz":"If I were rich, I would travel the world.","uzbek":"Agar boy bo'lganimda, butun dunyo bo'ylab sayohat qilgan bo'lardim."},{"ingliz":"If she studied more, she would pass the exam.","uzbek":"Agar u ko'proq o'qisa, imtihondan o'tardi."},{"ingliz":"I would buy a big house if I had more money.","uzbek":"Pulim ko'proq bo'lsa, katta uy sotib olardim."},{"ingliz":"If I were you, I wouldn't do that.","uzbek":"Sizning o'rningizda bo'lsam, buni qilmasdim."}],"xato":"O'zbekchada '-sa' va '-ardi' qo'shimchalari bor, lekin 1-tur va 2-tur gaplar bir xil eshitiladi. Inglizchada farq bor: real shart — If + Present, will; xayoliy shart — If + Past, would. Xato: 'If I would have money, I would buy', 'If I will be rich'. To'g'risi: 'If I had money, I would buy'.","mashqlar":[{"savol":"If I ___ rich, I would travel the world.","variantlar":["were","would be","am","will be"],"togri":0,"izoh":"Xayoliy shartda to be — were."},{"savol":"If she studied more, she ___ the exam.","variantlar":["will pass","passes","would pass","passed"],"togri":2,"izoh":"Natija qismida would + fe'l."},{"savol":"I would buy a big house if I ___ more money.","variantlar":["had","would have","will have","have"],"togri":0,"izoh":"If qismida Past Simple: had."},{"savol":"If I ___ you, I wouldn't do that.","variantlar":["be","will be","am","were"],"togri":3,"izoh":"Maslahat berishda If I were you."}]},{"raqam":31,"sarlavha":"Aniqlovchi gaplar — who / which / that / where / whose","daraja":"B1","tayyor":true,"qoida":"📌 Aniqlovchi gap — ot haqida qo'shimcha ma'lumot beradi va qaysi odam yoki narsa haqida gap borayotganini aniqlaydi.\n\nwho — faqat odam uchun:\n▸ The man who called me is my uncle. (Meni chaqirgan odam — tog'am.)\n▸ The girl who sings is my friend. (Qo'shiq aytayotgan qiz — do'stim.)\n\nwhich — faqat narsa uchun:\n▸ The book which I read was great. (Men o'qigan kitob zo'r edi.)\n▸ The phone which is on the table is mine. (Stolda turgan telefon meniki.)\n\nthat — odam va narsa uchun (ko'pincha vergulsiz):\n▸ The car that he bought is new. (U sotib olgan mashina yangi.)\n\nwhere — joy uchun: This is the town where I was born. (Men tug'ilgan shahar shu.)\nwhose — egalik uchun: She is the girl whose father is a doctor. (Otasi shifokor bo'lgan qiz shu.)","ogatish":"🧭 Qadam-baqadam:\n1) Gap kim yoki nima haqida? Odam → who yoki that; narsa → which yoki that; joy → where; egalik → whose.\n2) Shu so'zni ot yonidan keyin qo'ying: The girl who sings is my friend.\n3) Aniq ajratilgan ma'lumot bo'lsa vergul kerak emas. Qo'shimcha ma'lumot bo'lsa vergul bilan: My brother, who lives in London, is a doctor.\n\nEslab qoling: who faqat odam uchun, which faqat narsa uchun. That ikkalasi uchun ham ishlaydi.","misollar":[{"ingliz":"The woman who lives next door is a teacher.","uzbek":"Qo'shni uyda yashaydigan ayol o'qituvchi."},{"ingliz":"This is the book which I told you about.","uzbek":"Bu men sizga aytgan kitob."},{"ingliz":"That is the restaurant where we had dinner.","uzbek":"Bu biz kechki ovqatlangan restoran."},{"ingliz":"He is the man whose car was stolen.","uzbek":"Bu mashinasi o'g'irlangan odam."}],"xato":"O'zbekchada aniqlovchi gap ot OLDIDA keladi ('men yashaydigan shahar'). Inglizchada ot oldin, aniqlovchi gap keyin. Xato: 'The city where I live in' (in ortiqcha). To'g'risi: 'The city where I live'. Yana: 'The man who he lives here' xato, to'g'risi 'The man who lives here'.","mashqlar":[{"savol":"The woman ___ lives next door is a teacher.","variantlar":["where","whose","which","who"],"togri":3,"izoh":"Odam uchun who."},{"savol":"This is the book ___ I told you about.","variantlar":["who","whose","where","which"],"togri":3,"izoh":"Narsa uchun which."},{"savol":"That is the restaurant ___ we had dinner.","variantlar":["which","whom","who","where"],"togri":3,"izoh":"Joy uchun where."},{"savol":"He is the man ___ car was stolen.","variantlar":["who","that","which","whose"],"togri":3,"izoh":"Kimningdir mashinasi — egalik: whose."}]},{"raqam":32,"sarlavha":"Ortiqcha va yetarli — too / enough","daraja":"B1","tayyor":true,"qoida":"📌 too — ortiqcha, kerakdan ko'p:\n▸ It's too hot to walk. (Yurish uchun juda issiq.)\n▸ The coffee is too sweet. (Qahva juda shirin.)\n\nenough — yetarli:\n▸ He is old enough to drive. (Haydash uchun yetarlicha katta.)\n▸ We have enough time. (Vaqtimiz yetarli.)\n\nToo + sifat + to + fe'l: too tired to work.\nSifat + enough + to + fe'l: strong enough to lift it.\nEnough sifatdan keyin, too sifatdan oldin keladi.","ogatish":"🧭 Qadam-baqadam:\n1) Gap ortiqcha ma'nosini beradimi (keraksiz darajada ko'p)? → too.\n2) Yetarli ma'nosini beradimi? → enough.\n3) too sifatning oldida: too big. Enough esa sifatdan keyin: big enough.\n4) Fe'l kerak bo'lsa to + fe'l: too tired to go.\n\nMasalan: It's too cold to swim. / She is smart enough to win. / The bag is too heavy.\n\nEslab qoling: 'too' ijobiy gapda odatda salbiy ma'no beradi: too expensive (qimmat, yoqmaydi).","misollar":[{"ingliz":"The tea is too hot. I can't drink it.","uzbek":"Choy juda issiq. Men uni icha olmayman."},{"ingliz":"He is old enough to drive.","uzbek":"U mashina haydash uchun yetarlicha katta."},{"ingliz":"We don't have enough money to buy a car.","uzbek":"Mashina sotib olishga pulimiz yetmaydi."},{"ingliz":"There are too many people here.","uzbek":"Bu yerda odam haddan ziyod ko'p."}],"xato":"O'zbekchada 'juda' ham 'haddan ziyod' ham bo'la oladi. Inglizchada very (shunchaki juda) va too (kerakdan ortiq) boshqa narsa. Xato: 'enough tall', 'too much people'. To'g'risi: 'tall enough', 'too many people'.","mashqlar":[{"savol":"The tea is ___ hot. I can't drink it.","variantlar":["enough","too","more","much"],"togri":1,"izoh":"Ichib bo'lmaydigan darajada issiq: too hot."},{"savol":"He is not tall ___ to play basketball.","variantlar":["very","too","enough","so"],"togri":2,"izoh":"Sifatdan keyin enough: tall enough."},{"savol":"We don't have ___ money to buy a car.","variantlar":["very","so","too","enough"],"togri":3,"izoh":"Otdan oldin enough: enough money."},{"savol":"There are ___ many people here. I can't find a seat.","variantlar":["too","so much","very much","enough"],"togri":0,"izoh":"Sanaladigan ko'plik bilan too many."}]},{"raqam":33,"sarlavha":"Qaytariluvchi savollar — Question Tags","daraja":"B1","tayyor":true,"qoida":"📌 Question tags — gap oxiridagi qisqa savol. Gapning to'g'riligini tekshirish yoki suhbatni davom ettirish uchun ishlatiladi.\n\nQoida: ijobiy gap → inkor savol; inkor gap → ijobiy savol.\n▸ You are tired, aren't you? (Siz charchadingiz, shunday emasmi?)\n▸ She doesn't know, does she? (U bilmaydi, shunday emasmi?)\n▸ They will come, won't they? (Ular keladi, shunday emasmi?)","ogatish":"🧭 Qadam-baqadam:\n1) Gap ijobiymi yoki inkormi? Teskarisini yozing.\n2) Gapdagi fe'lga qarab yordamchi fe'l tanlang: be → is/are/was; do → do/does/did; will → will; can → can.\n3) Egani olmosh bilan almashtiring: Ali → he, my sister → she, they → they.\n4) Ohang: ko'tarilsa — haqiqiy savol; pasaysa — tasdiq so'raydi.\n\nMasalan: He can swim, can't he? / Ali works here, doesn't he? / Let's go, shall we?\n\nEslab qoling: I am bo'lsa, savol aren't I? bo'ladi (amn't I emas).","misollar":[{"ingliz":"You are Ali, aren't you?","uzbek":"Siz Alisiz, shunday emasmi?"},{"ingliz":"She doesn't speak French, does she?","uzbek":"U fransuzcha gapirmaydi, to'g'rimi?"},{"ingliz":"They went to the party, didn't they?","uzbek":"Ular ziyofatga bordi, shunday emasmi?"},{"ingliz":"He can swim, can't he?","uzbek":"U suza oladi, to'g'rimi?"}],"xato":"O'zbekchada 'to'g'rimi?', 'shundaymi?' bitta qolipda hamma gapga qo'shiladi. Inglizchada esa har bir gapning o'z tagi bor. Xato: 'You are Ali, isn't it?', 'She likes tea, isn't she?'. To'g'risi: 'You are Ali, aren't you?', 'She likes tea, doesn't she?'.","mashqlar":[{"savol":"You are Ali, ___?","variantlar":["aren't you","don't you","isn't you","are you"],"togri":0,"izoh":"Darak gap — inkor tag: aren't you."},{"savol":"She doesn't speak French, ___?","variantlar":["does she","is she","do she","doesn't she"],"togri":0,"izoh":"Inkor gap — darak tag: does she."},{"savol":"They went to the party, ___?","variantlar":["did they","didn't they","don't they","weren't they"],"togri":1,"izoh":"Went (Past Simple) darak — didn't they."},{"savol":"He can swim, ___?","variantlar":["isn't he","can't he","can he","doesn't he"],"togri":1,"izoh":"Can darak — can't he."}]},{"raqam":34,"sarlavha":"3-tur shart gaplar — Third Conditional","daraja":"B2","tayyor":true,"qoida":"📌 O'tmishdagi bajarilmagan shart va uning natijasi. Bu haqiqat emas, afsus bilan aytiladi.\n\nTuzilishi: If + Past Perfect, would have + 3-shakl\n▸ If I had studied, I would have passed. (O'qiganimda, o'tgan bo'lardim. Lekin o'qimadim.)\n▸ If she had left earlier, she wouldn't have missed the bus. (Oldinroq ketganida, avtobusni qoldirmagan bo'lardi.)\n▸ If we had known, we would have come. (Bilganimizda, kelgan bo'lardik.)","ogatish":"🧭 Qadam-baqadam:\n1) If qismida had + 3-shakl (had studied, had gone).\n2) Asosiy qismda would have + 3-shakl.\n3) Qisqartirish mumkin: wouldn't have, couldn't have, might have.\n\nEslab qoling: bu zamon faqat o'tmishdagi voqea haqida. Hozirgi holat uchun 2-tur shart ishlatiladi.","misollar":[{"ingliz":"If I had studied harder, I would have passed the exam.","uzbek":"Agar qattiqroq o'qiganimda, imtihondan o'tgan bo'lardim."},{"ingliz":"If she had left earlier, she would have caught the train.","uzbek":"Agar u erta chiqqanida, poyezdga ulgurgan bo'lardi."},{"ingliz":"We wouldn't have got wet if we had taken an umbrella.","uzbek":"Soyabon olganimizda, ho'l bo'lmagan bo'lardik."},{"ingliz":"If he had asked me, I would have helped him.","uzbek":"Agar u mendan so'raganida, unga yordam bergan bo'lardim."}],"xato":"O'zbekchada o'tmish shartida ham '-sa' va '-ardi' ishlatiladi, farq sezilmaydi. Inglizchada har bir qismda murakkab shakl kerak. Xato: 'If I would have studied', 'If I studied, I would pass' (o'tmish uchun). To'g'risi: 'If I had studied, I would have passed'.","mashqlar":[{"savol":"If I ___ harder, I would have passed the exam.","variantlar":["have studied","studied","had studied","would study"],"togri":2,"izoh":"If qismida had + V3: had studied."},{"savol":"If she had left earlier, she ___ the train.","variantlar":["would catch","would have caught","caught","had caught"],"togri":1,"izoh":"Natija qismida would have + V3."},{"savol":"We wouldn't have got wet if we ___ an umbrella.","variantlar":["had taken","would take","would have taken","took"],"togri":0,"izoh":"If qismida had taken."},{"savol":"If he ___ me, I would have helped him.","variantlar":["asked","had asked","has asked","would ask"],"togri":1,"izoh":"If qismida had asked."}]},{"raqam":35,"sarlavha":"Istak va afsus — wish / if only","daraja":"B2","tayyor":true,"qoida":"📌 Istak va afsus — ikki xil zamon bor.\n\nHozirgi holatdan norozilik: wish + Past Simple\n▸ I wish I were rich. (Boy bo'lsam edi deb xohlayman.)\n▸ I wish I had more free time. (Ko'proq bo'sh vaqtim bo'lsa edi deb xohlayman.)\n\nO'tmishdagi afsus: wish + had + 3-shakl\n▸ I wish I had studied harder. (Ko'proq o'qiganimda deb afsuslanaman.)\n▸ She wishes she had taken the job. (U o'sha ishni olganida deb afsuslanadi.)\n\nif only — kuchli istak: If only I knew the answer. (Javobni bilsam edi.)","ogatish":"2 qadam:\n1) Istak hozirgi holat haqidami yoki o'tmish haqidami?\n2) Hozirgi bo'lsa — Past Simple (were ham mumkin). O'tmish bo'lsa — had + 3-shakl.\n\nMasalan: I wish it would stop raining. (Yomg'ir to'xtasa edi.) / If only I could help you. (Yordam bera olsam edi.) / I wish I had known earlier.\n\nEslab qoling: 'I wish I could' — hozir qila olmayman, shundan norozilik.","misollar":[{"ingliz":"I wish I had more free time.","uzbek":"Qani endi bo'sh vaqtim ko'proq bo'lsa."},{"ingliz":"I wish I had studied harder last year.","uzbek":"Qani endi o'tgan yili qattiqroq o'qiganimda edi."},{"ingliz":"I wish it would stop raining.","uzbek":"Qani endi yomg'ir to'xtasa."},{"ingliz":"If only I could help you.","uzbek":"Qani endi sizga yordam bera olsam."}],"xato":"O'zbekchada 'qani endi' bilan fe'l shakli o'zgarmay qoladi. Inglizchada wish dan keyin zamon bir pog'ona orqaga suriladi. Xato: 'I wish I have a car', 'I wish I can help'. To'g'risi: 'I wish I had a car', 'I wish I could help'.","mashqlar":[{"savol":"I wish I ___ more free time now.","variantlar":["had","will have","would have","have"],"togri":0,"izoh":"Hozirgi norozilik: wish + Past Simple (had)."},{"savol":"(afsus) I wish I ___ harder last year.","variantlar":["study","would study","studied","had studied"],"togri":3,"izoh":"O'tmish afsusi: wish + Past Perfect (had studied)."},{"savol":"I wish it ___ raining. (shikoyat)","variantlar":["stopping","stops","would stop","has stop"],"togri":2,"izoh":"Shikoyat: wish + would + fe'l."},{"savol":"I wish I ___ you, but I don't know the answer.","variantlar":["can help","could help","will help","helped"],"togri":1,"izoh":"Wish dan keyin can emas, could."}]},{"raqam":36,"sarlavha":"Taxmin qilish — must / might / can't be","daraja":"B2","tayyor":true,"qoida":"📌 Taxmin qilish — gapning ishonch darajasi qanday. Hozirgi yoki o'tmishdagi taxmin uchun modal + be yoki have + 3-shakl.\n\nmust be — juda ishonchli (deyarli aniq): She must be tired. (Charchagan bo'lsa kerak.)\nmight / may / could be — balki: He might be at home. (Uyda bo'lishi mumkin.)\ncan't be — ishonmaslik: He can't be serious. (U jiddiy bo'lishi mumkin emas.)\nO'tmish taxmini: must have + 3-shakl: They must have left.","ogatish":"2 qadam:\n1) Taxmin qanchalik ishonchli? Juda → must; balki → might/may/could; ishonchsiz/inkor → can't.\n2) Hozirgi bo'lsa — modal + be; o'tmish bo'lsa — modal + have + 3-shakl.\n\nMasalan: He must be hungry. / It might be true. / That can't be right.\n\nEslab qoling: must be yoki can't be — taxmin uchun; must (majburiyat) bilan adashtirmang: You must be here by 9.","misollar":[{"ingliz":"He works 12 hours a day. He must be very tired.","uzbek":"U kuniga 12 soat ishlaydi. U juda charchagan bo'lsa kerak."},{"ingliz":"That can't be Ali's car. He doesn't have one.","uzbek":"Bu Alining mashinasi bo'la olmaydi. Uning mashinasi yo'q."},{"ingliz":"I'm not sure where he is. He might be at the library.","uzbek":"U qayerda ekanini bilmayman. Kutubxonada bo'lishi mumkin."},{"ingliz":"The ground is wet. It must have rained last night.","uzbek":"Yer ho'l. Kecha yomg'ir yoqqan bo'lsa kerak."}],"xato":"O'zbekchada 'bo'lsa kerak' va 'bo'lishi mumkin' ko'pincha aralashib ketadi, inglizchada esa must (deyarli aniq), might (ehtimol) va can't (mumkin emas) alohida. Yana: must dan keyin to qo'yilmaydi va o'tmishda must have + V3 kerak. Xato: 'He must to be tired', 'It must rained'. To'g'risi: 'He must be tired', 'It must have rained'.","mashqlar":[{"savol":"He works 12 hours every day. He ___ very tired.","variantlar":["can't be","must to be","must be","might to be"],"togri":2,"izoh":"Dalil bor, xulosa deyarli aniq: must be."},{"savol":"That ___ be Ali's car. Ali doesn't have a car.","variantlar":["must","might","can't","should"],"togri":2,"izoh":"Dalil teskarisini aytyapti: can't be."},{"savol":"I'm not sure where Ali is. He ___ at the library.","variantlar":["can't be","will be","might be","must be"],"togri":2,"izoh":"Ishonch yo'q: might be."},{"savol":"The ground is wet. It ___ last night.","variantlar":["can't have rained","might rains","must have rained","must rain"],"togri":2,"izoh":"O'tmish haqida xulosa: must have + V3."}]},{"raqam":37,"sarlavha":"Boshqa kishiga qildirish — have / get something done","daraja":"B2","tayyor":true,"qoida":"📌 Kimgadir biror ishni qildirish — o'zingiz qilmasdan, boshqa odamga topshirasiz. Ko'pincha xizmat olishda ishlatiladi.\n\nhave + ob'ekt + 3-shakl:\n▸ I had my car repaired. (Mashinamni ta'mirlatdim.)\n▸ She is having her hair cut. (U sochini oldirmoqda.)\n\nget + ob'ekt + 3-shakl (og'zaki):\n▸ I got my hair cut. (Sochimni oldirdim.)\n▸ We got the windows cleaned. (Derazalarni tozalattik.)","ogatish":"🧭 2 qadam:\n1) Ish o'zingiz qilganmi yoki boshqa odam? Boshqa odam → have yoki get.\n2) Ob'ektdan keyin 3-shaklni qo'ying: have the windows cleaned, get the car fixed.\n\nMasalan: He has his teeth checked every six months. / We are having the house painted. / I need to get my phone repaired.\n\nEslab qoling: get ko'proq og'zaki, have rasmiyroq. Ikkalasi ham to'g'ri.","misollar":[{"ingliz":"I had my car repaired yesterday.","uzbek":"Men kecha mashinamni ustaga tuzattirdim."},{"ingliz":"She is going to have her hair cut.","uzbek":"U sochini oldirmoqchi."},{"ingliz":"He has his teeth checked every six months.","uzbek":"U har olti oyda tishlarini tekshirtiradi."},{"ingliz":"We are having the house painted.","uzbek":"Biz uyni bo'yatyapmiz."}],"xato":"O'zbekchada '-dirmoq' qo'shimchasi bor ('tuzattirdim', 'oldirdim'), lekin ko'pchilik inglizchada oddiy fe'l ishlatib, o'zi qilgan ma'nosini beradi. Xato: 'I cut my hair at the barber's' (o'zingiz kesgandek). To'g'risi: 'I had my hair cut at the barber's'.","mashqlar":[{"savol":"I ___ my car repaired yesterday.","variantlar":["made","was","did","had"],"togri":3,"izoh":"Boshqa kishi tuzatgan: had + narsa + V3."},{"savol":"She is going to ___ her hair cut.","variantlar":["have","had","having","has"],"togri":0,"izoh":"Going to dan keyin fe'lning oddiy shakli: have."},{"savol":"He ___ his teeth checked every six months.","variantlar":["is","does","has","makes"],"togri":2,"izoh":"Odat, he bilan has + narsa + V3."},{"savol":"Qaysi gap 'sartarosh kesdi' ma'nosini beradi?","variantlar":["I cut my hair at home.","I cut my hair myself.","I had my hair cut.","I was cutting hair."],"togri":2,"izoh":"Boshqa kishi qilgan ishni have + narsa + V3 bildiradi."}]},{"raqam":38,"sarlavha":"Ma'noni o'zgartiruvchi fe'llar — stop / remember / try","daraja":"B2","tayyor":true,"qoida":"📌 Ba'zi fe'llar keyingi shaklga qarab ma'nosini butunlay o'zgartiradi:\n\nstop doing — qilishni to'xtatish: I stopped smoking. (Chekishni tashladim.)\nstop to do — to'xtab, boshqa ish qilish: I stopped to buy bread. (To'xtab non oldim.)\nremember doing — o'tmishdagi ishni eslash: I remember locking the door. (Eshikni qulflaganimni eslayman.)\nremember to do — eslab, qilish kerak: Remember to lock the door. (Eshikni qulflashni esda tuting.)\ntry doing — sinab ko'rish: Try using this app. (Bu ilovani sinab ko'ring.)\ntry to do — harakat qilish (qiyin bo'lishi mumkin): I tried to open it. (Ochishga harakat qildim.)","ogatish":"2 qadam:\n1) Gapda ish allaqachon bo'lganmi (-ing) yoki hali qilish kerakmi (to)?\n2) Stop, remember, try uchun ikkala ma'noni eslab qoling.\n\nMasalan: I stopped to buy bread. / Remember to call her. / I tried calling him, but he didn't answer.\n\nEslab qoling: ma'no farqi tushunish uchun muhim, ayniqsa imtihonda.","misollar":[{"ingliz":"He stopped smoking last year.","uzbek":"U o'tgan yili chekishni tashladi."},{"ingliz":"I must remember to post the letter.","uzbek":"Xatni jo'natishni unutmasligim kerak."},{"ingliz":"I remember locking the door. I'm sure it was locked.","uzbek":"Eshikni qulflaganimni eslayman. Aniq qulflangan."},{"ingliz":"Try drinking a glass of warm milk. It might help you sleep.","uzbek":"Bir stakan iliq sut ichib ko'ring. Uxlashga yordam berishi mumkin."}],"xato":"O'zbekchada 'to'xtadi', 'esladi', 'urinib ko'rdi' ikkala ma'noda ham bir xil shaklda. Inglizchada shakl ma'noni o'zgartiradi. Xato: 'I stopped to smoke' ('chekishni tashladim' ma'nosida). To'g'risi: 'I stopped smoking'.","mashqlar":[{"savol":"He doesn't smoke now. He stopped ___ last year.","variantlar":["smoking","to smoke","smoked","smoke"],"togri":0,"izoh":"Tashlagan: stop + -ing."},{"savol":"I must remember ___ the letter. It's important.","variantlar":["post","to post","posting","to posting"],"togri":1,"izoh":"Hali bajarilmagan ishni unutmaslik: remember + to."},{"savol":"I remember ___ the door. I'm sure it was locked.","variantlar":["lock","locked","locking","to lock"],"togri":2,"izoh":"Bajarilgan ishni eslash: remember + -ing."},{"savol":"Why don't you try ___ a glass of warm milk (tajriba qilib ko'ring)? It might help you sleep.","variantlar":["to drink","drank","drink","drinking"],"togri":3,"izoh":"Sinab ko'rish: try + -ing."}]},{"raqam":39,"sarlavha":"Inversiya — Never have I ... / Not only ... but","daraja":"C1","tayyor":true,"qoida":"📌 Ta'kidlash uchun gap tartibi o'zgaradi. Ta'kidlovchi so'z gap boshiga chiqadi va yordamchi fe'l egadan oldin keladi. Bu rasmiy va adabiy uslubda ko'p uchraydi.\n\n▸ Never have I seen such a beautiful place. (Hech qachon bunday go'zal joyni ko'rmaganman.)\n▸ Rarely do we eat out. (Kamdan-kam tashqarida ovqatlanamiz.)\n▸ Not only did he win, but he also set a record. (U nafaqat g'olib bo'ldi, balki rekord ham o'rnatdi.)","ogatish":"🧭 Qadam-baqadam:\n1) Gap boshida ta'kid so'zi bormi: never, rarely, seldom, not only, hardly, no sooner, only then?\n2) Ta'kid so'zdan keyin yordamchi fe'l (have, do, did, is, had) keladi, keyin ega, keyin fe'l.\n3) Oddiy gapdagi tartibni teskari qiling: I have never seen → Never have I seen.\n\nMasalan: Hardly had I arrived when it started raining. / Seldom do we see such honesty. / No sooner had she sat down than the phone rang.\n\nEslab qoling: ushbu tartib nutqda kam ishlatiladi, lekin yozma matnlarda va imtihonda uchraydi.","misollar":[{"ingliz":"Never have I seen such a beautiful place.","uzbek":"Men hech qachon bunday go'zal joyni ko'rmaganman."},{"ingliz":"Not only did he arrive late, but he also forgot the documents.","uzbek":"U nafaqat kech keldi, balki hujjatlarni ham unutdi."},{"ingliz":"No sooner had she opened the door than the phone rang.","uzbek":"U eshikni ochishi bilan telefon jiringladi."},{"ingliz":"Rarely do we see such honesty in politics.","uzbek":"Siyosatda bunday halollikni juda kam ko'ramiz."}],"xato":"O'zbekchada so'z tartibi erkin va inkor so'z boshiga chiqsa ham tartib o'zgarmaydi. Inglizchada o'zgaradi. Xato: 'Never I have seen', 'Not only he arrived late'. To'g'risi: 'Never have I seen', 'Not only did he arrive late'. Bu asosan yozma va rasmiy nutqda ishlatiladi.","mashqlar":[{"savol":"Never ___ such a beautiful place.","variantlar":["have I seen","I saw","did I seen","I have seen"],"togri":0,"izoh":"Never gap boshida: have + ega + V3."},{"savol":"Not only ___ late, but he also forgot the documents.","variantlar":["he arrived","he did arrive","arrived he","did he arrive"],"togri":3,"izoh":"Not only gap boshida: did + ega + oddiy fe'l."},{"savol":"No sooner had she opened the door ___ the phone rang.","variantlar":["than","when","then","that"],"togri":0,"izoh":"No sooner ... than: no sooner had she opened ... than the phone rang."},{"savol":"Rarely ___ such honesty in politics.","variantlar":["we do see","do we see","we see","see we"],"togri":1,"izoh":"Rarely gap boshida: do + ega + oddiy fe'l."}]},{"raqam":40,"sarlavha":"Aralash shart gaplar — Mixed Conditionals","daraja":"C1","tayyor":true,"qoida":"📌 Aralash shart — o'tmishdagi shart va hozirgi natija (yoki aksincha). Hayotiy holatlarni tasvirlash uchun ishlatiladi.\n\nIf + Past Perfect, would + fe'l (o'tmish shart, hozirgi natija):\n▸ If I had studied harder, I would be a doctor now. (Ko'proq o'qiganimda, hozir shifokor bo'lardim.)\n▸ If she had taken the job in Dubai, she would live there now. (Dubayda ishni olganida, hozir o'sha yerda yashardi.)\n\nIf + Past Simple, would have + 3-shakl (hozirgi shart, o'tmish natija):\n▸ If I were more careful, I would have avoided the accident. (Ehtiyotkor bo'lganimda, avariyadan qochgan bo'lardim.)\n▸ If he hadn't missed the train, he would be at work now. (Poyezdni qoldirmaganida, hozir ishda bo'lardi.)","ogatish":"2 qadam:\n1) Shart qaysi zamonga tegishli: o'tmish bo'lsa had + 3-shakl; hozir bo'lsa Past Simple.\n2) Natija qaysi zamonga tegishli: hozir bo'lsa would + fe'l; o'tmish bo'lsa would have + 3-shakl.\n\nEslab qoling: ikki qism bir-biriga mos kelmasligi aralash shartning belgisi.","misollar":[{"ingliz":"If I had studied medicine, I would be a doctor now.","uzbek":"Agar tibbiyotni o'qiganimda, hozir shifokor bo'lardim."},{"ingliz":"If she had taken the job in Dubai, she would live there now.","uzbek":"Agar u Dubaydagi ishni olganida, hozir o'sha yerda yashardi."},{"ingliz":"If I were more careful, I wouldn't have made that mistake.","uzbek":"Agar ehtiyotkorroq bo'lsam, o'sha xatoni qilmagan bo'lardim."},{"ingliz":"If he hadn't missed the train, he would be at work now.","uzbek":"Agar u poyezdga kech qolmaganida, hozir ishda bo'lardi."}],"xato":"O'zbekchada '-sa' va '-ardi' qo'shimchalari har xil vaqtni bir xilda ifodalaydi, shuning uchun aralash shartni sezmaymiz. Xato: 'If I had studied medicine, I would have been a doctor now' (now bilan would have been emas, would be). To'g'risi: 'I would be a doctor now'.","mashqlar":[{"savol":"If I had studied medicine, I ___ a doctor now.","variantlar":["was","would be","would have been","will be"],"togri":1,"izoh":"Shart o'tmishda, natija hozir: would be."},{"savol":"If she had taken the job in Dubai, she ___ there now.","variantlar":["would live","would have lived","lived","will live"],"togri":0,"izoh":"Natija hozirga tegishli: would live."},{"savol":"If I were more careful, I ___ that mistake yesterday.","variantlar":["wouldn't have made","won't make","didn't make","wouldn't make"],"togri":0,"izoh":"Natija o'tmishda: would not have + V3."},{"savol":"If he ___ the train, he would be at work now.","variantlar":["didn't miss","wouldn't miss","doesn't miss","hadn't missed"],"togri":3,"izoh":"Shart o'tmishda: had not + V3."}]},{"raqam":41,"sarlavha":"Shartli gap: umumiy haqiqatlar — Zero Conditional","daraja":"A2","tayyor":true,"qoida":"📌 Zero Conditional — har doim to'g'ri bo'ladigan haqiqat yoki umumiy qoida. Ilmiy va kundalik haqiqatlarda ishlatiladi.\n\nTuzilishi: If + Present Simple, Present Simple\n▸ If you heat water, it boils. (Suvni qizdirsangiz, u qaynaydi.)\n▸ If I am tired, I sleep. (Charchasam, uxlayman.)\n▸ When water freezes, it becomes ice. (Suv muzlaganda, u muzga aylanadi.)\n\nIf o'rniga when yoki whenever ham mumkin.","ogatish":"🧭 Qadam-baqadam:\n1) Gap har doim to'g'ri bo'ladigan qoidami? Ha bo'lsa, zero conditional.\n2) Ikkala qismda ham oddiy zamon ishlating.\n3) if o'rniga when yoki whenever mumkin.\n4) Kelajak uchun will ishlatilmaydi odatda, chunki bu umumiy qoida: Plants die if they don't get water.\n\nEslab qoling: bu zamon 'shart' emas, balki 'qoida'ni bildiradi.","misollar":[{"ingliz":"If you heat water to 100°C, it boils.","uzbek":"Suvni 100°C gacha qizdirsangiz, u qaynaydi."},{"ingliz":"If I am tired, I go to bed early.","uzbek":"Charchasam, erta yotaman."},{"ingliz":"Plants die if they don't get water.","uzbek":"O'simliklar suv olmasa, nobud bo'ladi."},{"ingliz":"If it rains, the streets get wet.","uzbek":"Yomg'ir yog'sa, ko'chalar ho'l bo'ladi."}],"xato":"Zero conditionalda 'will' ishlatilmaydi: 'If it will rain' emas, 'If it rains' to'g'ri.","mashqlar":[{"savol":"If you mix red and blue, you ___ purple.","variantlar":["will get","get","got","are getting"],"togri":1,"izoh":"Umumiy haqiqat: if + present, present."},{"savol":"Ice ___ when it is warm.","variantlar":["melts","will melt","melted","is melting"],"togri":0,"izoh":"Doimiy haqiqat — hozirgi oddiy zamon."},{"savol":"If she is late, she always ___ sorry.","variantlar":["is","will be","was","be"],"togri":0,"izoh":"Har doim sodir bo'ladigan natija: 'is sorry' (present)."},{"savol":"If the sun sets, it ___ dark.","variantlar":["gets","will get","got","get"],"togri":0,"izoh":"Tabiiy qonuniyat — 'gets' (present)."}]},{"raqam":42,"sarlavha":"Zidlik: Although, Despite, However — ziddiyatli gaplar","daraja":"B1","tayyor":true,"qoida":"📌 Zidlik va qarshilik — \"garchi ... bo'lsa ham\", \"shunga qaramay\" ma'nosi.\n\nAlthough + gap (ega + fe'l):\n▸ Although it was raining, we went out. (Yomg'ir yog'sa ham, chiqdik.)\n▸ Although she was tired, she kept working. (Charchagan bo'lsa ham, ishlashda davom etdi.)\n\nDespite / In spite of + ot yoki -ing:\n▸ Despite the rain, we went out. (Yomg'irga qaramay, chiqdik.)\n▸ In spite of being tired, she finished the work. (Charchagan bo'lsa ham, ishni tugatdi.)\n\nHowever (yangi gap boshida): It was raining. However, we went out.","ogatish":"🧭 Qadam-baqadam:\n1) Keyingi qism gap (ega + fe'l) bo'lsa — although yoki even though.\n2) Keyingi qism ot yoki -ing bo'lsa — despite yoki in spite of.\n3) However yangi gap boshida va vergul bilan: However, we went out.\n\nMasalan: Despite the fact that it was raining, we went out. / The plan was good. However, it was too expensive.\n\nEslab qoling: 'Despite of' xato. Despite to'g'ridan-to'g'ri keyingi so'z bilan ishlatiladi.","misollar":[{"ingliz":"Although it was raining, we went out.","uzbek":"Yomg'ir yog'sa ham, biz chiqdik."},{"ingliz":"Despite the rain, we went out.","uzbek":"Yomg'irga qaramay, biz chiqdik."},{"ingliz":"In spite of being tired, she finished the work.","uzbek":"Charchagan bo'lsa ham, u ishni tugatdi."},{"ingliz":"The plan was good. However, it was too expensive.","uzbek":"Reja yaxshi edi. Biroq juda qimmat edi."}],"xato":"'Despite it was raining' — noto'g'ri. Despite dan keyin gap emas, ot yoki -ing keladi: 'Despite the rain' yoki 'Despite the fact that it was raining'.","mashqlar":[{"savol":"___ the cold weather, they went swimming.","variantlar":["Although","Despite","However","But"],"togri":1,"izoh":"Despite + ot (the cold weather)."},{"savol":"___ it was late, we continued talking.","variantlar":["Despite","Although","In spite","However"],"togri":1,"izoh":"Although + gap (it was late)."},{"savol":"She was ill. ___, she went to work.","variantlar":["Although","Despite","However","In spite"],"togri":2,"izoh":"However, gap boshida, vergul bilan."},{"savol":"___ of his experience, he didn't get the job.","variantlar":["Although","Despite","However","Because"],"togri":1,"izoh":"Despite / in spite of + ot — 'Despite of' emas, shunchaki 'Despite'."}]},{"raqam":43,"sarlavha":"Maqsad va natija: to, so that, so ... that, such ... that","daraja":"B1","tayyor":true,"qoida":"📌 Ikki xil ma'no bor:\n\nMaqsad (nima uchun): to yoki so that\n▸ I study hard to pass the exam. (Imtihondan o'tish uchun o'qiyman.)\n▸ She saved money in order to buy a car. (Mashina sotib olish uchun pul yig'di.)\n\nNatija (oqibat): so + sifat + that; such + ot + that\n▸ It was so cold that we stayed home. (Shunchalik sovuq ediki, uyda qoldik.)\n▸ It was such a beautiful day that we went to the park. (Shunchalik go'zal kun ediki, bog'ga bordik.)","ogatish":"2 qadam:\n1) Gap nima uchun? → to yoki so that. Oqibat qanday? → so yoki such ... that.\n2) Sifat bo'lsa — so (so tired that). Ot bo'lsa — such, a/an bilan (such a nice day that).\n\nEslab qoling: so that dan keyin odatda can yoki will keladi: so that I can travel.","misollar":[{"ingliz":"I study hard to pass the exam.","uzbek":"Imtihondan o'tish uchun ko'p o'qiyman."},{"ingliz":"She saved money in order to buy a car.","uzbek":"Mashina sotib olish uchun pul jamg'arib qo'ydi."},{"ingliz":"He spoke slowly so that everyone could understand.","uzbek":"Hamma tushunishi uchun u sekin gapirdi."},{"ingliz":"It was such a beautiful day that we went to the park.","uzbek":"Shunday go'zal kun ediki, biz bog'ga bordik."}],"xato":"'So a beautiful day' emas — 'such a beautiful day'. Ot bo'lsa 'such', sifat yoki ravish bo'lsa 'so' ishlatiladi.","mashqlar":[{"savol":"I went to the library ___ borrow some books.","variantlar":["to","for","so","that"],"togri":0,"izoh":"Maqsad: to + fe'l."},{"savol":"She was ___ tired that she fell asleep at once.","variantlar":["so","such","very","too"],"togri":0,"izoh":"'Tired' — sifat, shuning uchun 'so'."},{"savol":"It was ___ a difficult question that nobody could answer.","variantlar":["so","such","too","enough"],"togri":1,"izoh":"'Question' — ot, shuning uchun 'such a'."},{"savol":"We left early ___ we would not miss the bus.","variantlar":["so that","so","such","in"],"togri":0,"izoh":"Maqsad: so that + gap."}]},{"raqam":44,"sarlavha":"Present Perfect yoki Past Simple?","daraja":"B1","tayyor":true,"qoida":"📌 Ikkalasi ham o'tmish haqida, lekin farqi bor:\n\nPast Simple — aniq vaqt bor, ish tugagan:\n▸ I lost my keys yesterday. (Kecha kalitlarimni yo'qotdim.)\n▸ We visited Samarkand in 2019. (2019-yilda Samarqandga bordik.)\n\nPresent Perfect — aniq vaqt yo'q yoki natijasi hozir ham bor:\n▸ I have lost my keys. (Kalitlarimni yo'qotganman — hozir ham topolmayapman.)\n▸ She has visited London twice. (U Londonda ikki marta bo'lgan.)","ogatish":"2 qadam:\n1) Gapda aniq vaqt bormi (yesterday, last week, in 2010)? Ha → Past Simple.\n2) Aniq vaqt yo'q va ish hozirgi holatga ta'sir qilyaptimi? Ha → Present Perfect.\n\nEslab qoling: 'Have you ever...?' ko'pincha Present Perfect bo'ladi.","misollar":[{"ingliz":"I have visited London twice.","uzbek":"London'ga ikki marta borganman (qachon ekani aytilmagan)."},{"ingliz":"I visited London in 2019.","uzbek":"2019-yilda London'ga borganman (aniq yil)."},{"ingliz":"She has lost her keys, so she can't open the door.","uzbek":"Kalitini yo'qotgan, shuning uchun eshikni ocholmayapti."},{"ingliz":"Have you finished yet?","uzbek":"Hali tugatdingizmi?"}],"xato":"'I have seen him yesterday' — noto'g'ri. Aniq vaqt (yesterday) bilan Present Perfect ishlatilmaydi: 'I saw him yesterday'.","mashqlar":[{"savol":"I ___ my homework yesterday.","variantlar":["have finished","finished","finish","was finishing"],"togri":1,"izoh":"'Yesterday' — aniq vaqt, Past Simple."},{"savol":"___ you ever ___ sushi?","variantlar":["Did / eat","Have / eaten","Were / eat","Do / eat"],"togri":1,"izoh":"'Ever' — vaqt aytilmagan: Have + V3."},{"savol":"They ___ to Samarkand last summer.","variantlar":["have been","went","have gone","are going"],"togri":1,"izoh":"'Last summer' — aniq vaqt, Past Simple."},{"savol":"She ___ her keys, so she can't get in.","variantlar":["lost","has lost","loses","was losing"],"togri":1,"izoh":"Hozirgi natija (kalit yo'q) — Present Perfect."}]},{"raqam":45,"sarlavha":"Afzallik ifodalash: prefer, would rather, had better","daraja":"B2","tayyor":true,"qoida":"📌 Afzallik va maslahat ifodalari:\n\nprefer: afzal ko'rish\n▸ I prefer tea to coffee. (Qahvadan ko'ra choyni afzal ko'raman.)\n▸ I prefer reading to watching TV. (Televizor ko'rishdan ko'ra o'qishni afzal ko'raman.)\n\nwould rather + fe'l: bir harakatni boshqasidan afzal ko'rish\n▸ I would rather stay home. (Uyda qolganim afzal.)\n\nhad better + fe'l: kuchli maslahat yoki ogohlantirish\n▸ You had better leave now. (Hozir ketganingiz ma'qul; aks holda muammo bo'ladi.)\n▸ You had better take an umbrella. (Soyabon olganingiz yaxshi.)","ogatish":"2 qadam:\n1) Afzallik ikki narsani solishtiradimi? → prefer ... to. Bitta harakat haqidami? → would rather.\n2) Ogohlantirish yoki qattiq maslahat bo'lsa → had better. Undan keyin fe'l oddiy shaklda keladi: had better go (goes emas).\n\nEslab qoling: had better tarkibida had ham, better ham bor. Had better ni 'had' bilan birga yozing.","misollar":[{"ingliz":"I'd rather stay at home tonight.","uzbek":"Bugun kechqurun uyda qolganim ma'qul."},{"ingliz":"You had better take an umbrella.","uzbek":"Soyabon olganing ma'qul (yomg'ir yog'ishi mumkin)."},{"ingliz":"I prefer reading books to watching TV.","uzbek":"Televizor ko'rishdan ko'ra kitob o'qishni afzal ko'raman."},{"ingliz":"She prefers to travel by train.","uzbek":"U poezdda sayohat qilishni afzal ko'radi."}],"xato":"'I'd rather to stay' va 'You had better to go' — noto'g'ri. 'To' qo'yilmaydi: 'I'd rather stay', 'You had better go'.","mashqlar":[{"savol":"I'd rather ___ tea than coffee.","variantlar":["drink","to drink","drinking","drank"],"togri":0,"izoh":"would rather + fe'l (to'siz)."},{"savol":"You'd better ___ now, or you'll be late.","variantlar":["leave","to leave","leaving","left"],"togri":0,"izoh":"had better + fe'l (to'siz)."},{"savol":"We'd better ___ the meeting before it's too late.","variantlar":["cancel","to cancel","cancelling","cancelled"],"togri":0,"izoh":"had better + fe'l (to'siz)."},{"savol":"I'd rather ___ at home than go out.","variantlar":["stay","to stay","staying","stayed"],"togri":0,"izoh":"would rather + fe'l (to'siz)."}]},{"raqam":46,"sarlavha":"Bog'lovchi so'zlar: however, moreover, therefore, as a result","daraja":"B2","tayyor":true,"qoida":"📌 Gaplarni mantiqan bog'lash uchun ishlatiladi. Yangi gap boshida keladi va odatda vergul bilan ajratiladi.\n\nHowever — ammo, shunga qaramay (qarshilik)\n▸ It was late. However, we continued.\n\nMoreover — bundan tashqari (qo'shimcha)\n▸ The food was good. Moreover, it was cheap.\n\nTherefore — shuning uchun (sabab-natija)\n▸ It rained. Therefore, we stayed home.\n\nAs a result — natijada\n▸ He studied hard. As a result, he passed.","ogatish":"2 qadam:\n1) Gap qanday bog'lanmoqda? Qarshilik → however; qo'shimcha → moreover; sabab-natija → therefore yoki as a result.\n2) Yangi gap boshida, vergul bilan. Bu so'zlar bilan ikki gapni vergulda bog'lamang.\n\nMasalan: It rained all day. As a result, the match was cancelled. / She studies every day; therefore, she has improved a lot.","misollar":[{"ingliz":"The test was difficult. However, most students passed.","uzbek":"Test qiyin edi. Biroq ko'pchilik o'tdi."},{"ingliz":"The price is high. Moreover, the quality is poor.","uzbek":"Narx yuqori. Bundan tashqari, sifati past."},{"ingliz":"It rained all day. As a result, the match was cancelled.","uzbek":"Kun bo'yi yomg'ir yog'di. Natijada o'yin bekor qilindi."},{"ingliz":"She studies every day; therefore, she has improved a lot.","uzbek":"U har kuni o'qiydi, shuning uchun ancha yaxshilangan."}],"xato":"'It was late, however we left' — noto'g'ri (vergul bilan ikki mustaqil gapni bog'lash). To'g'risi: 'It was late. However, we left.'","mashqlar":[{"savol":"The food was cheap. ___, it was very tasty.","variantlar":["Therefore","Moreover","Because","Although"],"togri":1,"izoh":"Qo'shimcha ma'lumot — moreover."},{"savol":"The plan sounds good. ___, it is very expensive.","variantlar":["However","Therefore","Moreover","Since"],"togri":0,"izoh":"Qarama-qarshilik — however."},{"savol":"It snowed heavily. ___, the roads were closed.","variantlar":["As a result","However","Despite","Also"],"togri":0,"izoh":"Natija — as a result."},{"savol":"She studies every day; ___, she has improved a lot.","variantlar":["therefore","although","despite","unless"],"togri":0,"izoh":"Natija — therefore."}]},{"raqam":47,"sarlavha":"Qo'shilish: So do I / Neither do I","daraja":"A2","tayyor":true,"qoida":"📌 So do I / Neither do I — birovning fikriga qo'shilish. Gapni takrorlamaslik uchun ishlatiladi.\n\nIjobiy gapga qo'shilish — so:\n▸ I like tea. → So do I. (Men ham.)\n▸ I'm hungry. → So am I. (Men ham och.)\n\nSalbiy gapga qo'shilish — neither:\n▸ I don't like coffee. → Neither do I. (Men ham yoqtirmayman.)\n▸ I can't swim. → Neither can I. (Men ham suzolmayman.)\n\nYordamchi fe'l gapning zamoni va egasiga qarab o'zgaradi: She can swim → So can I. I was tired → So was I.","ogatish":"🧭 Qadam-baqadam:\n1) Gap ijobiymi yoki inkormi? Ijobiy → so; inkor → neither.\n2) Asosiy gapda qaysi fe'l bor? Shu fe'lga mos yordamchi fe'l tanlang: do, does, did, can, is, was, will.\n3) Yordamchi fe'l va egani almashtiring: so + yordamchi fe'l + ega.\n\nEslab qoling: 'So I do' yoki 'Neither I do' xato. Tartib: so/neither + yordamchi fe'l + ega.","misollar":[{"ingliz":"I love pizza. — So do I.","uzbek":"Men ham pitsani yoqtiraman."},{"ingliz":"I can't swim. — Neither can I.","uzbek":"Men ham suzolmayman."},{"ingliz":"I'm hungry. — So am I.","uzbek":"Men ham ochman."},{"ingliz":"I haven't seen the film. — Neither have I.","uzbek":"Men ham filmni ko'rmaganman."}],"xato":"'So I do' yoki 'Neither I don't' noto'g'ri. Yordamchi fe'l ega oldida keladi: 'So do I', 'Neither have I'.","mashqlar":[{"savol":"I love pizza. — So ___ I.","variantlar":["do","am","did","have"],"togri":0,"izoh":"Birinchi gap hozirgi oddiy zamon: do."},{"savol":"I didn't finish the book. — Neither ___ I.","variantlar":["did","do","was","am"],"togri":0,"izoh":"O'tgan zamon salbiy: Neither did I."},{"savol":"I'm hungry. — So ___ I.","variantlar":["am","do","is","have"],"togri":0,"izoh":"'I'm hungry' — am: So am I."},{"savol":"We haven't seen the film. — Neither ___ we.","variantlar":["have","had","do","are"],"togri":0,"izoh":"Present Perfect salbiy: Neither have we."}]},{"raqam":48,"sarlavha":"Used to, be used to, get used to","daraja":"B1","tayyor":true,"qoida":"📌 Uchta o'xshash, lekin turli ma'noli ibora:\n\nused to + fe'l: o'tmishdagi odat, hozir yo'q\n▸ I used to smoke. (Ilgari chekardim.)\n▸ She used to live in Bukhara. (U ilgari Buxoroda yashardi.)\n\nbe used to + -ing yoki ot: hozir odatlangan\n▸ I am used to waking up early. (Erta turishga odatlanganman.)\n▸ He is used to the noise. (U shovqinga odatlangan.)\n\nget used to + -ing yoki ot: odatlanish jarayoni\n▸ I am getting used to the new city. (Yangi shaharga odatlanyapman.)","ogatish":"2 qadam:\n1) Gap o'tmish odati haqidami va hozir yo'qmi? → used to + fe'l.\n2) Hozir odatlangan bo'lsangiz → be used to; odatlanish jarayonida bo'lsangiz → get used to. Keyin -ing yoki ot keladi.\n\nEslab qoling: be va get zamonga qarab o'zgaradi: was used to, got used to.","misollar":[{"ingliz":"I used to live in Andijan.","uzbek":"Men Andijonda yashardim (endi yashamayman)."},{"ingliz":"I'm used to waking up early.","uzbek":"Men erta uyg'onishga ko'nikkanman."},{"ingliz":"It took me months to get used to the cold.","uzbek":"Sovuqqa ko'nikish uchun menga bir necha oy kerak bo'ldi."},{"ingliz":"She is used to working under pressure.","uzbek":"U bosim ostida ishlashga odatlangan."}],"xato":"'I'm used to wake up' noto'g'ri — be used to dan keyin -ing: 'I'm used to waking up'. 'Use to' (s harfsiz) ham xato.","mashqlar":[{"savol":"I ___ smoke, but I quit last year.","variantlar":["used to","use to","am used to","get used"],"togri":0,"izoh":"O'tmishdagi odat: used to + fe'l."},{"savol":"It's hard for me, because I'm not ___ getting up early.","variantlar":["used to","use to","usually","used"],"togri":0,"izoh":"'Not used to' + -ing — odatlanmaganman."},{"savol":"It took me a while to ___ the cold weather.","variantlar":["get used to","used to","be used","use to"],"togri":0,"izoh":"Jarayon: get used to + ot."},{"savol":"When I was a child, I ___ play football every day.","variantlar":["used to","am used to","use to","was used"],"togri":0,"izoh":"Bolalikdagi odat: used to + fe'l."}]},{"raqam":49,"sarlavha":"Need, needn't, don't have to, mustn't","daraja":"B1","tayyor":true,"qoida":"📌 Majburiyat va ruxsatning turli shakllari:\n\nneed — kerak (asosan savol va inkorda)\n▸ Do I need a ticket? (Chipta kerakmi?)\n\nneedn't — kerak emas\n▸ You needn't come. (Kelishingiz shart emas.)\n\ndon't have to — majburiy emas (tashqi talab yo'q)\n▸ I don't have to work on Sunday. (Yakshanba kuni ishlashim shart emas.)\n\nmustn't — taqiq\n▸ You mustn't touch this. (Bunga tegish mumkin emas.)","ogatish":"2 qadam:\n1) Gap taqiqmi yoki ixtiyormi? Taqiq → mustn't. Ixtiyor → needn't yoki don't have to.\n2) Keyingi fe'l oddiy shaklda: needn't go, mustn't touch.\n\nMasalan: You don't have to come. / You needn't pay now. / Do we need to bring anything?\n\nEslab qoling: mustn't va don't have to ma'nosi juda farq qiladi.","misollar":[{"ingliz":"You don't have to come.","uzbek":"Kelishing shart emas."},{"ingliz":"You needn't pay now.","uzbek":"Hozir to'lashingiz shart emas."},{"ingliz":"You mustn't smoke here.","uzbek":"Bu yerda chekish man etilgan."},{"ingliz":"Do we need to bring anything?","uzbek":"Biz nimadir olib kelishimiz kerakmi?"}],"xato":"'You mustn't come' — taqiq degani: kelmang. Kerak emas degani uchun 'don't have to' yoki 'needn't' ishlating.","mashqlar":[{"savol":"You ___ pay now; you can pay tomorrow.","variantlar":["needn't","mustn't","can't","shouldn't"],"togri":0,"izoh":"Zarurat yo'q — needn't."},{"savol":"Passengers ___ use phones in the cockpit.","variantlar":["mustn't","don't have to","needn't","couldn't"],"togri":0,"izoh":"Taqiq — mustn't."},{"savol":"___ we need to bring our passports?","variantlar":["Do","Are","Have","Be"],"togri":0,"izoh":"Savol: Do we need to...?"},{"savol":"You ___ to work tomorrow — it's a public holiday.","variantlar":["don't have","mustn't","can't","won't"],"togri":0,"izoh":"Dam olish kuni: majburiy emas — don't have to."}]},{"raqam":50,"sarlavha":"Be supposed to, be allowed to, be able to","daraja":"B1","tayyor":true,"qoida":"📌 Qobiliyat, ruxsat va kutilgan ishni ifodalash:\n\nbe able to — qodir bo'lish, imkoniyat\n▸ I am able to help you. (Yordam bera olaman.)\n▸ She was able to finish early. (U erta tugata oldi.)\n\nbe allowed to — ruxsat\n▸ We are allowed to park here. (Bu yerda turishimizga ruxsat bor.)\n▸ Students are not allowed to use phones. (Talabalarga telefon ishlatishga ruxsat yo'q.)\n\nbe supposed to — kutilgan yoki majburiy ish\n▸ You are supposed to call me. (Menga qo'ng'iroq qilishingiz kerak.)\n▸ We are supposed to meet at 8. (Soat 8 da uchrashishimiz kerak.)","ogatish":"2 qadam:\n1) Gap qobiliyat, ruxsat yoki kutilgan ish haqidami? Qobiliyat → be able to; ruxsat → be allowed to; kutilgan → be supposed to.\n2) Be-fe'lini ega va zamonga moslang: I was able to, they were allowed to, he is supposed to.\n\nMasalan: You are not supposed to bring food here. / I'm able to play the piano.","misollar":[{"ingliz":"We are supposed to meet at 8.","uzbek":"Biz soat 8 da uchrashishimiz kerak (reja)."},{"ingliz":"Students are not allowed to use phones.","uzbek":"Talabalarga telefondan foydalanish ruxsat etilmagan."},{"ingliz":"I'm able to play the piano.","uzbek":"Men pianino chala olaman."},{"ingliz":"You are not supposed to bring food here.","uzbek":"Bu yerga ovqat olib kirish mumkin emas (qoida)."}],"xato":"'You are supposed wear' — noto'g'ri: 'supposed to wear'. Ruxsat uchun 'allowed to' ishlating: 'Students are allowed to...'.","mashqlar":[{"savol":"We are ___ to meet at the station at 8.","variantlar":["supposed","allowed","able","used"],"togri":0,"izoh":"Reja — be supposed to."},{"savol":"Children are ___ to enter the lab without permission.","variantlar":["not allowed","not able","not used","not likely"],"togri":0,"izoh":"Ruxsat yo'q — not allowed to."},{"savol":"I'm ___ to play the piano — I learned it as a child.","variantlar":["able","allowed","supposed","used"],"togri":0,"izoh":"Qobiliyat — be able to."},{"savol":"You are ___ to bring food here — it's against the rules.","variantlar":["not supposed","not able","not used","not likely"],"togri":0,"izoh":"Qoida — not supposed to."}]},{"raqam":51,"sarlavha":"Each, every, all, both, either, neither","daraja":"B1","tayyor":true,"qoida":"📌 Miqdor va yakka-yakkalik so'zlari.\n\neach va every — har biri alohida (birlik fe'l):\n▸ Each student has a book. (Har bir talabada kitob bor.)\n▸ Every day counts. (Har kun muhim.)\n\nall — hamma (ko'plik fe'l):\n▸ All the students are here. (Barcha talabalar shu yerda.)\n\nboth — ikkalasi (ijobiy):\n▸ Both answers are correct. (Ikkala javob ham to'g'ri.)\n\neither — ikkitadan biri; neither — ikkalasidan hech biri:\n▸ You can take either bus. (Ikki avtobusdan istalganini olishingiz mumkin.)\n▸ Neither of them came. (Ikkalasi ham kelmadi.)","ogatish":"2 qadam:\n1) Ikkitami yoki ko'pmi? Ikkita → both, either, neither. Ko'p → all, each, every.\n2) Each yoki every bilan fe'l birlikda keladi: Each student is here.\n\nMasalan: Both of my parents are teachers. / Neither of them likes coffee. / All of us went to the park.","misollar":[{"ingliz":"Each student has a book.","uzbek":"Har bir talabada kitob bor."},{"ingliz":"Every day counts.","uzbek":"Har bir kun muhim."},{"ingliz":"All the students passed.","uzbek":"Barcha talabalar o'tdi."},{"ingliz":"Both answers are correct.","uzbek":"Ikkala javob ham to'g'ri."}],"xato":"'Each of the students have' — noto'g'ri, 'has' bo'lishi kerak. 'Both' bilan 'is' emas, 'are' ishlatiladi.","mashqlar":[{"savol":"___ student received a certificate.","variantlar":["Each","Both","All","Either"],"togri":0,"izoh":"Har bir talaba — each + birlik ot."},{"savol":"___ of the two options is perfect.","variantlar":["Neither","Both","All","Every"],"togri":0,"izoh":"Ikkalasidan hech biri — neither + birlik fe'l (is)."},{"savol":"___ of my parents are teachers.","variantlar":["Both of","Each of","Neither of","Every"],"togri":0,"izoh":"Ikkalasi — both + ko'plik fe'l (are)."},{"savol":"___ student has a locker here.","variantlar":["Every","All","Both","Either"],"togri":0,"izoh":"Har bir talaba — every + birlik fe'l (has)."}]},{"raqam":52,"sarlavha":"Few / a few, little / a little","daraja":"B1","tayyor":true,"qoida":"📌 Juda oz (salbiy) va bir oz (ijobiy) ma'nolari.\n\nfew — juda oz, yetarli emas (sanaladigan): few friends\n▸ I have few friends here. (Bu yerda do'stlarim juda oz.)\n\na few — bir necha, yetarli (sanaladigan)\n▸ I have a few friends here. (Bu yerda bir necha do'stim bor.)\n\nlittle — juda oz, yetarli emas (sanab bo'lmaydigan): little time\n▸ There is little time. (Vaqt juda oz.)\n\na little — bir oz (sanab bo'lmaydigan)\n▸ There is a little milk left. (Sut bir oz qolgan.)","ogatish":"2 qadam:\n1) Ot sanaladimi (books, friends)? Ha → few / a few. Yo'q (time, water, money) → little / a little.\n2) 'a' bor bo'lsa — ijobiy (yetarli). 'a' yo'q bo'lsa — salbiy (kam, yetarli emas).\n\nMasalan: We have a few minutes. / She has little money. / Few people know the answer.","misollar":[{"ingliz":"I have a few friends here.","uzbek":"Bu yerda bir necha do'stim bor (yetarli)."},{"ingliz":"I have few friends here.","uzbek":"Bu yerda juda kam do'stim bor (afsus)."},{"ingliz":"There is a little milk left.","uzbek":"Sutdan bir oz qolgan."},{"ingliz":"There is little time.","uzbek":"Vaqt juda kam."}],"xato":"'A little people' yoki 'a little apples' — noto'g'ri. Sanaladigan otlar bilan 'a few', sanalmaydigan bilan 'a little'.","mashqlar":[{"savol":"There are ___ students in the class, so the lesson is quiet.","variantlar":["few","a few","little","a little"],"togri":0,"izoh":"Salbiy ma'no, sanaladigan ot: few."},{"savol":"Would you like ___ sugar in your tea?","variantlar":["a little","few","a few","little"],"togri":0,"izoh":"Sugar — sanalmaydigan, ijobiy: a little."},{"savol":"I bought ___ apples; they are for the kids.","variantlar":["a few","little","few","a little"],"togri":0,"izoh":"Apples — sanaladigan, ijobiy: a few."},{"savol":"We have ___ time before the train leaves.","variantlar":["little","few","a few","fewer"],"togri":0,"izoh":"Time — sanalmaydigan, salbiy: little."}]},{"raqam":53,"sarlavha":"Unless, as long as, provided that, in case","daraja":"B1","tayyor":true,"qoida":"📌 Shart va ehtiyot ma'nolarini beradigan iboralar.\n\nunless — agar ... bo'lmasa:\n▸ Unless you hurry, you'll be late. (Shoshilmasangiz, kechikasiz.)\n▸ I won't call unless I need help. (Yordam kerak bo'lmasa, qo'ng'iroq qilmayman.)\n\nas long as / provided that — faqat shu shart bajarilsa:\n▸ You can go as long as you finish. (Tugatsangizgina ketishingiz mumkin.)\n\nin case — ehtiyot uchun:\n▸ Take an umbrella in case it rains. (Yomg'ir yog'sa deb soyabon oling.)","ogatish":"2 qadam:\n1) Shart salbiymi (bajarilmasa)? → unless. Shart ijobiymi (faqat shu bo'lsa)? → as long as.\n2) Ehtiyot uchun → in case. Unless ichida will ishlatilmaydi: unless you hurry (will hurry emas).\n\nMasalan: I'll be there at 7 unless the traffic is bad. / The concert will happen provided that the weather is fine.\n\nEslab qoling: unless = if not.","misollar":[{"ingliz":"I'll be there at 7 unless the traffic is bad.","uzbek":"Agar tirbandlik bo'lmasa, soat 7 da bo'laman."},{"ingliz":"You can use my laptop as long as you don't damage it.","uzbek":"Shikastlamasangiz, noutbukimdan foydalanishingiz mumkin."},{"ingliz":"Take a jacket in case it gets cold.","uzbek":"Sovuq bo'lib qolsa, kurtka oling."},{"ingliz":"The concert will happen provided that the weather is fine.","uzbek":"Ob-havo yaxshi bo'lsa, konsert bo'ladi."}],"xato":"'You won't pass unless you don't study' — noto'g'ri. Unless ichida 'not' bor: 'unless you study'.","mashqlar":[{"savol":"I'll be there at 7, ___ the traffic is bad.","variantlar":["unless","in case","as long as","provided"],"togri":0,"izoh":"Agar tirbandlik bo'lmasa — unless."},{"savol":"You can use my laptop ___ you return it.","variantlar":["as long as","unless","in case","although"],"togri":0,"izoh":"Faqat shart bo'lsa — as long as."},{"savol":"Take a jacket ___ it gets cold later.","variantlar":["in case","unless","as long as","provided"],"togri":0,"izoh":"Ehtiyot uchun — in case."},{"savol":"The concert will happen ___ the weather is fine.","variantlar":["provided that","unless","in case","although"],"togri":0,"izoh":"Shart: provided that."}]},{"raqam":54,"sarlavha":"O'zlik olmoshlari: myself, yourself, themselves","daraja":"B1","tayyor":true,"qoida":"📌 Ish o'z-o'ziga qaratilganda ishlatiladi: myself (o'zim), yourself (o'zing), himself, herself, itself, ourselves, yourselves, themselves.\n\n▸ I taught myself English. (Inglizchani o'zim o'rgandim.)\n▸ She taught herself to swim. (U suzishni o'zi o'rgandi.)\n▸ They enjoyed themselves at the party. (Ular ziyofatda zavqlanishdi.)\n\nby myself — yolg'iz o'zim:\n▸ I did it by myself. (Buni yolg'iz o'zim qildim.)","ogatish":"2 qadam:\n1) Ega va ob'ekt bir kishimi? Ha → -self olmoshi.\n2) Egaga qarab tanlang: I → myself; you → yourself; he → himself; she → herself; they → themselves.\n\nMasalan: Help yourself to some cake. / I did the whole project myself.","misollar":[{"ingliz":"She taught herself to swim.","uzbek":"U o'zi suzishni o'rgandi."},{"ingliz":"Help yourself to some cake.","uzbek":"Keling, o'zingizga tort oling."},{"ingliz":"They enjoyed themselves at the party.","uzbek":"Ular ziyofatda yaxshi vaqt o'tkazdilar."},{"ingliz":"I did the whole project myself.","uzbek":"Butun loyihani o'zim qildim."}],"xato":"'I hurt me' — noto'g'ri. Ega va ob'ekt bir xil bo'lsa 'myself' ishlatiladi: 'I hurt myself'.","mashqlar":[{"savol":"She taught ___ to swim.","variantlar":["herself","hers","her","she"],"togri":0,"izoh":"Ega va ob'ekt bir xil — herself."},{"savol":"I did the whole project ___.","variantlar":["myself","me","mine","my"],"togri":0,"izoh":"Urg'u uchun — myself."},{"savol":"Please help ___ to some food.","variantlar":["yourself","you","your","yours"],"togri":0,"izoh":"Keling, o'zingizga — yourself."},{"savol":"We cut ___ while cooking.","variantlar":["ourselves","us","our","ours"],"togri":0,"izoh":"Biz o'zimizni kestik — ourselves."}]},{"raqam":55,"sarlavha":"Artikllar kengaytmasi: the yoki (yo'q)","daraja":"B1","tayyor":true,"qoida":"📌 the — aniq, yagona yoki hamma biladigan narsa:\n▸ the sun, the moon, the Earth (Quyosh, Oy, Yer)\n▸ the best student in our class (sinfimizdagi eng yaxshi talaba)\n\nArtiklsiz — umumiy ma'no:\n▸ Dogs are friendly. (Itlar umuman do'stona.)\n▸ Life is short. (Hayot qisqa.)\n\nTil, fan, ovqat va umumiy tushunchalar odatda artiklsiz:\n▸ I like music. (Men musiqani yoqtiraman.)\n▸ English is hard. (Ingliz tili qiyin.)","ogatish":"2 qadam:\n1) Narsa aniqmi (hamma biladi, yagona)? Ha → the.\n2) Umumiy ma'noda (hamma uchun, umuman) bo'lsa → artiklsiz.\n\nMasalan: I go to work by bus. / The life in the village is peaceful. / Water boils at 100 degrees.","misollar":[{"ingliz":"Life is short.","uzbek":"Hayot qisqa (umuman)."},{"ingliz":"The life in the village is peaceful.","uzbek":"Qishloqdagi hayot tinch (aniq joy)."},{"ingliz":"I go to work by bus.","uzbek":"Ishga avtobusda boraman (maqsad: ish)."},{"ingliz":"She is the best student in our class.","uzbek":"U sinfimizdagi eng yaxshi talaba."}],"xato":"'The life is beautiful' umumiy ma'noda noto'g'ri. To'g'risi: 'Life is beautiful.'","mashqlar":[{"savol":"___ children need love and care.","variantlar":["(yo'q)","The","A","An"],"togri":0,"izoh":"Umumiy ma'no — artikl yo'q."},{"savol":"___ sun rises in the east.","variantlar":["The","(yo'q)","A","An"],"togri":0,"izoh":"Yagona narsa — the sun."},{"savol":"I always go to ___ by bus.","variantlar":["(yo'q)","the","a","an"],"togri":0,"izoh":"Maqsad: go to work — artikl yo'q."},{"savol":"___ water in the lake is very clean.","variantlar":["The","(yo'q)","A","An"],"togri":0,"izoh":"Aniq ko'l — the water in the lake."}]},{"raqam":56,"sarlavha":"Aniqlovchi va qo'shimcha gaplar: who, which, that","daraja":"B1","tayyor":true,"qoida":"📌 Aniq yoki qo'shimcha ma'lumot beruvchi gaplar. Vergul bilan farqlanadi.\n\nAniq (vergulsiz): ma'lumot gap ma'nosi uchun kerak:\n▸ The man who lives next door is kind. (Yonida yashaydigan odam mehribon.)\n▸ The book that I bought is great. (Men sotib olgan kitob zo'r.)\n\nQo'shimcha (vergul bilan): ma'lumot qo'shimcha, lekin kerak emas:\n▸ My brother, who lives in Paris, is a doctor. (Akam, Parijda yashaydi, shifokor.)\n▸ The house, which is old, is beautiful. (Uy, eski bo'lsa ham, go'zal.)","ogatish":"2 qadam:\n1) Gap aniq odamni yoki narsani ajratadimi? Ha → vergulsiz (who, that).\n2) Ma'lumot qo'shimcha bo'lsa → vergul bilan who yoki which. Bu holatda that ishlatilmaydi.\n\nMasalan: Tashkent, which is very old, attracts many tourists. / My uncle, who lives abroad, calls us often.\n\nEslab qoling: qo'shimcha gapdagi who ni that bilan almashtirib bo'lmaydi.","misollar":[{"ingliz":"My brother, who lives in London, is a doctor.","uzbek":"Londonda yashaydigan akam shifokor (qo'shimcha)."},{"ingliz":"The man who lives next door is a doctor.","uzbek":"Qo'shnimizda yashaydigan odam shifokor (aniqlovchi)."},{"ingliz":"The book that I bought is great.","uzbek":"Men sotib olgan kitob ajoyib."},{"ingliz":"Tashkent, which is very old, attracts many tourists.","uzbek":"Juda qadimiy Toshkent ko'p sayyohlarni jalb qiladi."}],"xato":"'My brother, that lives in London' — noto'g'ri. Vergul bilan 'that' o'rniga 'who' yoki 'which' ishlating.","mashqlar":[{"savol":"My sister, ___ lives in Paris, is a pilot.","variantlar":["who","that","what","where"],"togri":0,"izoh":"Vergul bilan — who (that emas)."},{"savol":"The shop ___ sells fresh bread is near the station.","variantlar":["that","who","whose","—"],"togri":0,"izoh":"Aniqlovchi — 'that' yoki 'which' (vergulsiz). Shop uchun that."},{"savol":"Tashkent, ___ is the capital of Uzbekistan, is very old.","variantlar":["which","that","who","whom"],"togri":0,"izoh":"Vergul bilan, joy uchun — which."},{"savol":"The woman ___ car was stolen called the police.","variantlar":["whose","who","which","where"],"togri":0,"izoh":"Egalik — whose car."}]},{"raqam":57,"sarlavha":"Savol shakllari: ega savoli va ob'ekt savoli","daraja":"B1","tayyor":true,"qoida":"📌 Ega savoli va ob'ekt savoli farqli tuzilishga ega.\n\nEga savoli (kim qildi?):\n▸ Who called you? (Sizga kim qo'ng'iroq qildi?) — javob: Ali called me.\n▸ What happened last night? (Kecha kechqurun nima bo'ldi?)\n\nOb'ekt savoli (kimni yoki nimani?) — did ishlatiladi:\n▸ Who did you call? (Siz kimga qo'ng'iroq qildingiz?) — javob: I called Ali.\n▸ What did she say? (U nima dedi?)\n\nMuhim: ega savolida do/does/did kerak emas.","ogatish":"2 qadam:\n1) Savol kim yoki nima qilganini so'raydimi (ega) yoki kimni yoki nimani (ob'ekt)?\n2) Ega bo'lsa — fe'l to'g'ridan-to'g'ri (Who called?). Ob'ekt bo'lsa — do/does/did + ega + fe'l (Who did you call?).\n\nMasalan: Who wrote this letter? / Who did you invite? / What did the teacher explain?","misollar":[{"ingliz":"Who wrote this letter?","uzbek":"Bu xatni kim yozgan? (ega)"},{"ingliz":"Who did you invite?","uzbek":"Kimni taklif qildingiz? (ob'ekt)"},{"ingliz":"What happened last night?","uzbek":"Kecha kechqurun nima bo'ldi? (ega)"},{"ingliz":"What did she say?","uzbek":"U nima dedi? (ob'ekt)"}],"xato":"'Who did call you?' — noto'g'ri. Ega savolida 'did' kerak emas: 'Who called you?'","mashqlar":[{"savol":"___ broke the window?","variantlar":["Who","Whose","Who did","What"],"togri":0,"izoh":"Ega savoli — Who broke...? (did yo'q)."},{"savol":"___ did you meet at the party?","variantlar":["Who","Who did","What","Where"],"togri":0,"izoh":"Ob'ekt — Who did you meet? (ortiqcha did yo'q)."},{"savol":"___ happened at the meeting?","variantlar":["What","What did","Who","Which"],"togri":0,"izoh":"Ega — What happened? (did yo'q)."},{"savol":"___ is the new teacher?","variantlar":["Who","Whom","Whose","Who did"],"togri":0,"izoh":"Ega — Who is the new teacher?"}]},{"raqam":58,"sarlavha":"Ko'chirma savol va buyruq","daraja":"B1","tayyor":true,"qoida":"📌 Ko'chirma savol: savol so'zi keyin keladi va gap tartibida bo'ladi (savol belgisi yo'q).\n▸ He asked where I lived. (U qayerda yashashimni so'radi.)\n▸ She asked if I was ready. (U tayyor ekanimni so'radi.)\n▸ He asked whether we had a car. (Bizda mashina bor-yo'qligini so'radi.)\n\nKo'chirma buyruq: tell/ask + ob'ekt + to + fe'l.\n▸ She told me to wait. (U meni kutishimni aytdi.)\n▸ He asked us not to shout. (U bizdan baqirmaslikni so'radi.)\n▸ My mum told me not to be late. (Onam kechikmaslikni aytdi.)","ogatish":"2 qadam:\n1) Savolmi yoki buyruqmi? Savol → asked + savol so'zi/if + ega + fe'l. Buyruq → told/asked + ob'ekt + to + fe'l.\n2) Savol belgisini olib tashlang va gap tartibiga keltiring: where I lived (where did I live emas).\n\nEslab qoling: ayrim savollarda if yoki whether ishlatiladi: He asked whether I was ready.","misollar":[{"ingliz":"She asked where I lived.","uzbek":"U qayerda yashashimni so'radi."},{"ingliz":"He asked if I was ready.","uzbek":"U tayyor ekanimni so'radi."},{"ingliz":"The teacher told us to open our books.","uzbek":"O'qituvchi kitoblarni ochishimizni aytdi."},{"ingliz":"My mum told me not to be late.","uzbek":"Onam kechikmaslikni aytdi."}],"xato":"'She asked where do I live' — noto'g'ri. To'g'risi: 'She asked where I lived' (ega + fe'l, zamon o'zgaradi).","mashqlar":[{"savol":"He asked me ___ I had finished.","variantlar":["if","that","what","to"],"togri":0,"izoh":"Yes/No savoli — if."},{"savol":"The guide told us ___ quiet in the museum.","variantlar":["to be","be","being","is"],"togri":0,"izoh":"Buyruq — told us to be."},{"savol":"They asked ___ the train had left.","variantlar":["whether","that","what","how"],"togri":0,"izoh":"Yes/No savoli — whether."},{"savol":"I asked her ___ she lived.","variantlar":["where","that","if","to"],"togri":0,"izoh":"Joy haqida so'roq — where."}]},{"raqam":59,"sarlavha":"Kelasi davomli va kelasi tugallangan zamon","daraja":"B2","tayyor":true,"qoida":"📌 Kelajakning ikki maxsus zamoni:\n\nFuture Continuous — kelajakda ma'lum vaqtda davom etadigan ish: will be + fe'l-ing\n▸ At 5 pm tomorrow, I will be working. (Ertaga soat 17:00 da ishlayotgan bo'laman.)\n▸ This time tomorrow, I'll be flying to Istanbul. (Ertaga shu vaqtda Istanbulga uchayotgan bo'laman.)\n\nFuture Perfect — kelajakda ma'lum vaqtgacha tugagan ish: will have + 3-shakl\n▸ By 2030, I will have finished my degree. (2030-yilgacha diplomimni tugatgan bo'laman.)\n▸ By June, I will have finished the course. (Iyunga qadar kursni tugatgan bo'laman.)","ogatish":"2 qadam:\n1) Kelajakda ma'lum vaqt bor va ish o'sha paytda davom etadimi? → will be + -ing.\n2) Ma'lum vaqtgacha tugallanadimi (by bilan)? → will have + 3-shakl.\n\nMasalan: Don't call at 8 — I'll be having dinner. / By the time you arrive, we will have eaten.\n\nEslab qoling: by — 'gacha tugaydi', at — 'shu paytda davom etadi'.","misollar":[{"ingliz":"This time tomorrow, I'll be flying to Istanbul.","uzbek":"Ertaga shu vaqtda Istanbulga uchib ketayotgan bo'laman."},{"ingliz":"By June, I will have finished the course.","uzbek":"Iyungacha kursni tugatgan bo'laman."},{"ingliz":"Don't call at 8 — I'll be having dinner.","uzbek":"Soat 8 da qo'ng'iroq qilmang — ovqat yeyayotgan bo'laman."},{"ingliz":"By the time you arrive, we will have eaten.","uzbek":"Siz kelguningizcha biz ovqatlanib bo'lgan bo'lamiz."}],"xato":"'By June I will finish' — ko'pincha noto'g'ri, chunki 'by' bilan 'will have + V3' kerak.","mashqlar":[{"savol":"This time next week, we ___ on the beach.","variantlar":["will be lying","will have lain","will lie","lie"],"togri":0,"izoh":"Shu vaqtda davom etayotgan ish — will be + -ing."},{"savol":"By next year, she ___ her degree.","variantlar":["will have finished","will be finishing","finishes","will finish"],"togri":0,"izoh":"Kelasi yilgacha tugallangan — will have + V3."},{"savol":"At 9 a.m. tomorrow, he ___ the exam.","variantlar":["will be taking","will have taken","takes","will take"],"togri":0,"izoh":"Ertalab soat 9 da davom etadi — will be taking."},{"savol":"By the time we get there, the film ___ .","variantlar":["will have started","will be starting","starts","will start"],"togri":0,"izoh":"Yetib borguncha tugallangan — will have started."}]},{"raqam":60,"sarlavha":"Modal perfect: should have, could have, might have","daraja":"B2","tayyor":true,"qoida":"📌 Modal + have + 3-shakl: o'tmish haqida afsus, taxmin yoki imkoniyat.\n\nshould have — afsus yoki yanglishgan ish:\n▸ I should have called you. (Sizga qo'ng'iroq qilishim kerak edi, qilmadim.)\n▸ You should have told me. (Menga aytishingiz kerak edi.)\n\ncould have — imkoniyat bo'lgan, lekin qilinmagan:\n▸ We could have won. (G'alaba qozonishimiz mumkin edi.)\n\nmight have — taxmin, balki bo'lgandir:\n▸ He might have forgotten. (U unutgan bo'lishi mumkin.)\n▸ She might have missed the bus. (U avtobusni qoldirgan bo'lishi mumkin.)","ogatish":"2 qadam:\n1) Gap o'tmishdagi afsus, imkoniyat yoki taxminmi? Ha → modal + have + 3-shakl.\n2) Afsus → should have; imkoniyat → could have; ehtimol → might have.\n\nMasalan: He must have left early; his desk is empty. / I could have won the race.\n\nEslab qoling: should have — o'tgan ish uchun. Hozir kerak bo'lsa: should.","misollar":[{"ingliz":"You should have called me.","uzbek":"Menga qo'ng'iroq qilishing kerak edi (qilmading)."},{"ingliz":"I could have won the race.","uzbek":"Poygada g'olib bo'lishim mumkin edi."},{"ingliz":"She might have forgotten the keys.","uzbek":"U kalitni unutgan bo'lishi mumkin."},{"ingliz":"He must have left early; his desk is empty.","uzbek":"U erta ketgan bo'lishi kerak; stoli bo'sh."}],"xato":"'You should have to call' — noto'g'ri. To'g'risi: 'should have called'. 'Must have' ishonchli taxmin, 'might have' ehtimol.","mashqlar":[{"savol":"I'm so tired. I ___ to bed earlier last night.","variantlar":["should have gone","should go","should have went","should be going"],"togri":0,"izoh":"Afsus, o'tmish — should have + V3 (gone)."},{"savol":"The door is open. Someone ___ it without locking.","variantlar":["must have left","must leave","should leave","had leave"],"togri":0,"izoh":"Ishonchli taxmin o'tmish haqida — must have left."},{"savol":"I'm not sure where Anna is. She ___ the wrong bus.","variantlar":["might have taken","might take","took","must take"],"togri":0,"izoh":"Ehtimol o'tmishda — might have taken."},{"savol":"We ___ earlier, but we were late.","variantlar":["could have arrived","could arrive","arrived","could arriving"],"togri":0,"izoh":"Imkoniyat o'tmishda, bajarilmagan — could have arrived."}]},{"raqam":61,"sarlavha":"Majhul nisbat: modallar bilan va Present Perfect Passive","daraja":"B2","tayyor":true,"qoida":"📌 Modal fe'l bilan majhul gap: modal + be + 3-shakl. Hozirgacha bajarilgan ish uchun: have/has been + 3-shakl.\n\nModal bilan:\n▸ The work must be finished today. (Ish bugun tugallanishi kerak.)\n▸ The letter can be sent by email. (Xat email orqali yuborilishi mumkin.)\n▸ The homework should be checked. (Uy vazifasi tekshirilishi kerak.)\n\nHozirgacha bajarilgan:\n▸ The report has been sent. (Hisobot yuborilgan.)\n▸ The results have been announced. (Natijalar e'lon qilingan.)","ogatish":"2 qadam:\n1) Gapda modal bormi (must, can, will, should)? Ha → modal + be + 3-shakl.\n2) Hozirgacha bajarilgan bo'lsa → has/have been + 3-shakl.\n\nMasalan: The bridge is being repaired now. / The documents will be sent tomorrow.\n\nEslab qoling: modal bilan been ishlatilmaydi: must be finished (must been finished emas).","misollar":[{"ingliz":"The report must be finished by Friday.","uzbek":"Hisobot juma kunigacha tugatilishi kerak."},{"ingliz":"The results have been announced.","uzbek":"Natijalar e'lon qilindi."},{"ingliz":"The bridge is being repaired now.","uzbek":"Ko'prik hozir ta'mirlanmoqda."},{"ingliz":"The letter should be sent today.","uzbek":"Xat bugun jo'natilishi kerak."}],"xato":"'The report must finish' emas — 'must be finished'. Modaldan keyin 'be' va V3 kerak.","mashqlar":[{"savol":"The package ___ delivered tomorrow.","variantlar":["will be","will","is will be","has be"],"togri":0,"izoh":"Kelasi zamon majhul — will be + V3."},{"savol":"The new road ___ built since 2019.","variantlar":["has been","was","is","have been"],"togri":0,"izoh":"Since bilan Present Perfect Passive — has been."},{"savol":"All documents must ___ signed by the manager.","variantlar":["be","been","being","is"],"togri":0,"izoh":"Modaldan keyin be + V3."},{"savol":"The city ___ renovated; it looks new now.","variantlar":["has been","was been","is been","had being"],"togri":0,"izoh":"Natija hozir — has been + V3."}]},{"raqam":62,"sarlavha":"Gerund (-ing) — ega va predlogdan keyin","daraja":"B2","tayyor":true,"qoida":"📌 -ing shakli fe'l bo'lsa ham, gapda ot vazifasini bajaradi (gerund). Ega yoki ob'ekt bo'lishi mumkin.\n\nEga sifatida:\n▸ Swimming is fun. (Suzish qiziqarli.)\n▸ Smoking is bad for health. (Chekish sog'liq uchun zararli.)\n\nOb'ekt sifatida:\n▸ I enjoy reading. (Men o'qishdan zavqlanaman.)\n▸ She avoids talking about it. (U bu haqda gapirishdan qochadi.)\n\nPredlogdan keyin fe'l doim -ing shaklida bo'ladi:\n▸ Thank you for helping me. (Yordam berganingiz uchun rahmat.)","ogatish":"2 qadam:\n1) -ing gapda ot vazifasidami (ega yoki ob'ekt)? Ha → gerund.\n2) Predlogdan keyin (in, on, for, about, of) doim -ing: interested in learning, good at speaking.\n\nMasalan: I'm interested in learning English. / She is good at solving problems. / Thanks for coming.\n\nEslab qoling: 'to' predlog bo'lsa ham, uning orqasida -ing: look forward to meeting you.","misollar":[{"ingliz":"Swimming is good for your health.","uzbek":"Suzish sog'liq uchun foydali."},{"ingliz":"I'm interested in learning English.","uzbek":"Men ingliz tilini o'rganishga qiziqaman."},{"ingliz":"Thanks for helping me.","uzbek":"Yordam berganingiz uchun rahmat."},{"ingliz":"She is good at solving problems.","uzbek":"U muammolarni yechishda yaxshi."}],"xato":"'I'm interested in to learn' — noto'g'ri. Predlogdan keyin -ing: 'in learning'.","mashqlar":[{"savol":"___ early is a good habit.","variantlar":["Getting up","To get up","Get up","Got up"],"togri":0,"izoh":"Gapning egasi — gerund: getting up."},{"savol":"She is good at ___ new languages.","variantlar":["learning","to learn","learn","learned"],"togri":0,"izoh":"Predlogdan keyin -ing: at learning."},{"savol":"Thank you for ___ me.","variantlar":["helping","to help","help","helped"],"togri":0,"izoh":"For dan keyin -ing: for helping."},{"savol":"They are excited about ___ abroad.","variantlar":["travelling","to travel","travel","travelled"],"togri":0,"izoh":"About dan keyin -ing: about travelling."}]},{"raqam":63,"sarlavha":"Solishtirish: the more ... the more; as ... as","daraja":"B2","tayyor":true,"qoida":"📌 the more ... the more — qancha ko'p bo'lsa, shuncha ko'p:\n▸ The more you practice, the better you become. (Qancha ko'p mashq qilsangiz, shuncha yaxshi bo'lasiz.)\n▸ The sooner, the better. (Qanchalik tez bo'lsa, shuncha yaxshi.)\n\nas ... as — teng darajada:\n▸ She is as tall as her brother. (U akasi kabi baland.)\n\nnot as ... as — teng emas:\n▸ It is not as expensive as I thought. (U men o'ylagancha qimmat emas.)","ogatish":"2 qadam:\n1) Ikki narsa birga o'zgaradimi (ko'p-ko'p)? → the more ... the more. Sifat bilan: the + -er ... the + -er.\n2) Teng bo'lsa → as + sifat + as. Teng bo'lmasa → not as + sifat + as.\n\nMasalan: The more you practise, the better you get. / It isn't as expensive as I thought. / This book is as interesting as that one.","misollar":[{"ingliz":"The more you practise, the better you get.","uzbek":"Qancha ko'p mashq qilsangiz, shuncha yaxshi bo'lasiz."},{"ingliz":"The sooner, the better.","uzbek":"Qanchalik tez bo'lsa, shunchalik yaxshi."},{"ingliz":"She is as tall as her brother.","uzbek":"U akasi kabi baland."},{"ingliz":"It isn't as expensive as I thought.","uzbek":"U men o'ylagancha qimmat emas."}],"xato":"'The more you practise, the more better' — noto'g'ri. Ikkinchi qismda ham comparative: 'the better'.","mashqlar":[{"savol":"The more you read, ___ you understand.","variantlar":["the more","more","the most","as"],"togri":0,"izoh":"the + comparative, the + comparative."},{"savol":"My house is ___ big ___ yours.","variantlar":["as / as","so / that","more / than","such / as"],"togri":0,"izoh":"Teng: as big as."},{"savol":"The hotter it gets, ___ I feel.","variantlar":["the worse","worse","the worst","more worse"],"togri":0,"izoh":"the + comparative: the worse."},{"savol":"This book is not ___ interesting ___ the first one.","variantlar":["as / as","so / as","more / as","that / as"],"togri":0,"izoh":"Salbiy teng: not as ... as."}]},{"raqam":64,"sarlavha":"Participle iboralar: -ing va -ed","daraja":"C1","tayyor":true,"qoida":"📌 -ing va -ed shakllari sifat vazifasini ham bajaradi (participle). Farqi:\n\n-ing — harakat qiluvchi yoki ta'sir qiluvchi:\n▸ The boy running there is my brother. (U yerda yugurayotgan bola — akam.)\n\n-ed — harakat qilingan yoki qabul qilingan:\n▸ The book written by him is famous. (U yozgan kitob mashhur.)\n▸ Tired after the trip, we went to bed early. (Safardan charchab, erta yotdik.)","ogatish":"2 qadam:\n1) Gap harakat qilayotgan odam yoki narsa haqidami? → -ing.\n2) Harakat qilingan, boshqa odam tomonidan bajarilgan narsa haqidami? → -ed (3-shakl).\n\nMasalan: Walking home, I met an old friend. / Written in 1990, the book is still popular.\n\nEslab qoling: interested va interesting farqi: I am interested (men qiziqaman), it is interesting (u qiziqarli).","misollar":[{"ingliz":"Walking home, I met an old friend.","uzbek":"Uyga qaytayotib, eski do'stimni uchratdim."},{"ingliz":"Written in 1990, the book is still popular.","uzbek":"1990-yilda yozilgan kitob hali ham mashhur."},{"ingliz":"Having finished the work, she went home.","uzbek":"Ishni tugatib, u uyga ketdi."},{"ingliz":"Tired after the trip, we went to bed early.","uzbek":"Sayohatdan charchab, erta yotdik."}],"xato":"'Walking home, the rain started' — ega nomuvofiq (yomg'ir yuradimi?). Ibora egasi asosiy gap egasi bilan bir xil bo'lishi kerak.","mashqlar":[{"savol":"___ the report, I sent it to the manager.","variantlar":["Having written","Written","To write","Writing it"],"togri":0,"izoh":"Bajarilgan ish — having + V3, ega 'I'."},{"savol":
