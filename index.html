const GRAMMATIKA_20 = [{"raqam":1,"sarlavha":"To be fe'li — am / is / are","daraja":"A1","tayyor":true,"qoida":"Ingliz tilida 'bo'lmoq' fe'li uch xil shaklda keladi:\nI + am\nHe / She / It + is\nYou / We / They + are\n\nInkor: am not, isn't, aren't. Savol: Am I...? Is he...? Are you...?","ogatish":"Qadam-baqadam: avval kim haqida gapirayotganingizni aniqlang (I, You, He...), so'ng mos shaklni tanlang. Masalan 'U shifokor' — 'U' = She → She IS a doctor. 'Ular talaba' — 'Ular' = They → They ARE students.","misollar":[{"ingliz":"I am from Uzbekistan.","uzbek":"Men O'zbekistondanman."},{"ingliz":"She is a doctor.","uzbek":"U shifokor."},{"ingliz":"We are ready.","uzbek":"Biz tayyormiz."},{"ingliz":"Is he your brother?","uzbek":"U sizning akangizmi?"}],"xato":"Ko'pchilik o'zbeklar 'I student' deb aytadi, chunki o'zbekchada 'talabaman' deyilganda alohida fe'l kerak emas. Inglizchada gapda doim fe'l bo'lishi shart: I AM a student. Shuningdek, 'She are' yoki 'I is' ham noto'g'ri.","mashqlar":[{"savol":"My parents ___ teachers.","variantlar":["is","am","are","be"],"togri":2,"izoh":"My parents = They → are."},{"savol":"___ you tired?","variantlar":["Is","Are","Am","Do"],"togri":1,"izoh":"You bilan 'Are' ishlatiladi."},{"savol":"This ___ my favourite book.","variantlar":["are","am","is","be"],"togri":2,"izoh":"This = It → is."},{"savol":"I ___ not hungry now.","variantlar":["is","are","am","do"],"togri":2,"izoh":"I bilan 'am' ishlatiladi, inkor: am not."}]},{"raqam":2,"sarlavha":"Hozirgi oddiy zamon — Present Simple","daraja":"A1","tayyor":true,"qoida":"Har kuni takrorlanadigan yoki doimiy haqiqat bo'lgan harakatlar uchun ishlatiladi.\nI/You/We/They + fe'l (oddiy shakl)\nHe/She/It + fe'l + s/es\n\nInkor: don't / doesn't + fe'l. Savol: Do/Does + shaxs + fe'l?","ogatish":"Avval tartibni eslang: inglizchada fe'l egadan KEYIN keladi (o'zbekchada esa gap oxirida): 'Men kitob o'qiyman' → I read a book. Keyin shaxsga qarang: He/She/It bo'lsa, fe'lga -s qo'shing (works), qolganlarida fe'l o'zgarmaydi (I work, they work).","misollar":[{"ingliz":"He works in a bank.","uzbek":"U bankda ishlaydi."},{"ingliz":"I don't like coffee.","uzbek":"Men qahvani yoqtirmayman."},{"ingliz":"Does she speak English?","uzbek":"U inglizcha gapiradimi?"},{"ingliz":"Water boils at 100 degrees.","uzbek":"Suv 100 darajada qaynaydi (doimiy haqiqat)."}],"xato":"'She work' emas, 'She works'. Savol ham farq qiladi: o'zbekchada '-mi' qo'shiladi, inglizchada esa gap Do/Does bilan boshlanadi: 'Do you speak English?'","mashqlar":[{"savol":"My sister ___ in a hospital.","variantlar":["work","works","working","to work"],"togri":1,"izoh":"She → fe'lga -s qo'shiladi: works."},{"savol":"___ they live in Tashkent?","variantlar":["Do","Does","Is","Are"],"togri":0,"izoh":"They bilan savolda 'Do' ishlatiladi."},{"savol":"I ___ understand this question.","variantlar":["doesn't","don't","not","isn't"],"togri":1,"izoh":"I bilan inkorda 'don't' ishlatiladi."},{"savol":"The sun ___ in the east.","variantlar":["rise","rises","rising","rose"],"togri":1,"izoh":"The sun = It → fe'lga -s qo'shiladi: rises."}]},{"raqam":3,"sarlavha":"Artikllar — a / an / the","daraja":"A1","tayyor":true,"qoida":"'a' — undosh tovush bilan boshlangan so'z oldida, noaniq narsa uchun.\n'an' — unli TOVUSH bilan boshlangan so'z oldida (harf emas, tovush muhim: an hour, an honest man, lekin a university).\n'the' — ikkala tomonga ham ma'lum, aniq narsa uchun.","ogatish":"Avval so'z noaniqmi yoki aniqmi, shuni hal qiling. Agar birinchi marta aytilayotgan bo'lsa — a/an. Agar ikkinchi marta yoki hammaga ma'lum bo'lsa — the. Keyin so'z qaysi tovush bilan boshlanishini tekshiring: unlimi (an) yoki undoshmi (a).","misollar":[{"ingliz":"I bought a book yesterday.","uzbek":"Men kecha bir kitob sotib oldim."},{"ingliz":"The book was very interesting.","uzbek":"O'sha kitob juda qiziqarli edi."},{"ingliz":"She is an engineer.","uzbek":"U muhandis."},{"ingliz":"The sun rises in the east.","uzbek":"Quyosh sharqdan chiqadi (yagona narsa)."}],"xato":"'a apple' — noto'g'ri, 'apple' unli 'a' bilan boshlanadi, shuning uchun 'an apple' bo'lishi kerak.","mashqlar":[{"savol":"She wants to be ___ doctor.","variantlar":["a","an","the","—"],"togri":0,"izoh":"'Doctor' undosh 'd' bilan boshlanadi → a doctor."},{"savol":"Can you close ___ door, please?","variantlar":["a","an","the","—"],"togri":2,"izoh":"Aniq, ma'lum eshik nazarda tutilyapti → the door."},{"savol":"Ali is ___ honest man. (birinchi marta tilga olinyapti)","variantlar":["a","an","the","—"],"togri":1,"izoh":"'Honest' so'zida 'h' o'qilmaydi, tovush unli 'o' dan boshlanadi → an honest."},{"savol":"___ moon goes around the Earth.","variantlar":["A","An","The","—"],"togri":2,"izoh":"Oy — yagona, hammaga ma'lum narsa → the moon."}]},{"raqam":4,"sarlavha":"Ko'plik son — Plural nouns","daraja":"A1","tayyor":true,"qoida":"Oddiy holatda otga -s qo'shiladi: book→books.\ns, sh, ch, x, z bilan tugasa: -es qo'shiladi: bus→buses.\nUndosh+y bilan tugasa: y→ies: city→cities.\nBa'zi so'zlar tartibsiz: man→men, child→children, woman→women.","ogatish":"Avval so'z qanday tovush bilan tugashiga qarang. Agar s/sh/ch bilan tugasa — es qo'shing. Agar undosh+y bilan tugasa — y ni olib tashlab ies qo'shing. Qolgan holatlarda oddiy -s yetarli.","misollar":[{"ingliz":"I have two brothers.","uzbek":"Mening ikkita akam bor."},{"ingliz":"There are five buses here.","uzbek":"Bu yerda beshta avtobus bor."},{"ingliz":"She visited three cities.","uzbek":"U uchta shaharga tashrif buyurdi."},{"ingliz":"The children are playing.","uzbek":"Bolalar o'ynashyapti (tartibsiz ko'plik)."}],"xato":"O'zbekchada son bilan ko'plik qo'shilmaydi ('uch kitob'), shuning uchun ko'pchilik 'three book' deydi. Inglizchada son bilan ham ko'plik shart: three books. Yana: 'citys' emas, 'cities' (undosh+y → ies).","mashqlar":[{"savol":"How many ___ do you have?","variantlar":["childs","child","children","childrens"],"togri":2,"izoh":"'Child' — tartibsiz, ko'pligi 'children'."},{"savol":"There are many ___ in the box.","variantlar":["boxs","boxes","boxies","box"],"togri":1,"izoh":"'Box' 'x' bilan tugaydi → boxes."},{"savol":"I saw two ___ in the park.","variantlar":["ladys","ladies","ladyes","lady"],"togri":1,"izoh":"Undosh+y → ladies."},{"savol":"These ___ are expensive.","variantlar":["watchs","watches","watchies","watch"],"togri":1,"izoh":"'Watch' 'ch' bilan tugaydi → watches."}]},{"raqam":5,"sarlavha":"Ko'rsatish olmoshlari — this / that / these / those","daraja":"A1","tayyor":true,"qoida":"this (bu) — yaqindagi bitta narsa.\nthat (u / o'sha) — uzoqdagi bitta narsa.\nthese (bular) — yaqindagi ko'p narsa.\nthose (ular / o'shalar) — uzoqdagi ko'p narsa.","ogatish":"Ikkita savolga javob bering: (1) narsa nechta — bittami, ko'pmi? (2) narsa yaqinmi, uzoqmi? Yaqin+bitta=this, Uzoq+bitta=that, Yaqin+ko'p=these, Uzoq+ko'p=those.","misollar":[{"ingliz":"This is my phone.","uzbek":"Bu mening telefonim."},{"ingliz":"That is your house over there.","uzbek":"Ana u yerdagi sizning uyingiz."},{"ingliz":"These are my keys.","uzbek":"Bular mening kalitlarim."},{"ingliz":"Those shoes are nice.","uzbek":"O'sha (narida turgan) poyabzallar chiroyli."}],"xato":"'This books' — noto'g'ri, 'this' faqat birlik bilan keladi. Ko'plik uchun 'these books' bo'lishi kerak.","mashqlar":[{"savol":"___ apples on the table are fresh. (yaqin, ko'p)","variantlar":["This","That","These","Those"],"togri":2,"izoh":"Yaqin + ko'p = these."},{"savol":"Look at ___ mountains far away! (uzoq, ko'p)","variantlar":["this","that","these","those"],"togri":3,"izoh":"Uzoq + ko'p = those."},{"savol":"___ is my new bag. (yaqin, bitta)","variantlar":["This","That","These","Those"],"togri":0,"izoh":"Yaqin + bitta = this."},{"savol":"Who is ___ man standing near the door? (uzoq, bitta)","variantlar":["this","that","these","those"],"togri":1,"izoh":"Uzoq + bitta = that."}]},{"raqam":6,"sarlavha":"Egalik olmoshlari — my / your / his / her / our / their","daraja":"A1","tayyor":true,"qoida":"my — mening, your — sening/sizning, his — uning (erkak), her — uning (ayol), its — uning (narsa/hayvon), our — bizning, their — ularning.\nBular otdan OLDIN keladi: my book, her car.","ogatish":"Avval kimga tegishli ekanligini toping (kim egasi?), keyin o'sha shaxsga mos egalik olmoshini otning oldiga qo'ying. 'Ali kitobi' → his book (chunki Ali = erkak = his).","misollar":[{"ingliz":"This is my sister.","uzbek":"Bu mening opam/singlim."},{"ingliz":"Is this your car?","uzbek":"Bu sizning mashinangizmi?"},{"ingliz":"He lost his phone.","uzbek":"U telefonini yo'qotdi."},{"ingliz":"They love their country.","uzbek":"Ular o'z vatanlarini sevishadi."}],"xato":"'her' va 'his' ni almashtirib yubormang: 'her' — ayolga tegishli narsa, 'his' — erkakka tegishli narsa (egasining jinsiga qarab, narsaning jinsiga emas!).","mashqlar":[{"savol":"Maria lost ___ umbrella.","variantlar":["his","her","their","its"],"togri":1,"izoh":"Maria — ayol → her."},{"savol":"The company changed ___ name last year.","variantlar":["his","her","its","their"],"togri":2,"izoh":"Kompaniya — narsa, shuning uchun its ishlatiladi."},{"savol":"We finished ___ homework early.","variantlar":["my","our","their","your"],"togri":1,"izoh":"We → our."},{"savol":"John and Ali brought ___ books.","variantlar":["his","her","their","our"],"togri":2,"izoh":"John and Ali = they → their."}]},{"raqam":7,"sarlavha":"There is / There are","daraja":"A1","tayyor":true,"qoida":"Biror narsaning mavjudligini aytish uchun ishlatiladi.\nThere is + birlik/sanalmaydigan ot.\nThere are + ko'plik ot.\nInkor: There isn't / There aren't. Savol: Is there...? Are there...?","ogatish":"Avval keyingi ot birlikmi yoki ko'plikmi, shuni aniqlang. Bitta/sanalmaydigan bo'lsa — 'There is', ko'p bo'lsa — 'There are'.","misollar":[{"ingliz":"There is a cat in the garden.","uzbek":"Bog'da bitta mushuk bor."},{"ingliz":"There are three students in the room.","uzbek":"Xonada uchta talaba bor."},{"ingliz":"Is there any milk left?","uzbek":"Sut qolganmi?"},{"ingliz":"There aren't any tickets.","uzbek":"Hech qanday chipta yo'q."}],"xato":"'There is many books' — noto'g'ri, ko'plik bilan 'There ARE' bo'lishi kerak: There are many books.","mashqlar":[{"savol":"___ a bank near here?","variantlar":["Is there","Are there","There is","There are"],"togri":0,"izoh":"Birlik savol: Is there...?"},{"savol":"___ many people at the party.","variantlar":["There is","There are","Is there","Are there"],"togri":1,"izoh":"Ko'plik (many people) → There are."},{"savol":"There ___ any sugar in the jar.","variantlar":["isn't","aren't","don't","not"],"togri":0,"izoh":"'Sugar' sanalmaydigan ot, birlik kabi: isn't."},{"savol":"___ two windows in this room.","variantlar":["There is","There are","Is there","Has"],"togri":1,"izoh":"Ko'plik (two windows) → There are."}]},{"raqam":8,"sarlavha":"O'rin predloglari — in / on / at","daraja":"A1","tayyor":true,"qoida":"in — katta joy ichida (shahar, mamlakat, xona): in Tashkent, in the room.\non — sirtida, yuzasida: on the table, on the wall.\nat — aniq nuqta: at home, at the door, at school.","ogatish":"O'zingizdan so'rang: bu narsa qandaydir joyning ICHIDAmi (in), USTIDAmi (on), yoki bu aniq bir NUQTAmi (at)? Shaharlar va mamlakatlar deyarli doim 'in' bilan keladi.","misollar":[{"ingliz":"I live in Samarkand.","uzbek":"Men Samarqandda yashayman."},{"ingliz":"The book is on the table.","uzbek":"Kitob stol ustida."},{"ingliz":"She is at the bus stop.","uzbek":"U avtobus bekatida."},{"ingliz":"We arrived at the airport.","uzbek":"Biz aeroportga yetib keldik."}],"xato":"'in the bus stop' emas — aniq nuqtalar uchun 'at' ishlatiladi: at the bus stop.","mashqlar":[{"savol":"My keys are ___ my bag. (sumkaning ichida)","variantlar":["in","on","at","to"],"togri":0,"izoh":"Sumka ichida → in."},{"savol":"There is a picture ___ the wall.","variantlar":["in","on","at","under"],"togri":1,"izoh":"Devor yuzasida → on."},{"savol":"I will meet you ___ the entrance.","variantlar":["in","on","at","to"],"togri":2,"izoh":"Aniq nuqta (kirish joyi) → at."},{"savol":"He was born ___ Bukhara.","variantlar":["in","on","at","from"],"togri":0,"izoh":"Shahar nomi bilan → in."}]},{"raqam":9,"sarlavha":"Hozirgi davomli zamon — Present Continuous","daraja":"A2","tayyor":true,"qoida":"am/is/are + fe'l+ing. Hozir, gapirilayotgan paytda sodir bo'layotgan harakat uchun ishlatiladi. Ba'zan yaqin kelajakdagi rejalar uchun ham ishlatiladi.","ogatish":"Avval to be (am/is/are) ni shaxsga mos tanlang, keyin fe'lga -ing qo'shing. 'U yozyapti' → She (is) + write+ing = She is writing.","misollar":[{"ingliz":"I am reading a book now.","uzbek":"Men hozir kitob o'qiyapman."},{"ingliz":"They are playing football.","uzbek":"Ular futbol o'ynashyapti."},{"ingliz":"She is coming tomorrow.","uzbek":"U ertaga kelyapti (reja)."},{"ingliz":"Why are you crying?","uzbek":"Nega yig'layapsiz?"}],"xato":"'like', 'know', 'want' kabi his-tuyg'u fe'llari odatda -ing bilan ishlatilmaydi: 'I am liking' emas, 'I like' to'g'ri.","mashqlar":[{"savol":"Look! It ___ outside.","variantlar":["rains","is raining","rained","rain"],"togri":1,"izoh":"'Look!' — hozir sodir bo'lyapti → is raining."},{"savol":"We ___ dinner right now.","variantlar":["have","are having","has","had"],"togri":1,"izoh":"We → are + having."},{"savol":"She ___ to music at the moment.","variantlar":["listen","listens","is listening","listened"],"togri":2,"izoh":"'At the moment' — hozir → is listening."},{"savol":"I ___ you. I can see you clearly.","variantlar":["am understanding","understand","understood","will understand"],"togri":1,"izoh":"'Understand' his-tuyg'u fe'li, -ing olmaydi: I understand."}]},{"raqam":10,"sarlavha":"Can / Can't — qobiliyat va ruxsat","daraja":"A2","tayyor":true,"qoida":"can — biror narsani qila olish (qobiliyat) yoki ruxsat berish uchun ishlatiladi. Inkor: cannot / can't. Barcha shaxslar uchun bir xil shaklda ishlatiladi, keyingi fe'l 'to'siz keladi.","ogatish":"Can dan keyin doim fe'lning oddiy shakli keladi (to yo'q!). 'U suza oladi' → She can swim (can swims yoki can to swim emas).","misollar":[{"ingliz":"I can speak three languages.","uzbek":"Men uch tilda gapira olaman."},{"ingliz":"She can't drive a car.","uzbek":"U mashina hayday olmaydi."},{"ingliz":"Can I open the window?","uzbek":"Derazani ocha olamanmi? (ruxsat so'rash)"},{"ingliz":"Can you help me, please?","uzbek":"Menga yordam bera olasizmi?"}],"xato":"'She can to swim' yoki 'She cans swim' — ikkalasi ham noto'g'ri. To'g'risi: 'She can swim' (to yo'q, -s ham qo'shilmaydi).","mashqlar":[{"savol":"My brother ___ play the piano very well.","variantlar":["cans","can to","can","canning"],"togri":2,"izoh":"Can barcha shaxslar uchun bir xil, -s qo'shilmaydi."},{"savol":"___ you swim?","variantlar":["Do can","Can","Cans","Are can"],"togri":1,"izoh":"Savolda 'Can' shaxsdan oldin keladi."},{"savol":"I ___ understand this word.","variantlar":["can't","don't can","can not to","cann't"],"togri":0,"izoh":"Inkor: can't (yoki cannot)."},{"savol":"Birds ___ fly, but penguins can't.","variantlar":["can to","cans","can","canning"],"togri":2,"izoh":"Can + fe'l (to'siz): can fly."}]},{"raqam":11,"sarlavha":"O'tgan oddiy zamon — Past Simple","daraja":"A2","tayyor":true,"qoida":"O'tgan zamonda boshlanib tugagan harakat uchun ishlatiladi (yesterday, last week, in 2019, two days ago).\nMuntazam fe'llar: fe'l + ed (work → worked, like → liked, study → studied, stop → stopped).\nTartibsiz fe'llar: alohida shakl (go → went, see → saw, have → had, eat → ate, buy → bought, come → came).\nInkor: didn't + fe'lning oddiy shakli. Savol: Did + ega + fe'lning oddiy shakli?","ogatish":"1) Gapda o'tgan vaqt belgisini toping (yesterday, last year, ago). 2) Fe'l muntazammi? Unda -ed qo'shing. Tartibsizmi? Ikkinchi shaklni ro'yxatdan oling. 3) Inkor yoki savol bo'lsa, o'tgan zamonni did o'zi ko'taradi, asosiy fe'l esa oddiy shaklga QAYTADI: She went → Did she go? → She didn't go.","misollar":[{"ingliz":"I visited my grandmother last Sunday.","uzbek":"Men o'tgan yakshanba buvimnikiga bordim."},{"ingliz":"She went to Samarkand two years ago.","uzbek":"U ikki yil oldin Samarqandga bordi."},{"ingliz":"We didn't see the film.","uzbek":"Biz filmni ko'rmadik."},{"ingliz":"Did you buy a new phone?","uzbek":"Yangi telefon sotib oldingizmi?"}],"xato":"O'zbekchada o'tgan zamon har doim fe'lning o'ziga qo'shiladi (bordim, bormadim, bordingmi). Inglizchada esa savol va inkorda o'tgan zamon did ga o'tadi, asosiy fe'l o'zgarmaydi. Xato: 'Did you went?' va 'I didn't saw'. To'g'risi: 'Did you go?' va 'I didn't see'.","mashqlar":[{"savol":"We ___ a great film last night.","variantlar":["watched","watching","watches","watch"],"togri":0,"izoh":"'Last night' — o'tgan vaqt, muntazam fe'l: watch + ed."},{"savol":"She ___ to school yesterday.","variantlar":["went","gone","go","goes"],"togri":0,"izoh":"'Go' tartibsiz fe'l, o'tgan zamoni 'went'."},{"savol":"I didn't ___ the answer.","variantlar":["knows","know","knew","knowed"],"togri":1,"izoh":"Inkorda didn't dan keyin fe'lning oddiy shakli keladi: didn't know."},{"savol":"___ you visit your aunt last week?","variantlar":["Do","Did","Were","Have"],"togri":1,"izoh":"'Last week' — o'tgan zamon savoli: Did + ega + oddiy fe'l."}]},{"raqam":12,"sarlavha":"Savol so'zlari va Do/Does/Did savollari","daraja":"A2","tayyor":true,"qoida":"Savol so'zlari: What (nima), Where (qayerda), When (qachon), Who (kim), Why (nega), How (qanday), Which (qaysi), How much / How many (qancha).\nTuzilishi: savol so'zi + yordamchi fe'l (do / does / did / am / is / are) + ega + asosiy fe'l?\nMisol: Where do you live? What did she buy? Why is he late?\nIstisno: Who yoki What gapning egasi bo'lsa, yordamchi fe'l kerak emas: Who lives here?","ogatish":"Savolni to'rt qadamda quring: 1) savol so'zini boshiga qo'ying; 2) zamonga qarab yordamchi fe'lni tanlang (hozir: do/does, o'tgan: did, to be: am/is/are); 3) egani yozing; 4) asosiy fe'lni oddiy shaklda qo'ying. 'Sen qayerda ishlaysan?' → Where + do + you + work?","misollar":[{"ingliz":"Where do you work?","uzbek":"Siz qayerda ishlaysiz?"},{"ingliz":"What did she say?","uzbek":"U nima dedi?"},{"ingliz":"Why is he late?","uzbek":"U nega kech qoldi?"},{"ingliz":"How much does this bag cost?","uzbek":"Bu sumka necha pul turadi?"}],"xato":"O'zbekchada savol so'zi gap ichida turaveradi ('Sen qayerda yashaysan?'). Inglizchada savol so'zi gap boshida, undan keyin yordamchi fe'l va ega keladi. Xato: 'Where you live?' va 'What you want?'. To'g'risi: 'Where do you live?' va 'What do you want?'.","mashqlar":[{"savol":"___ does she work? — In a bank.","variantlar":["Who","How many","Where","Why"],"togri":2,"izoh":"Javob joyni bildiryapti (in a bank), demak Where."},{"savol":"What time ___ the lesson start every day?","variantlar":["do","did","does","is"],"togri":2,"izoh":"The lesson = it, hozirgi zamon: does + oddiy fe'l (start)."},{"savol":"Why ___ you late yesterday?","variantlar":["do","are","were","did"],"togri":2,"izoh":"'Late' sifat, demak to be kerak; 'yesterday' tufayli o'tgan zamon: were."},{"savol":"How many books ___ she read last month?","variantlar":["did","has","do","does"],"togri":0,"izoh":"'Last month' — o'tgan zamon: did + ega + oddiy fe'l."}]},{"raqam":13,"sarlavha":"Solishtirish darajalari — Comparatives & Superlatives","daraja":"A2","tayyor":true,"qoida":"Ikki narsani solishtirish — qiyosiy daraja + than. Uch va undan ko'p narsa ichida eng — orttirma daraja, oldidan the.\nQisqa sifat (1 bo'g'in): tall → taller → the tallest. Oxiri -e: nice → nicer → the nicest. Undosh+y (2 bo'g'inli ham): happy → happier → the happiest. Bitta unli+undosh: big → bigger → the biggest.\nUzun sifat (-y bilan tugamaydigan 2 va undan ko'p bo'g'inli sifatlar): beautiful → more beautiful → the most beautiful.\nTartibsiz: good → better → the best, bad → worse → the worst.","ogatish":"1) Nechta narsa solishtirilyapti? Ikkita bo'lsa — qiyosiy daraja va than; ko'p narsa ichidan eng — the + orttirma daraja. 2) Sifat qisqami? Unda -er/-est. Uzunmi? Unda more/most. 3) Tartibsiz sifatlarni yodlab oling: good-better-best, bad-worse-worst.","misollar":[{"ingliz":"My brother is taller than me.","uzbek":"Akam mendan balandroq."},{"ingliz":"This book is more interesting than that one.","uzbek":"Bu kitob u kitobdan qiziqarliroq."},{"ingliz":"She is the best student in our class.","uzbek":"U sinfimizdagi eng yaxshi o'quvchi."},{"ingliz":"Tashkent is the biggest city in Uzbekistan.","uzbek":"Toshkent O'zbekistondagi eng katta shahar."}],"xato":"O'zbekchada '-roq' (kattaroq) va 'eng' (eng katta) so'zlari bor, inglizchada esa bir sifatga ikki marta belgi qo'yib bo'lmaydi. Xato: 'more taller', 'more better', 'the most tallest'. To'g'risi: 'taller', 'better', 'the tallest'. Solishtirishda than ni ham unutmang: 'taller than me'.","mashqlar":[{"savol":"Mount Everest is ___ mountain in the world.","variantlar":["the highest","most high","higher","high"],"togri":0,"izoh":"Dunyodagi hamma tog'lar ichida eng baland: the + highest."},{"savol":"This test is ___ than the last one.","variantlar":["easy","more easy","easiest","easier"],"togri":3,"izoh":"Ikkita narsa, than bor, qisqa sifat: easy → easier."},{"savol":"Her English is ___ than mine.","variantlar":["best","more good","good","better"],"togri":3,"izoh":"Good tartibsiz sifat: good → better → best."},{"savol":"This is the ___ film I have ever seen.","variantlar":["more boring","most boring","boringest","bored"],"togri":1,"izoh":"'Boring' uzun sifat, eng yuqori daraja: the most boring."}]},{"raqam":14,"sarlavha":"O'tgan davomli zamon — Past Continuous","daraja":"B1","tayyor":true,"qoida":"Shakli: was / were + fe'l-ing. I, he, she, it → was; you, we, they → were.\nIshlatilishi: 1) o'tmishdagi aniq paytda davom etayotgan harakat (At 8 o'clock I was studying); 2) ikki harakat bir vaqtda davom etgan (while); 3) uzoq harakat davomida qisqa harakat sodir bo'ldi: uzoq harakat Past Continuous, qisqasi Past Simple (when).","ogatish":"Gapda ikkita harakat bormi? Uzun, davom etgan harakat → was/were + -ing. Qisqa, uni \"to'xtatgan\" harakat → Past Simple. 'Men ovqat pishirayotgan edim, telefon jiringladi' → I WAS COOKING when the phone RANG.","misollar":[{"ingliz":"At 8 o'clock yesterday, I was studying.","uzbek":"Kecha soat 8 da men dars qilayotgan edim."},{"ingliz":"She was reading while he was watching TV.","uzbek":"U (ayol) kitob o'qiyotgan paytda, u (erkak) televizor ko'rayotgan edi."},{"ingliz":"I was walking home when it started to rain.","uzbek":"Men uyga piyoda ketayotganimda yomg'ir yog'a boshladi."},{"ingliz":"They weren't listening.","uzbek":"Ular tinglamayotgan edi."}],"xato":"O'zbekchada '-ayotgan edi' shakli bor, lekin ko'pchilik inglizchada oddiy o'tgan zamonni ishlatib yuboradi. Davom etgan harakat uchun was/were + -ing kerak. Shuningdek 'We was' xato, to'g'risi 'We were'.","mashqlar":[{"savol":"I ___ TV when the lights went out. (televizor ko'rish davom etayotgan edi)","variantlar":["was watching","watched","am watching","were watching"],"togri":0,"izoh":"Uzoq harakat (televizor ko'rish) Past Continuous, I bilan was."},{"savol":"They ___ football at 5 o'clock yesterday. (o'sha paytda o'yin davom etayotgan edi)","variantlar":["was playing","were playing","played","are playing"],"togri":1,"izoh":"Aniq paytda davom etgan harakat; They bilan were."},{"savol":"What ___ you doing at 9 p.m. last night?","variantlar":["did","do","were","was"],"togri":2,"izoh":"You bilan were ishlatiladi: What were you doing?"},{"savol":"My sister started her letter at 7:30 and finished at 9:00. At 8 o'clock yesterday she ___ a letter.","variantlar":["wrote","were writing","writes","was writing"],"togri":3,"izoh":"Aniq paytda (soat 8) harakat davom etayotgan edi: was writing."}]},{"raqam":15,"sarlavha":"Modal fe'llar — must / should / have to","daraja":"B1","tayyor":true,"qoida":"must — kuchli majburiyat: You must stop at a red light.\nmustn't — TAQIQ: You mustn't smoke here.\nhave to — tashqi majburiyat (qoida, vaziyat): I have to get up early. He has to work. O'tgan zamon: had to.\ndon't have to — SHART EMAS (xohlasangiz qilasiz, xohlamasangiz yo'q): You don't have to pay.\nshould — maslahat: You should drink more water.\nBu fe'llardan keyin to'siz fe'l keladi (must go, should go).","ogatish":"Gapning ma'nosini aniqlang: majburmi (must / have to), taqiqmi (mustn't), shart emasmi (don't have to) yoki shunchaki maslahatmi (should)? Eng ko'p xato: mustn't ≠ don't have to. 'Kelmaslik kerak' va 'kelish shart emas' butunlay boshqa ma'no.","misollar":[{"ingliz":"You must stop at a red light.","uzbek":"Qizil chiroqda to'xtashingiz shart."},{"ingliz":"You mustn't smoke here.","uzbek":"Bu yerda chekish mumkin emas."},{"ingliz":"I have to get up early tomorrow.","uzbek":"Ertaga erta turishim kerak."},{"ingliz":"You don't have to pay. It's free.","uzbek":"To'lashingiz shart emas. Bepul."},{"ingliz":"You should drink more water.","uzbek":"Ko'proq suv ichishingiz kerak (maslahat)."}],"xato":"O'zbekchada 'kerak emas' va 'mumkin emas' ba'zan bir xil eshitiladi. Inglizchada 'mustn't' — taqiq, 'don't have to' — shart emas. Yana: modal fe'ldan keyin 'to' qo'yilmaydi ('must to go' xato) va 'He must goes' ham xato. To'g'risi: 'He must go'; 'He has to go'.","mashqlar":[{"savol":"You ___ park here. It's forbidden.","variantlar":["mustn't","needn't to","not must","don't have to"],"togri":0,"izoh":"Taqiqlangan (forbidden) → mustn't."},{"savol":"Tomorrow is a holiday, so we ___ go to school.","variantlar":["mustn't","can't to","must","don't have to"],"togri":3,"izoh":"Dam olish kuni — borish shart emas: don't have to."},{"savol":"She has a bad cough. She ___ see a doctor.","variantlar":["must to","should","shoulds","have to"],"togri":1,"izoh":"Maslahat → should. 'She have to' ham xato (has to bo'lardi)."},{"savol":"I ___ work on Sundays. My boss makes me.","variantlar":["has to","must to","have to","should to"],"togri":2,"izoh":"Tashqi majburiyat, I bilan have to."}]},{"raqam":16,"sarlavha":"Hozirgi tugallangan zamon — Present Perfect","daraja":"B1","tayyor":true,"qoida":"Shakli: have / has + fe'lning 3-shakli (V3). I/you/we/they have, he/she/it has. Muntazam V3: worked, played. Tartibsiz: been, gone, seen, done, eaten, written, taken.\nIshlatilishi: 1) hayotdagi tajriba (ever, never): I have been to Turkey. 2) hozirga ta'sir qiluvchi natija: I have lost my keys. 3) hozirgacha davom etayotgan holat: I have lived here for five years / since 2020. 4) just, already, yet bilan.\nAniq o'tgan vaqt (yesterday, last year, in 2020, ago) bilan ISHLATILMAYDI — u yerda Past Simple.","ogatish":"Gapda aniq o'tgan vaqt aytilganmi? Ha → Past Simple. Yo'q, yoki harakat hozirgacha davom etayotgan bo'lsa → Present Perfect. For + davr (for 3 years), since + boshlanish nuqtasi (since 2020, since Monday).","misollar":[{"ingliz":"I have never eaten sushi.","uzbek":"Men hech qachon sushi yemaganman."},{"ingliz":"She has lived here since 2018.","uzbek":"U 2018-yildan beri shu yerda yashaydi."},{"ingliz":"They have just arrived.","uzbek":"Ular hozirgina yetib kelishdi."},{"ingliz":"Have you finished your homework yet?","uzbek":"Uy vazifangizni tugatdingizmi?"}],"xato":"O'zbekchada 'borganman' va 'bordim' ikkalasi ham o'tgan zamon, shuning uchun ko'pchilik farqni sezmaydi. Inglizchada farq katta. Xato: 'I have seen him yesterday' — to'g'risi 'I saw him yesterday'. Xato: 'I am living here for five years' — to'g'risi 'I have lived here for five years'.","mashqlar":[{"savol":"I have never ___ to Japan.","variantlar":["being","be","been","was"],"togri":2,"izoh":"Have + V3. Be fe'lining V3 shakli: been."},{"savol":"She ___ here since 2019.","variantlar":["lives","lived","has lived","is living"],"togri":2,"izoh":"'Since' (boshlanish nuqtasi) bilan Present Perfect: has lived."},{"savol":"We ___ him yesterday.","variantlar":["saw","see","has seen","have seen"],"togri":0,"izoh":"'Yesterday' — aniq o'tgan vaqt, demak Past Simple: saw."},{"savol":"___ you finished your homework yet?","variantlar":["Did","Are","Has","Have"],"togri":3,"izoh":"'Yet' bilan savol Present Perfect'da: Have you finished...?"}]},{"raqam":17,"sarlavha":"Kelasi zamon — will vs going to","daraja":"B1","tayyor":true,"qoida":"will + fe'l: 1) gapirayotgan paytda qabul qilingan qaror ('Sut yo'q.' — 'Men olib kelaman.' → I'll get some); 2) fikringizga asoslangan bashorat (I think it will rain); 3) va'da va taklif (I'll help you).\nam/is/are going to + fe'l: 1) oldindan rejalashtirilgan niyat (I'm going to study medicine); 2) hozir ko'rinib turgan belgiga asoslangan bashorat (Look at those clouds! It's going to rain).","ogatish":"O'zingizga ikki savol bering: 1) Qaror hozir, shu daqiqada qabul qilindimi? → will. 2) Reja oldindan tayyor edimi yoki ko'z oldimizda aniq belgi bormi? → going to. Mashqlardagi qavs ichidagi izoh (reja, hozir qaror) sizga yo'l ko'rsatadi.","misollar":[{"ingliz":"'I'm thirsty.' — 'I'll get you some water.'","uzbek":"'Chanqadim.' — 'Men sizga suv olib kelaman.' (hozirgi qaror)"},{"ingliz":"I'm going to study medicine next year.","uzbek":"Men kelasi yil tibbiyotni o'qimoqchiman. (oldindan reja)"},{"ingliz":"Look at the sky! It's going to rain.","uzbek":"Osmonga qarang! Yomg'ir yog'adigan bo'ldi. (belgi bor)"},{"ingliz":"I think she will win.","uzbek":"Menimcha, u g'alaba qozonadi. (fikr)"}],"xato":"O'zbekchada kelasi zamon bitta shaklda ('boraman'), shuning uchun ko'pchilik hamma joyda faqat 'will' ishlatadi. Oldindan rejalashtirilgan ishda 'going to' tabiiyroq. Yana: 'I will to go' va 'I am going to went' xato. To'g'risi: 'I will go'; 'I am going to go'.","mashqlar":[{"savol":"(oldindan reja) We have bought the tickets. We ___ visit Bukhara next month.","variantlar":["are going to","are going","go to","are going visit"],"togri":0,"izoh":"Chiptalar allaqachon olingan, reja bor: are going to."},{"savol":"(hozir qaror qildingiz) 'We have no bread.' — 'OK, I ___ buy some.'","variantlar":["am going","go to","will","going to"],"togri":2,"izoh":"Qaror gapirayotgan paytda qabul qilindi: will. Boshqa variantlarning shakli noto'g'ri."},{"savol":"(ko'z oldingizda belgi bor) Look! That car ___ crash!","variantlar":["goes to","will","is going to","is going"],"togri":2,"izoh":"Ko'rinib turgan belgi asosida bashorat: is going to."},{"savol":"(fikr, bashorat) I think Uzbekistan ___ win the match.","variantlar":["is going","will","going to","wills"],"togri":1,"izoh":"'I think' bilan fikrga asoslangan bashorat: will win."}]},{"raqam":18,"sarlavha":"1-tur shart gaplar — First Conditional","daraja":"B2","tayyor":true,"qoida":"Kelajakda amalga oshishi mumkin bo'lgan shart va uning natijasi.\nTuzilishi: If + Present Simple, will + fe'l. Misol: If it rains, we will stay at home.\nIf gapi oldin kelsa, vergul qo'yiladi; keyin kelsa, vergul shart emas: We will stay at home if it rains.\nMuhim: if dan keyingi qismda odatda will ishlatilmaydi (kelajak ma'nosi bo'lsa ham). Unless = if ... not (Unless you hurry = If you don't hurry).","ogatish":"Gapni ikkiga bo'ling. Shart qismi (If ...) — hozirgi zamon, kelajak ma'nosida bo'lsa ham. Natija qismi — will + fe'l. 'Agar yomg'ir yog'sa, uyda qolamiz' → If it RAINS (hozirgi), we WILL stay (will).","misollar":[{"ingliz":"If it rains, we will stay at home.","uzbek":"Agar yomg'ir yog'sa, uyda qolamiz."},{"ingliz":"If you study hard, you will pass the exam.","uzbek":"Agar qattiq o'qisangiz, imtihondan o'tasiz."},{"ingliz":"She will be angry if you don't call her.","uzbek":"Agar unga qo'ng'iroq qilmasangiz, u g'azablanadi."},{"ingliz":"If I see him, I will tell him.","uzbek":"Agar uni ko'rsam, unga aytaman."}],"xato":"O'zbekchada shart '-sa' qo'shimchasi bilan ifodalanadi ('yog'sa'), kelasi zamon ma'nosi o'zi bilinadi. Inglizchada ham shart qismida kelajak ma'nosi bor, lekin fe'l hozirgi zamonda turadi. Xato: 'If it will rain, we will stay'. To'g'risi: 'If it rains, we will stay'.","mashqlar":[{"savol":"If it ___ tomorrow, we will cancel the picnic.","variantlar":["rains","would rain","will rain","rain"],"togri":0,"izoh":"Shart qismida will yo'q: it + rains."},{"savol":"If you ___ hard, you will pass the exam.","variantlar":["will study","studied","study","would study"],"togri":2,"izoh":"If dan keyin hozirgi zamon: study."},{"savol":"I will call you if I ___ time.","variantlar":["have","would have","had","will have"],"togri":0,"izoh":"If dan keyin will ishlatilmaydi: if I have time."},{"savol":"If you don't hurry, you ___ the last bus tonight.","variantlar":["would miss","missed","miss","will miss"],"togri":3,"izoh":"Natija qismi: will + fe'l."}]},{"raqam":19,"sarlavha":"Majhul nisbat — Passive Voice","daraja":"B2","tayyor":true,"qoida":"Majhul nisbatda harakatni bajaruvchi emas, harakat yo'nalgan narsa muhim bo'ladi.\nShakli: be + fe'lning 3-shakli (V3).\nHozirgi: is / are + V3 (English is spoken here). O'tgan: was / were + V3 (The bridge was built in 1995). Kelasi: will be + V3 (The letter will be sent tomorrow).\nKim qilganini aytish kerak bo'lsa, by qo'shiladi: The window was broken by the boy.","ogatish":"Bajaruvchi noma'lum yoki muhim emasmi? Unda passiv. 1) Narsani gap boshiga qo'ying. 2) be fe'lini zamoniga qarab tanlang. 3) Asosiy fe'lni V3 ga o'zgartiring. 4) Kerak bo'lsa oxiriga by + kim qo'shing.","misollar":[{"ingliz":"This bridge was built in 1995.","uzbek":"Bu ko'prik 1995-yilda qurilgan."},{"ingliz":"English is spoken all over the world.","uzbek":"Ingliz tilida butun dunyoda gaplashiladi."},{"ingliz":"The documents will be sent tomorrow.","uzbek":"Hujjatlar ertaga yuboriladi."},{"ingliz":"The window was broken by the boy.","uzbek":"Deraza bola tomonidan sindirilgan."}],"xato":"O'zbekchada majhul nisbat fe'lga -il / -in qo'shimchasi bilan yasaladi ('qurildi', 'yoziladi'). Inglizchada faqat V3 yetmaydi, oldidan be kerak. Xato: 'The house built in 1990'. To'g'risi: 'The house was built in 1990'. Yana: happen, arrive, die kabi fe'llar passivga o'tmaydi ('was happened' xato).","mashqlar":[{"savol":"This mosque ___ in the 15th century.","variantlar":["is built","has build","was built","built"],"togri":2,"izoh":"O'tgan zamon, majhul nisbat: was + V3."},{"savol":"Many languages ___ in Uzbekistan.","variantlar":["speak","spoke","is spoken","are spoken"],"togri":3,"izoh":"Many languages ko'plik, hozirgi zamon: are + V3."},{"savol":"The report ___ tomorrow.","variantlar":["will be sent","sent","will send","is sending"],"togri":0,"izoh":"Kelasi zamon majhul nisbat: will be + V3."},{"savol":"The thief ___ by the police yesterday.","variantlar":["caught","is caught","was caught","catches"],"togri":2,"izoh":"Yesterday va by the police: was caught."}]},{"raqam":20,"sarlavha":"Ko'chirma gap — Reported Speech","daraja":"B2","tayyor":true,"qoida":"Birovning gapini o'z so'zlarimiz bilan aytib berish. Odatda said (that) / told + shaxs ishlatiladi.\nZamon odatda bir pog'ona ORQAGA suriladi (o'rganish uchun asosiy qoida shu): am/is/are → was/were; do/does → did; will → would; can → could; Past Simple → Past Perfect (had + V3).\nOlmosh va vaqt so'zlari ham o'zgaradi: I → he/she, today → that day, tomorrow → the next day, here → there.\nSavolda: asked + if / whether (ha-yo'q savol) yoki savol so'zi; gap tartibi oddiy bo'ladi (do/does/did ishlatilmaydi).","ogatish":"Qadamlar: 1) Kim aytganini yozing (He said ...). 2) Zamonni bir pog'ona orqaga suring. 3) Olmosh va vaqt so'zlarini moslang. 4) Savol bo'lsa, if yoki savol so'zidan keyin oddiy tartibda yozing. 'Do you like tea?' he asked → He asked if I liked tea.","misollar":[{"ingliz":"'I am tired,' he said. → He said he was tired.","uzbek":"'Charchadim,' dedi u. → U charchaganini aytdi."},{"ingliz":"'I will call you,' she said. → She said she would call me.","uzbek":"'Sizga qo'ng'iroq qilaman,' dedi u. → U menga qo'ng'iroq qilishini aytdi."},{"ingliz":"'Do you like tea?' he asked. → He asked if I liked tea.","uzbek":"'Choy yoqadimi?' deb so'radi u. → U menga choy yoqadimi, deb so'radi."},{"ingliz":"'I bought a car,' Ali said. → Ali said he had bought a car.","uzbek":"'Mashina sotib oldim,' dedi Ali. → Ali mashina sotib olganini aytdi."}],"xato":"O'zbekchada ko'chirma gapni egalik qo'shimchalari bilan oson aytib beramiz va zamon deyarli o'zgarmaydi. Inglizchada zamon orqaga suriladi. Xato: 'He said he is tired' (hozir ham to'g'ri bo'lsa mumkin, lekin o'rganish uchun qoida: was). Savolda ham xato ko'p: 'He asked where do I live' — to'g'risi 'He asked where I lived'.","mashqlar":[{"savol":"(qoida bo'yicha zamonni orqaga suring) 'I am hungry,' she said. → She said she ___ hungry.","variantlar":["was","is","has been","were"],"togri":0,"izoh":"Am → was, olmosh I → she."},{"savol":"(qoida bo'yicha) 'I will help you,' he said. → He said he ___ help me.","variantlar":["can","would","will","shall"],"togri":1,"izoh":"Will → would."},{"savol":"(qoida bo'yicha) 'I bought a car,' Ali said. → Ali said he ___ a car.","variantlar":["has bought","buys","had bought","bought"],"togri":2,"izoh":"Past Simple → Past Perfect: had bought."},{"savol":"'Do you like tea?' he asked me. → He asked me ___ tea.","variantlar":["do I like","that I liked","if did I like","if I liked"],"togri":3,"izoh":"Ha-yo'q savolda if + oddiy tartib, zamon orqaga: if I liked."}]},{"raqam":21,"sarlavha":"Sanaladigan / sanalmaydigan — some / any / much / many","daraja":"A2","tayyor":true,"qoida":"Sanaladigan otlar (countable): book → books, apple → apples, student → students.\nSanalmaydigan otlar (uncountable): water, milk, money, time, rice, advice, information, news.\nsome — darak gapda: I have some friends.   any — inkor va savolda: I don't have any money. Do you have any questions?\nTaklif va iltimosda ham some: Would you like some tea?\nmany — sanaladigan ko'plik bilan: How many books? There aren't many chairs.\nmuch — sanalmaydigan bilan: How much water? We don't have much time.\nDarak gapda ko'pincha a lot of ishlatiladi: She has a lot of money.","ogatish":"Avval otni tekshiring: uni 1, 2, 3 deb sanab bo'ladimi? Ha bo'lsa — many; yo'q bo'lsa — much. Keyin gap turiga qarang: darak — some, inkor yoki savol — any.","misollar":[{"ingliz":"There are some apples on the table.","uzbek":"Stol ustida bir nechta olma bor."},{"ingliz":"I don't have any money.","uzbek":"Mening pulim yo'q."},{"ingliz":"How many students are in your class?","uzbek":"Sinfingizda nechta o'quvchi bor?"},{"ingliz":"How much time do we have?","uzbek":"Qancha vaqtimiz bor?"}],"xato":"O'zbekchada 'ko'p' bitta so'z, inglizchada esa sanaladigan va sanalmaydigan otlar uchun har xil so'z kerak. Xato: 'much students', 'many water'. Yana bir tuzoq: o'zbekchada sanaladigan tuyulgan so'zlar inglizchada sanalmaydi (advice, information, news). Xato: 'an advice', 'informations'. To'g'risi: 'some advice', 'some information'.","mashqlar":[{"savol":"There isn't ___ milk in the fridge.","variantlar":["any","many","a","some"],"togri":0,"izoh":"Inkor gapda any ishlatiladi; milk sanalmaydi, shuning uchun many va a mos kelmaydi."},{"savol":"How ___ people came to the party?","variantlar":["much","any","some","many"],"togri":3,"izoh":"People sanaladi, savolda many ishlatiladi: How many people?"},{"savol":"I need ___ advice.","variantlar":["some","an","a few","many"],"togri":0,"izoh":"Advice sanalmaydigan ot: some advice (an advice yoki many advice emas)."},{"savol":"We don't have ___ time.","variantlar":["some","much","many","a lot"],"togri":1,"izoh":"Time sanalmaydi, inkorda much ishlatiladi: We don't have much time."}]},{"raqam":22,"sarlavha":"To'ldiruvchi olmoshlar — me / him / her / us / them","daraja":"A2","tayyor":true,"qoida":"Ega olmoshlari gapning boshida turadi: I, you, he, she, it, we, they.\nTo'ldiruvchi olmoshlari fe'ldan yoki predlogdan keyin turadi:\nI → me, you → you, he → him, she → her, it → it, we → us, they → them.\nMisol: Can you help me? I like them. Give it to her. Come with us.","ogatish":"Olmosh fe'ldan oldin tursa, bu ega: HE likes tea. Fe'ldan yoki predlogdan keyin tursa, to'ldiruvchi shakli kerak: I like HIM. Talk to HER.","misollar":[{"ingliz":"Can you help me, please?","uzbek":"Iltimos, menga yordam bera olasizmi?"},{"ingliz":"I see him every day.","uzbek":"Men uni har kuni ko'raman."},{"ingliz":"She is talking to us.","uzbek":"U biz bilan gaplashyapti."},{"ingliz":"These books are interesting. I read them often.","uzbek":"Bu kitoblar qiziqarli. Men ularni tez-tez o'qiyman."}],"xato":"O'zbekchada 'meni, menga, men bilan' qo'shimchalar bilan ifodalanadi. Inglizchada esa bu uchun alohida so'z bor. Xato: 'I like she', 'Give I the book', 'He called I'. To'g'risi: 'I like her', 'Give me the book', 'He called me'.","mashqlar":[{"savol":"Where is Ali? I want to talk to ___.","variantlar":["himself","he","him","his"],"togri":2,"izoh":"Predloqdan (to) keyin to'ldiruvchi shakli kerak: him."},{"savol":"My parents are here. I love ___ very much.","variantlar":["they","their","them","theirs"],"togri":2,"izoh":"Fe'ldan (love) keyin: them."},{"savol":"Can you help ___? I don't understand.","variantlar":["my","me","mine","I"],"togri":1,"izoh":"Fe'ldan (help) keyin: me."},{"savol":"Anna is my sister. I often call ___.","variantlar":["she","hers","he","her"],"togri":3,"izoh":"Fe'ldan (call) keyin: her."}]},{"raqam":23,"sarlavha":"Takrorlanish ravishlari — always / usually / often / never","daraja":"A2","tayyor":true,"qoida":"Qanchalik tez-tez bo'lishini bildiradi:\nalways (100%) → usually → often → sometimes → rarely / seldom → never (0%).\nJoyi: to be fe'lidan KEYIN, boshqa fe'ldan OLDIN.\nHe is always late. I usually get up at 7. She never eats meat.\nSometimes gap boshida yoki oxirida ham kelishi mumkin: Sometimes I walk to work.\nSavol: How often do you...? Javob: every day, twice a week, once a month.","ogatish":"Gapda to be fe'li bormi (am/is/are/was/were)? Unda ravish uning orqasida. To be yo'qmi? Unda ravish asosiy fe'ldan oldin.","misollar":[{"ingliz":"I always drink tea in the morning.","uzbek":"Men ertalab doim choy ichaman."},{"ingliz":"She is never late for work.","uzbek":"U ishga hech qachon kech qolmaydi."},{"ingliz":"We sometimes go to the park.","uzbek":"Biz ba'zan bog'ga boramiz."},{"ingliz":"How often do you visit your grandmother?","uzbek":"Buvingizni qanchalik tez-tez ko'rgani borasiz?"}],"xato":"O'zbekchada 'doim', 'ba'zan' gapning istalgan joyiga qo'yiladi. Inglizchada joyi qat'iy. Xato: 'I go always to school', 'She plays usually football'. To'g'risi: 'I always go to school', 'She usually plays football'.","mashqlar":[{"savol":"She ___ late for class.","variantlar":["never is","does never be","never be","is never"],"togri":3,"izoh":"To be fe'li bor, ravish undan keyin turadi: is never."},{"savol":"(0%) I ___ drink coffee in the evening.","variantlar":["usually","often","always","never"],"togri":3,"izoh":"0% — never."},{"savol":"My brother ___ to the gym on Sundays.","variantlar":["goes usually to","goes usually","usually goes","usually go"],"togri":2,"izoh":"Ravish asosiy fe'ldan oldin keladi; he/brother bilan goes."},{"savol":"___ do you visit your grandmother? — Once a week.","variantlar":["How much","How long","How often","How many"],"togri":2,"izoh":"Javob takrorlanishni bildiryapti (once a week): How often."}]},{"raqam":24,"sarlavha":"Vaqt predloglari — in / on / at","daraja":"A2","tayyor":true,"qoida":"at — aniq vaqt va payt: at 7 o'clock, at noon, at midnight, at night, at the weekend.\non — kunlar va sanalar: on Monday, on 5 May, on my birthday, on Sunday morning.\nin — oylar, yillar, fasllar, kunning qismlari: in July, in 2024, in summer, in the morning, in the evening.\nIstisno: odatda at night, lekin in the morning / in the afternoon / in the evening.","ogatish":"Katta-kichikdan o'ylang: eng kichik birlik (soat) — at; o'rtadagi (kun, sana) — on; eng katta (oy, yil, fasl) — in.","misollar":[{"ingliz":"The lesson starts at 9 o'clock.","uzbek":"Dars soat 9 da boshlanadi."},{"ingliz":"My birthday is on 12 March.","uzbek":"Mening tug'ilgan kunim 12-martda."},{"ingliz":"We go on holiday in August.","uzbek":"Biz avgustda ta'tilga chiqamiz."},{"ingliz":"I like to read at night.","uzbek":"Men kechasi kitob o'qishni yaxshi ko'raman."}],"xato":"O'zbekchada vaqt qo'shimchalar bilan ('soat 9 da', 'dushanbada', 'avgustda') beriladi va farq sezilmaydi. Inglizchada esa har birining o'z predlogi bor. Xato: 'in Monday', 'at July', 'on 2024'. To'g'risi: 'on Monday', 'in July', 'in 2024'.","mashqlar":[{"savol":"The lesson starts ___ 9 o'clock.","variantlar":["on","by","at","in"],"togri":2,"izoh":"Aniq soat bilan at ishlatiladi."},{"savol":"My birthday is ___ 12 March.","variantlar":["in","on","at","to"],"togri":1,"izoh":"Sana bilan on ishlatiladi."},{"savol":"We usually go on holiday ___ August.","variantlar":["on","to","at","in"],"togri":3,"izoh":"Oy bilan in ishlatiladi."},{"savol":"I like to read ___ night.","variantlar":["at","by","in","on"],"togri":0,"izoh":"'At night' — istisno, in the night emas."}]},{"raqam":25,"sarlavha":"Fe'l + -ing yoki to + fe'l (like doing / want to do)","daraja":"A2","tayyor":true,"qoida":"Ba'zi fe'llardan keyin fe'l -ing shaklida keladi (enjoy, finish, mind, stop, keep, avoid; stop to do boshqa ma'no beradi, 38-mavzuga qarang): I enjoy swimming. She finished writing.\nBoshqalaridan keyin to + fe'l keladi (want, need, hope, decide, plan, learn, would like): I want to learn English. They decided to leave.\nlike, love, hate, start ikkala shakl bilan ham ishlatiladi: I like swimming = I like to swim.\nModal fe'ldan keyin to qo'yilmaydi: I can swim.","ogatish":"Fe'lni yodlab oling: enjoy, finish, mind → -ing; want, need, hope, decide → to. Modal bo'lmagan fe'llardan keyin ikkinchi fe'lni oddiy shaklda qoldirmang: 'I want go' xato.","misollar":[{"ingliz":"I enjoy learning English.","uzbek":"Men ingliz tilini o'rganishdan zavq olaman."},{"ingliz":"She wants to become a doctor.","uzbek":"U shifokor bo'lmoqchi."},{"ingliz":"He finished doing his homework at eight.","uzbek":"U uy vazifasini soat sakkizda tugatdi."},{"ingliz":"We decided to cancel the trip.","uzbek":"Biz sayohatni bekor qilishga qaror qildik."}],"xato":"O'zbekchada ikkinchi fe'l bitta shaklda ('o'qishni xohlayman', 'o'qishdan zavqlanaman'). Inglizchada esa fe'lga qarab shakl o'zgaradi. Xato: 'I want go', 'I enjoy to read', 'She decided leaving'. To'g'risi: 'I want to go', 'I enjoy reading', 'She decided to leave'.","mashqlar":[{"savol":"I enjoy ___ English.","variantlar":["learn","learned","learning","to learn"],"togri":2,"izoh":"Enjoy dan keyin -ing: enjoy learning."},{"savol":"She wants ___ a doctor.","variantlar":["become","became","becoming","to become"],"togri":3,"izoh":"Want dan keyin to + fe'l: wants to become."},{"savol":"He finished ___ his homework at 8.","variantlar":["doing","does","to do","do"],"togri":0,"izoh":"Finish dan keyin -ing: finished doing."},{"savol":"We decided ___ the trip.","variantlar":["cancel","to cancel","cancelling","cancelled"],"togri":1,"izoh":"Decide dan keyin to + fe'l: decided to cancel."}]},{"raqam":26,"sarlavha":"Egalik kelishigi — 's va whose","daraja":"A2","tayyor":true,"qoida":"Odamga tegishli narsani 's bilan yasaymiz: Ali's book, my sister's room.\nKo'plik -s bilan tugasa, faqat apostrof qo'shamiz: the students' room (bir nechta o'quvchi).\nKo'plik -s bilan tugamasa, 's qo'shamiz: the children's toys, the men's shoes.\nNarsalar uchun ko'pincha of ishlatiladi: the door of the room, the colour of the car.\nSavol: Whose book is this? — It's Ali's.","ogatish":"Egasi odammi? Unda 's. Bitta egami? Unda 's. Ko'plikda -s bilan tugagan so'zdan keyin faqat '. Egasi narsami (xona, mashina)? Unda of.","misollar":[{"ingliz":"This is my brother's car.","uzbek":"Bu mening akamning mashinasi."},{"ingliz":"The children's toys are on the floor.","uzbek":"Bolalarning o'yinchoqlari polda."},{"ingliz":"The door of the room is blue.","uzbek":"Xonaning eshigi ko'k."},{"ingliz":"Whose phone is this? — It's Madina's.","uzbek":"Bu kimning telefoni? — Madinaniki."}],"xato":"O'zbekchada egalik '-ning' va '-i' bilan beriladi ('akamning mashinasi'). Inglizchada tartib teskari: egasi oldin, narsa keyin. Xato: 'the car my brother', 'Alis book'. To'g'risi: 'my brother's car', 'Ali's book', 'the door of the room' (narsalar uchun odatda of).","mashqlar":[{"savol":"___ phone is this? — It's Madina's.","variantlar":["Whose","Who","What","Who's"],"togri":0,"izoh":"Kimning narsasi ekanini so'rash uchun Whose."},{"savol":"The ___ toys are on the floor. (ko'p bola)","variantlar":["childrens'","children's","childs","children"],"togri":1,"izoh":"Children ko'plik, lekin -s bilan tugamaydi, shuning uchun 's: children's."},{"savol":"The colour ___ is blue.","variantlar":["house of","houses","the house's","of the house"],"togri":3,"izoh":"Narsaning rangi uchun of: the colour of the house."},{"savol":"That is my ___ room. (bitta opa)","variantlar":["sisters","sister","sisters'","sister's"],"togri":3,"izoh":"Bitta egasi bor: sister's."}]},{"raqam":27,"sarlavha":"Avvalgi odat — used to","daraja":"B1","tayyor":true,"qoida":"used to + fe'lning oddiy shakli — o'tmishda takrorlanib turgan, lekin endi yo'q odat yoki holat.\nI used to play football. (Endi o'ynamayman.)  She used to live in Samarkand.\nInkor: didn't use to + fe'l. Savol: Did you use to + fe'l?\nChalkashtirmang: be used to + -ing — 'ko'nikkan': I am used to getting up early.","ogatish":"Savol: bu hozir ham shundaymi? Yo'q, avval shunday edi — used to + fe'l. Ko'nikma haqida gap ketyaptimi? Unda am/is/are used to + -ing.","misollar":[{"ingliz":"I used to live in Samarkand.","uzbek":"Men ilgari Samarqandda yashardim."},{"ingliz":"We used to play chess every evening.","uzbek":"Biz ilgari har oqshom shaxmat o'ynardik."},{"ingliz":"Did you use to smoke?","uzbek":"Siz ilgari chekarmidingiz?"},{"ingliz":"I am used to getting up early.","uzbek":"Men erta turishga ko'nikkanman."}],"xato":"O'zbekchada 'o'ynardim' shakli bor, lekin ko'pchilik inglizchada oddiy o'tgan zamonni ishlatadi. Xato: 'I used to going', 'I didn't used to play'. To'g'risi: 'I used to go', 'I didn't use to play'. Savol va inkorda d yo'qoladi.","mashqlar":[{"savol":"I ___ live in Samarkand, but now I live in Tashkent.","variantlar":["used to","am used to","was used","use to"],"togri":0,"izoh":"Avval shunday edi, endi yo'q: used to + fe'l."},{"savol":"Did you ___ play chess as a child?","variantlar":["used to","using to","used","use to"],"togri":3,"izoh":"Savolda did bor, shuning uchun use to (d siz)."},{"savol":"I am used to ___ up early.","variantlar":["getting","get","to get","got"],"togri":0,"izoh":"Be used to dan keyin -ing: getting."},{"savol":"When I was a child, we ___ every summer at my grandparents' house.","variantlar":["use to stay","are used to staying","used to stay","used staying"],"togri":2,"izoh":"O'tmishdagi takrorlangan odat: used to stay."}]},{"raqam":28,"sarlavha":"O'tgan tugallangan zamon — Past Perfect","daraja":"B1","tayyor":true,"qoida":"Shakli: had + fe'lning 3-shakli (V3). Barcha shaxslarda had.\nIshlatilishi: o'tmishdagi ikki voqeadan avval bo'lganini ko'rsatadi.\nWhen I arrived, the film had already started. (Avval film boshlangan, keyin men keldim.)\nInkor: hadn't + V3. Savol: Had + ega + V3?\nBelgilar: before, after, by the time, already, just.","ogatish":"Ikkita o'tgan harakatni toping. Qaysi biri OLDIN bo'lgan? Oldingisi — had + V3, keyingisi — Past Simple. Vaqt chizig'ini ko'z oldingizga keltiring: avval → keyin.","misollar":[{"ingliz":"When we arrived, the film had already started.","uzbek":"Biz yetib kelganimizda film allaqachon boshlangan edi."},{"ingliz":"She had studied English before she moved to London.","uzbek":"U Londonga ko'chishdan oldin ingliz tilini o'rgangan edi."},{"ingliz":"I couldn't get in because I had left my key at home.","uzbek":"Men kira olmadim, chunki kalitni uyda qoldirgan edim."},{"ingliz":"After he had eaten dinner, he watched TV.","uzbek":"Kechki ovqatni yeb bo'lgach, u televizor ko'rdi."}],"xato":"O'zbekchada '-gan edi' shakli bor, lekin ko'pchilik uni ishlatmaydi va ikki voqeani ham oddiy o'tgan zamonda aytadi. Natijada qaysi biri avval bo'lgani yo'qoladi. Xato: 'When I arrived, he already left'. To'g'risi: 'When I arrived, he had already left'.","mashqlar":[{"savol":"(kalit oldin qoldirilgan) I couldn't get in because I ___ my key at home.","variantlar":["was leaving","left","had left","have left"],"togri":2,"izoh":"Qoldirish eshikni ochishga urinishdan oldin bo'lgan: had left."},{"savol":"By the time we arrived, the concert ___.","variantlar":["has finished","had finished","finishes","was finish"],"togri":1,"izoh":"By the time bilan oldin tugagan harakat: had finished."},{"savol":"(ko'chishdan oldin o'qigan) She ___ English before she moved to London.","variantlar":["had studied","has studied","studies","was studying"],"togri":0,"izoh":"O'qish ko'chishdan oldin bo'lgan: had studied."},{"savol":"After he ___ dinner, he watched TV.","variantlar":["had eaten","eats","is eating","has eaten"],"togri":0,"izoh":"Ovqat yeyish televizor ko'rishdan oldin tugagan: had eaten."}]},{"raqam":29,"sarlavha":"Hozirgi tugallanmagan davomli — Present Perfect Continuous","daraja":"B1","tayyor":true,"qoida":"Shakli: have / has + been + fe'l-ing.\nIshlatilishi: 1) hozirgacha davom etayotgan jarayon (for / since bilan): I have been learning English for two years. 2) hozirgina tugagan va izi ko'rinib turgan harakat: Your hands are dirty. — I have been working in the garden.\nHolat fe'llari (know, like, love, understand, have — egalik ma'nosida) davomli shaklda ishlatilmaydi: I have known him for ten years.","ogatish":"Savol: jarayon muhimmi yoki natija? Jarayon va davomiylik (qancha vaqt) — have been -ing. Natija yoki son (3 ta kitob) — oddiy Present Perfect.","misollar":[{"ingliz":"I have been learning English for two years.","uzbek":"Men ikki yildan beri ingliz tilini o'rganyapman."},{"ingliz":"She is tired because she has been working all day.","uzbek":"U charchagan, chunki kun bo'yi ishlagan."},{"ingliz":"We have been waiting for an hour.","uzbek":"Biz bir soatdan beri kutyapmiz."},{"ingliz":"I have known him for ten years.","uzbek":"Men uni o'n yildan beri bilaman."}],"xato":"O'zbekchada 'o'rganyapman' davom etayotgan harakatni bildiradi va 'ikki yildan beri' qo'shilsa ham shakl o'zgarmaydi. Inglizchada esa for/since bilan hozirgi oddiy zamon ishlatilmaydi. Xato: 'I am learning English for two years'. To'g'risi: 'I have been learning English for two years'. Holat fe'llarida: 'I have been knowing' xato.","mashqlar":[{"savol":"I ___ English for two years.","variantlar":["have been learning","learn","was learning","am learning"],"togri":0,"izoh":"For two years bilan hozirgacha davom etgan jarayon: have been learning."},{"savol":"She is tired. She ___ in the garden since morning.","variantlar":["worked","works","has been working","is working"],"togri":2,"izoh":"Since morning — hozirgacha davom etgan jarayon va natija ko'rinib turibdi: has been working."},{"savol":"We ___ waiting for an hour.","variantlar":["had","have been","are","was"],"togri":1,"izoh":"For an hour — davom etgan jarayon: have been waiting."},{"savol":"(hali ham tanishman) I ___ him for ten years.","variantlar":["have been knowing","have known","am knowing","knew"],"togri":1,"izoh":"Know holat fe'li, davomli shaklda ishlatilmaydi: have known."}]},{"raqam":30,"sarlavha":"2-tur shart gaplar — Second Conditional","daraja":"B1","tayyor":true,"qoida":"Hozirgi yoki kelajakdagi xayoliy, real bo'lmagan vaziyat.\nTuzilishi: If + Past Simple, would + fe'l.\nIf I had a million dollars, I would buy a house. (Menda million dollar yo'q.)\nIf I were you, I would study more. (Maslahat berish.)\nTo be fe'li standart tilda barcha shaxslarda were bo'ladi (If I were, if she were); norasmiy nutqda was ham uchraydi.\nIf qismida odatda would ishlatilmaydi.","ogatish":"Vaziyat real emasmi (hozir bunday emas, bo'lishi ham qiyin)? Unda: If + Past Simple, would + fe'l. 'Agar boy bo'lsam' (lekin boy emasman) → If I were rich, I would...","misollar":[{"ingliz":"If I were rich, I would travel the world.","uzbek":"Agar boy bo'lganimda, butun dunyo bo'ylab sayohat qilgan bo'lardim."},{"ingliz":"If she studied more, she would pass the exam.","uzbek":"Agar u ko'proq o'qisa, imtihondan o'tardi."},{"ingliz":"I would buy a big house if I had more money.","uzbek":"Pulim ko'proq bo'lsa, katta uy sotib olardim."},{"ingliz":"If I were you, I wouldn't do that.","uzbek":"Sizning o'rningizda bo'lsam, buni qilmasdim."}],"xato":"O'zbekchada '-sa' va '-ardi' qo'shimchalari bor, lekin 1-tur va 2-tur gaplar bir xil eshitiladi. Inglizchada farq bor: real shart — If + Present, will; xayoliy shart — If + Past, would. Xato: 'If I would have money, I would buy', 'If I will be rich'. To'g'risi: 'If I had money, I would buy'.","mashqlar":[{"savol":"If I ___ rich, I would travel the world.","variantlar":["were","would be","am","will be"],"togri":0,"izoh":"Xayoliy shartda to be — were."},{"savol":"If she studied more, she ___ the exam.","variantlar":["will pass","passes","would pass","passed"],"togri":2,"izoh":"Natija qismida would + fe'l."},{"savol":"I would buy a big house if I ___ more money.","variantlar":["had","would have","will have","have"],"togri":0,"izoh":"If qismida Past Simple: had."},{"savol":"If I ___ you, I wouldn't do that.","variantlar":["be","will be","am","were"],"togri":3,"izoh":"Maslahat berishda If I were you."}]},{"raqam":31,"sarlavha":"Aniqlovchi gaplar — who / which / that / where / whose","daraja":"B1","tayyor":true,"qoida":"Aniqlovchi gap otni tushuntiradi.\nwho — odam uchun: The woman who lives next door is a teacher.\nwhich — narsa uchun: This is the book which I told you about.\nthat — odam va narsa uchun (who / which o'rniga): The book that I bought is interesting.\nwhere — joy uchun: That is the restaurant where we had dinner.\nwhose — egalik uchun: He is the man whose car was stolen.\nAniqlovchi gap otdan KEYIN keladi. Agar who / which gapning egasi bo'lmasa, uni tushirish mumkin: The book (that) I bought.","ogatish":"Ikkita gapni birlashtiring: 'The woman is a teacher. She lives next door.' → 'The woman who lives next door is a teacher.' Savol: ot odammi (who), narsami (which), joymi (where) yoki kimningdir narsasimi (whose)?","misollar":[{"ingliz":"The woman who lives next door is a teacher.","uzbek":"Qo'shni uyda yashaydigan ayol o'qituvchi."},{"ingliz":"This is the book which I told you about.","uzbek":"Bu men sizga aytgan kitob."},{"ingliz":"That is the restaurant where we had dinner.","uzbek":"Bu biz kechki ovqatlangan restoran."},{"ingliz":"He is the man whose car was stolen.","uzbek":"Bu mashinasi o'g'irlangan odam."}],"xato":"O'zbekchada aniqlovchi gap ot OLDIDA keladi ('men yashaydigan shahar'). Inglizchada ot oldin, aniqlovchi gap keyin. Xato: 'The city where I live in' (in ortiqcha). To'g'risi: 'The city where I live'. Yana: 'The man who he lives here' xato, to'g'risi 'The man who lives here'.","mashqlar":[{"savol":"The woman ___ lives next door is a teacher.","variantlar":["where","whose","which","who"],"togri":3,"izoh":"Odam uchun who."},{"savol":"This is the book ___ I told you about.","variantlar":["who","whose","where","which"],"togri":3,"izoh":"Narsa uchun which."},{"savol":"That is the restaurant ___ we had dinner.","variantlar":["which","whom","who","where"],"togri":3,"izoh":"Joy uchun where."},{"savol":"He is the man ___ car was stolen.","variantlar":["who","that","which","whose"],"togri":3,"izoh":"Kimningdir mashinasi — egalik: whose."}]},{"raqam":32,"sarlavha":"Ortiqcha va yetarli — too / enough","daraja":"B1","tayyor":true,"qoida":"too + sifat — kerakdan ortiq (salbiy natija): The tea is too hot. (Ichib bo'lmaydi.)\nsifat + enough — yetarli: He is old enough to drive.\nenough + ot — yetarli miqdor: We have enough money.\nnot + sifat + enough — yetarli emas: She is not tall enough.\ntoo much (sanalmaydigan) / too many (sanaladigan) — haddan ko'p: too much noise, too many people.","ogatish":"Too salbiy ma'no beradi ('ortiqcha', 'bo'lmaydi'). Enough esa 'kifoya': sifatdan KEYIN, otdan OLDIN turadi. Joyini yodlang: tall enough, enough money.","misollar":[{"ingliz":"The tea is too hot. I can't drink it.","uzbek":"Choy juda issiq. Men uni icha olmayman."},{"ingliz":"He is old enough to drive.","uzbek":"U mashina haydash uchun yetarlicha katta."},{"ingliz":"We don't have enough money to buy a car.","uzbek":"Mashina sotib olishga pulimiz yetmaydi."},{"ingliz":"There are too many people here.","uzbek":"Bu yerda odam haddan ziyod ko'p."}],"xato":"O'zbekchada 'juda' ham 'haddan ziyod' ham bo'la oladi. Inglizchada very (shunchaki juda) va too (kerakdan ortiq) boshqa narsa. Xato: 'enough tall', 'too much people'. To'g'risi: 'tall enough', 'too many people'.","mashqlar":[{"savol":"The tea is ___ hot. I can't drink it.","variantlar":["enough","too","more","much"],"togri":1,"izoh":"Ichib bo'lmaydigan darajada issiq: too hot."},{"savol":"He is not tall ___ to play basketball.","variantlar":["very","too","enough","so"],"togri":2,"izoh":"Sifatdan keyin enough: tall enough."},{"savol":"We don't have ___ money to buy a car.","variantlar":["very","so","too","enough"],"togri":3,"izoh":"Otdan oldin enough: enough money."},{"savol":"There are ___ many people here. I can't find a seat.","variantlar":["too","so much","very much","enough"],"togri":0,"izoh":"Sanaladigan ko'plik bilan too many."}]},{"raqam":33,"sarlavha":"Qaytariluvchi savollar — Question Tags","daraja":"B1","tayyor":true,"qoida":"Gap oxiridagi qisqa savol ('shundaymi?', 'to'g'rimi?').\nDarak gap bo'lsa, tag inkor: You are a student, aren't you?\nInkor gap bo'lsa, tag darak: She doesn't like tea, does she?\nTag gapdagi yordamchi fe'l bilan tuziladi: can → can't he, did → didn't they, has → hasn't she.\nYordamchi fe'l yo'q (Present Simple) bo'lsa — do / does: You like tea, don't you?\nMaxsus: I am late, aren't I? Let's go, shall we?","ogatish":"Uch qadam: 1) gapdagi yordamchi fe'lni toping (am/is/are, do/does/did, have, can, will); 2) uni teskari ma'noda qo'ying (darak → inkor, inkor → darak); 3) oxirida egani olmosh bilan yozing (Ali → he).","misollar":[{"ingliz":"You are Ali, aren't you?","uzbek":"Siz Alisiz, shunday emasmi?"},{"ingliz":"She doesn't speak French, does she?","uzbek":"U fransuzcha gapirmaydi, to'g'rimi?"},{"ingliz":"They went to the party, didn't they?","uzbek":"Ular ziyofatga bordi, shunday emasmi?"},{"ingliz":"He can swim, can't he?","uzbek":"U suza oladi, to'g'rimi?"}],"xato":"O'zbekchada 'to'g'rimi?', 'shundaymi?' bitta qolipda hamma gapga qo'shiladi. Inglizchada esa har bir gapning o'z tagi bor. Xato: 'You are Ali, isn't it?', 'She likes tea, isn't she?'. To'g'risi: 'You are Ali, aren't you?', 'She likes tea, doesn't she?'.","mashqlar":[{"savol":"You are Ali, ___?","variantlar":["aren't you","don't you","isn't you","are you"],"togri":0,"izoh":"Darak gap — inkor tag: aren't you."},{"savol":"She doesn't speak French, ___?","variantlar":["does she","is she","do she","doesn't she"],"togri":0,"izoh":"Inkor gap — darak tag: does she."},{"savol":"They went to the party, ___?","variantlar":["did they","didn't they","don't they","weren't they"],"togri":1,"izoh":"Went (Past Simple) darak — didn't they."},{"savol":"He can swim, ___?","variantlar":["isn't he","can't he","can he","doesn't he"],"togri":1,"izoh":"Can darak — can't he."}]},{"raqam":34,"sarlavha":"3-tur shart gaplar — Third Conditional","daraja":"B2","tayyor":true,"qoida":"O'tmishdagi, endi o'zgartirib bo'lmaydigan xayoliy vaziyat va pushaymonlik.\nTuzilishi: If + Past Perfect (had + V3), would have + V3.\nIf I had studied harder, I would have passed the exam. (Lekin yaxshi o'qimadim, o'tolmadim.)\nInkor: If I hadn't missed the bus, I wouldn't have been late.\nIf qismida odatda would have ishlatilmaydi.","ogatish":"O'tmishga qarang: nima bo'lgan, agar boshqacha bo'lsa nima bo'lardi? Shart qismida had + V3, natija qismida would have + V3.","misollar":[{"ingliz":"If I had studied harder, I would have passed the exam.","uzbek":"Agar qattiqroq o'qiganimda, imtihondan o'tgan bo'lardim."},{"ingliz":"If she had left earlier, she would have caught the train.","uzbek":"Agar u erta chiqqanida, poyezdga ulgurgan bo'lardi."},{"ingliz":"We wouldn't have got wet if we had taken an umbrella.","uzbek":"Soyabon olganimizda, ho'l bo'lmagan bo'lardik."},{"ingliz":"If he had asked me, I would have helped him.","uzbek":"Agar u mendan so'raganida, unga yordam bergan bo'lardim."}],"xato":"O'zbekchada o'tmish shartida ham '-sa' va '-ardi' ishlatiladi, farq sezilmaydi. Inglizchada har bir qismda murakkab shakl kerak. Xato: 'If I would have studied', 'If I studied, I would pass' (o'tmish uchun). To'g'risi: 'If I had studied, I would have passed'.","mashqlar":[{"savol":"If I ___ harder, I would have passed the exam.","variantlar":["have studied","studied","had studied","would study"],"togri":2,"izoh":"If qismida had + V3: had studied."},{"savol":"If she had left earlier, she ___ the train.","variantlar":["would catch","would have caught","caught","had caught"],"togri":1,"izoh":"Natija qismida would have + V3."},{"savol":"We wouldn't have got wet if we ___ an umbrella.","variantlar":["had taken","would take","would have taken","took"],"togri":0,"izoh":"If qismida had taken."},{"savol":"If he ___ me, I would have helped him.","variantlar":["asked","had asked","has asked","would ask"],"togri":1,"izoh":"If qismida had asked."}]},{"raqam":35,"sarlavha":"Istak va afsus — wish / if only","daraja":"B2","tayyor":true,"qoida":"wish + Past Simple — hozirgi vaziyatdan norozilik: I wish I had a car. (Mashinam yo'q.)\nwish + were — I wish I were taller. Standart tilda barcha shaxslarda were (norasmiy nutqda was ham uchraydi).\nwish + Past Perfect — o'tmish afsusi: I wish I had studied. (O'qimadim.)\nwish + would — birovning xatti-harakatidan shikoyat: I wish you would stop talking.\nIf only — kuchliroq: If only I had more time!\nIstak yoki afsus ma'nosidagi wish dan keyin hozirgi zamon ishlatilmaydi.","ogatish":"Qaysi vaqt haqida afsuslanyapsiz? Hozir — Past Simple; o'tmish — Past Perfect; kelajakda boshqa birovdan o'zgarishni xohlasangiz — would.","misollar":[{"ingliz":"I wish I had more free time.","uzbek":"Qani endi bo'sh vaqtim ko'proq bo'lsa."},{"ingliz":"I wish I had studied harder last year.","uzbek":"Qani endi o'tgan yili qattiqroq o'qiganimda edi."},{"ingliz":"I wish it would stop raining.","uzbek":"Qani endi yomg'ir to'xtasa."},{"ingliz":"If only I could help you.","uzbek":"Qani endi sizga yordam bera olsam."}],"xato":"O'zbekchada 'qani endi' bilan fe'l shakli o'zgarmay qoladi. Inglizchada wish dan keyin zamon bir pog'ona orqaga suriladi. Xato: 'I wish I have a car', 'I wish I can help'. To'g'risi: 'I wish I had a car', 'I wish I could help'.","mashqlar":[{"savol":"I wish I ___ more free time now.","variantlar":["had","will have","would have","have"],"togri":0,"izoh":"Hozirgi norozilik: wish + Past Simple (had)."},{"savol":"(afsus) I wish I ___ harder last year.","variantlar":["study","would study","studied","had studied"],"togri":3,"izoh":"O'tmish afsusi: wish + Past Perfect (had studied)."},{"savol":"I wish it ___ raining. (shikoyat)","variantlar":["stopping","stops","would stop","has stop"],"togri":2,"izoh":"Shikoyat: wish + would + fe'l."},{"savol":"I wish I ___ you, but I don't know the answer.","variantlar":["can help","could help","will help","helped"],"togri":1,"izoh":"Wish dan keyin can emas, could."}]},{"raqam":36,"sarlavha":"Taxmin qilish — must / might / can't be","daraja":"B2","tayyor":true,"qoida":"Biror narsaga qanchalik ishonchimizni ko'rsatadi:\nmust be — deyarli aniq (~95%): He has been working all day. He must be tired.\nmight / may / could be — ehtimol (~50%): She might be at home.\ncan't be — deyarli mumkin emas: That can't be Ali's car. He doesn't have one.\nO'tmish uchun: must have + V3, might have + V3, can't have + V3. It must have rained last night.","ogatish":"Qanchalik ishonchingiz komil? Dalil bor va aniq xulosa — must; ishonch yo'q, o'ylab ko'ryapsiz — might; dalil boshqa narsani aytyapti — can't.","misollar":[{"ingliz":"He works 12 hours a day. He must be very tired.","uzbek":"U kuniga 12 soat ishlaydi. U juda charchagan bo'lsa kerak."},{"ingliz":"That can't be Ali's car. He doesn't have one.","uzbek":"Bu Alining mashinasi bo'la olmaydi. Uning mashinasi yo'q."},{"ingliz":"I'm not sure where he is. He might be at the library.","uzbek":"U qayerda ekanini bilmayman. Kutubxonada bo'lishi mumkin."},{"ingliz":"The ground is wet. It must have rained last night.","uzbek":"Yer ho'l. Kecha yomg'ir yoqqan bo'lsa kerak."}],"xato":"O'zbekchada 'bo'lsa kerak' va 'bo'lishi mumkin' ko'pincha aralashib ketadi, inglizchada esa must (deyarli aniq), might (ehtimol) va can't (mumkin emas) alohida. Yana: must dan keyin to qo'yilmaydi va o'tmishda must have + V3 kerak. Xato: 'He must to be tired', 'It must rained'. To'g'risi: 'He must be tired', 'It must have rained'.","mashqlar":[{"savol":"He works 12 hours every day. He ___ very tired.","variantlar":["can't be","must to be","must be","might to be"],"togri":2,"izoh":"Dalil bor, xulosa deyarli aniq: must be."},{"savol":"That ___ be Ali's car. Ali doesn't have a car.","variantlar":["must","might","can't","should"],"togri":2,"izoh":"Dalil teskarisini aytyapti: can't be."},{"savol":"I'm not sure where Ali is. He ___ at the library.","variantlar":["can't be","will be","might be","must be"],"togri":2,"izoh":"Ishonch yo'q: might be."},{"savol":"The ground is wet. It ___ last night.","variantlar":["can't have rained","might rains","must have rained","must rain"],"togri":2,"izoh":"O'tmish haqida xulosa: must have + V3."}]},{"raqam":37,"sarlavha":"Boshqa kishiga qildirish — have / get something done","daraja":"B2","tayyor":true,"qoida":"have + narsa + V3 — biz o'zimiz qilmaymiz, boshqa odam bizning uchun qiladi.\nI had my car repaired. (Men o'zim tuzatmadim, boshqa kishiga tuzattirdim.)\nShe is having her hair cut. He has his teeth checked every six months.\nInformalda get ham ishlatiladi: I got my phone fixed.\nFaqat I cut my hair desak, odatda o'zimiz kesganimiz bildiriladi.","ogatish":"Savol: ishni kim qildi? O'zingiz — oddiy zamon. Boshqa kishi (usta, vrach, sartarosh) — have + narsa + V3.","misollar":[{"ingliz":"I had my car repaired yesterday.","uzbek":"Men kecha mashinamni ustaga tuzattirdim."},{"ingliz":"She is going to have her hair cut.","uzbek":"U sochini oldirmoqchi."},{"ingliz":"He has his teeth checked every six months.","uzbek":"U har olti oyda tishlarini tekshirtiradi."},{"ingliz":"We are having the house painted.","uzbek":"Biz uyni bo'yatyapmiz."}],"xato":"O'zbekchada '-dirmoq' qo'shimchasi bor ('tuzattirdim', 'oldirdim'), lekin ko'pchilik inglizchada oddiy fe'l ishlatib, o'zi qilgan ma'nosini beradi. Xato: 'I cut my hair at the barber's' (o'zingiz kesgandek). To'g'risi: 'I had my hair cut at the barber's'.","mashqlar":[{"savol":"I ___ my car repaired yesterday.","variantlar":["made","was","did","had"],"togri":3,"izoh":"Boshqa kishi tuzatgan: had + narsa + V3."},{"savol":"She is going to ___ her hair cut.","variantlar":["have","had","having","has"],"togri":0,"izoh":"Going to dan keyin fe'lning oddiy shakli: have."},{"savol":"He ___ his teeth checked every six months.","variantlar":["is","does","has","makes"],"togri":2,"izoh":"Odat, he bilan has + narsa + V3."},{"savol":"Qaysi gap 'sartarosh kesdi' ma'nosini beradi?","variantlar":["I cut my hair at home.","I cut my hair myself.","I had my hair cut.","I was cutting hair."],"togri":2,"izoh":"Boshqa kishi qilgan ishni have + narsa + V3 bildiradi."}]},{"raqam":38,"sarlavha":"Ma'noni o'zgartiruvchi fe'llar — stop / remember / try","daraja":"B2","tayyor":true,"qoida":"Ba'zi fe'llardan keyin -ing yoki to + fe'l kelsa, ma'no o'zgaradi:\nstop doing — qilishni to'xtatmoq: He stopped smoking. (Tashladi.)\nstop to do — boshqa ish uchun to'xtamoq: He stopped to smoke. (Chekish uchun to'xtadi.)\nremember doing — bajarilganini eslamoq: I remember locking the door.\nremember to do — esda tutib qilmoq: Remember to lock the door.\ntry doing — sinab ko'rmoq: Try drinking warm milk.\ntry to do — urinib ko'rmoq (qiyin): I tried to open the window, but it was stuck.\nforget doing / forget to do — xuddi remember kabi.","ogatish":"-ing — harakat allaqachon bo'lgan yoki sinov; to + fe'l — maqsad yoki hali bajarilmagan ish. Savol bering: harakat bo'lib o'tdimi (-ing) yoki hali qilinishi kerakmi (to)?","misollar":[{"ingliz":"He stopped smoking last year.","uzbek":"U o'tgan yili chekishni tashladi."},{"ingliz":"I must remember to post the letter.","uzbek":"Xatni jo'natishni unutmasligim kerak."},{"ingliz":"I remember locking the door. I'm sure it was locked.","uzbek":"Eshikni qulflaganimni eslayman. Aniq qulflangan."},{"ingliz":"Try drinking a glass of warm milk. It might help you sleep.","uzbek":"Bir stakan iliq sut ichib ko'ring. Uxlashga yordam berishi mumkin."}],"xato":"O'zbekchada 'to'xtadi', 'esladi', 'urinib ko'rdi' ikkala ma'noda ham bir xil shaklda. Inglizchada shakl ma'noni o'zgartiradi. Xato: 'I stopped to smoke' ('chekishni tashladim' ma'nosida). To'g'risi: 'I stopped smoking'.","mashqlar":[{"savol":"He doesn't smoke now. He stopped ___ last year.","variantlar":["smoking","to smoke","smoked","smoke"],"togri":0,"izoh":"Tashlagan: stop + -ing."},{"savol":"I must remember ___ the letter. It's important.","variantlar":["post","to post","posting","to posting"],"togri":1,"izoh":"Hali bajarilmagan ishni unutmaslik: remember + to."},{"savol":"I remember ___ the door. I'm sure it was locked.","variantlar":["lock","locked","locking","to lock"],"togri":2,"izoh":"Bajarilgan ishni eslash: remember + -ing."},{"savol":"Why don't you try ___ a glass of warm milk (tajriba qilib ko'ring)? It might help you sleep.","variantlar":["to drink","drank","drink","drinking"],"togri":3,"izoh":"Sinab ko'rish: try + -ing."}]},{"raqam":39,"sarlavha":"Inversiya — Never have I ... / Not only ... but","daraja":"C1","tayyor":true,"qoida":"Inkor yoki cheklovchi so'z gap boshiga chiqsa, yordamchi fe'l egadan oldin keladi (savoldagi tartib).\nNever have I seen such a beautiful place.\nRarely do we see such honesty.\nNot only did he arrive late, but he also forgot the documents.\nNo sooner had she opened the door than the phone rang.\nHardly had he sat down when the lights went out.\nOnly after / Under no circumstances / Little did they know... ham shunday.\nYordamchi fe'l yo'q bo'lsa do / does / did qo'shiladi.","ogatish":"1) Gap boshiga Never / Rarely / Not only / No sooner qo'ying. 2) Keyin yordamchi fe'lni yozing (have, do, did, had). 3) Undan keyin ega, so'ng asosiy fe'l. Oddiy gap: I have never seen it → Never have I seen it.","misollar":[{"ingliz":"Never have I seen such a beautiful place.","uzbek":"Men hech qachon bunday go'zal joyni ko'rmaganman."},{"ingliz":"Not only did he arrive late, but he also forgot the documents.","uzbek":"U nafaqat kech keldi, balki hujjatlarni ham unutdi."},{"ingliz":"No sooner had she opened the door than the phone rang.","uzbek":"U eshikni ochishi bilan telefon jiringladi."},{"ingliz":"Rarely do we see such honesty in politics.","uzbek":"Siyosatda bunday halollikni juda kam ko'ramiz."}],"xato":"O'zbekchada so'z tartibi erkin va inkor so'z boshiga chiqsa ham tartib o'zgarmaydi. Inglizchada o'zgaradi. Xato: 'Never I have seen', 'Not only he arrived late'. To'g'risi: 'Never have I seen', 'Not only did he arrive late'. Bu asosan yozma va rasmiy nutqda ishlatiladi.","mashqlar":[{"savol":"Never ___ such a beautiful place.","variantlar":["have I seen","I saw","did I seen","I have seen"],"togri":0,"izoh":"Never gap boshida: have + ega + V3."},{"savol":"Not only ___ late, but he also forgot the documents.","variantlar":["he arrived","he did arrive","arrived he","did he arrive"],"togri":3,"izoh":"Not only gap boshida: did + ega + oddiy fe'l."},{"savol":"No sooner had she opened the door ___ the phone rang.","variantlar":["than","when","then","that"],"togri":0,"izoh":"No sooner ... than: no sooner had she opened ... than the phone rang."},{"savol":"Rarely ___ such honesty in politics.","variantlar":["we do see","do we see","we see","see we"],"togri":1,"izoh":"Rarely gap boshida: do + ega + oddiy fe'l."}]},{"raqam":40,"sarlavha":"Aralash shart gaplar — Mixed Conditionals","daraja":"C1","tayyor":true,"qoida":"Shartning zamoni va natijaning zamoni har xil bo'lsa, aralash shart gap bo'ladi.\n1) O'tmishdagi sabab → hozirgi natija: If + Past Perfect, would + fe'l.\nIf I had studied medicine, I would be a doctor now. (O'qimadim, shuning uchun hozir shifokor emasman.)\n2) Hozirgi holat → o'tmishdagi natija: If + Past Simple, would have + V3.\nIf I were more careful, I wouldn't have made that mistake yesterday.\nNow, today, yesterday kabi vaqt so'zlari yordam beradi.","ogatish":"Ikki savol bering: shart qachon (o'tmish yoki hozir)? Natija qachon (o'tmish yoki hozir)? Shart o'tmishda, natija hozirda → had V3 ... would V. Shart hozirda, natija o'tmishda → were / V2 ... would have V3.","misollar":[{"ingliz":"If I had studied medicine, I would be a doctor now.","uzbek":"Agar tibbiyotni o'qiganimda, hozir shifokor bo'lardim."},{"ingliz":"If she had taken the job in Dubai, she would live there now.","uzbek":"Agar u Dubaydagi ishni olganida, hozir o'sha yerda yashardi."},{"ingliz":"If I were more careful, I wouldn't have made that mistake.","uzbek":"Agar ehtiyotkorroq bo'lsam, o'sha xatoni qilmagan bo'lardim."},{"ingliz":"If he hadn't missed the train, he would be at work now.","uzbek":"Agar u poyezdga kech qolmaganida, hozir ishda bo'lardi."}],"xato":"O'zbekchada '-sa' va '-ardi' qo'shimchalari har xil vaqtni bir xilda ifodalaydi, shuning uchun aralash shartni sezmaymiz. Xato: 'If I had studied medicine, I would have been a doctor now' (now bilan would have been emas, would be). To'g'risi: 'I would be a doctor now'.","mashqlar":[{"savol":"If I had studied medicine, I ___ a doctor now.","variantlar":["was","would be","would have been","will be"],"togri":1,"izoh":"Shart o'tmishda, natija hozir: would be."},{"savol":"If she had taken the job in Dubai, she ___ there now.","variantlar":["would live","would have lived","lived","will live"],"togri":0,"izoh":"Natija hozirga tegishli: would live."},{"savol":"If I were more careful, I ___ that mistake yesterday.","variantlar":["wouldn't have made","won't make","didn't make","wouldn't make"],"togri":0,"izoh":"Natija o'tmishda: would not have + V3."},{"savol":"If he ___ the train, he would be at work now.","variantlar":["didn't miss","wouldn't miss","doesn't miss","hadn't missed"],"togri":3,"izoh":"Shart o'tmishda: had not + V3."}]}];

const SAQLASH_KALITI='uzlearn_progress_v1';
