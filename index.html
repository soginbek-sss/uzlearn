function bugunSana(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function progressYuklash(){
  try{
    const xom=localStorage.getItem(SAQLASH_KALITI);
    if(xom){
      const p=JSON.parse(xom);
      if(typeof p.xp!=='number') p.xp=0;
      if(!Array.isArray(p.ochilgan)) p.ochilgan=['A1'];
      if(!p.zaif||typeof p.zaif!=='object') p.zaif={};
      if(!p.zaifGram||typeof p.zaifGram!=='object') p.zaifGram={};
      return p;
    }
  }catch(e){}
  return {streak:{joriy:0,eng_uzun:0,oxirgi_kun:null},sozlar:{},jami_takrorlash:0,xp:0,ochilgan:['A1'],zaif:{},zaifGram:{}};
}
function progressSaqlash(p){
  try{ localStorage.setItem(SAQLASH_KALITI, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = progressYuklash();

function xpQoshish(son){
  PROGRESS.xp=(PROGRESS.xp||0)+son;
  progressSaqlash(PROGRESS);
  xpKorsatkichniYangilash();
}
function xpKorsatkichniYangilash(){
  const el=document.getElementById('xpYonPanel');
  if(el) el.textContent=`⭐ ${PROGRESS.xp} XP`;
  const n=document.getElementById('xpNav'); if(n) n.textContent=`⭐ ${PROGRESS.xp} XP`;
}
function darajaOchiqmi(d){ return PROGRESS.ochilgan.includes(d); }
function darajaniOchish(d){
  if(d && !PROGRESS.ochilgan.includes(d)){
    PROGRESS.ochilgan.push(d);
    progressSaqlash(PROGRESS);
    return true;
  }
  return false;
}
function keyingiDaraja(d){
  const idx=DARAJA_TARTIBI.indexOf(d);
  return idx>=0 && idx<DARAJA_TARTIBI.length-1 ? DARAJA_TARTIBI[idx+1] : null;
}

function streakYangilash(){
  const bugun = bugunSana();
  const s = PROGRESS.streak;
  if(s.oxirgi_kun===bugun) return; // bugun allaqachon hisoblangan
  const kecha = new Date(Date.now()-86400000);
  const kechaSana = `${kecha.getFullYear()}-${String(kecha.getMonth()+1).padStart(2,'0')}-${String(kecha.getDate()).padStart(2,'0')}`;
  if(s.oxirgi_kun===kechaSana){ s.joriy+=1; }
  else{ s.joriy=1; }
  if(s.joriy>s.eng_uzun) s.eng_uzun=s.joriy;
  s.oxirgi_kun=bugun;
  progressSaqlash(PROGRESS);
}

function sozKaliti(daraja,en){ return daraja+'::'+en; }
function sozHolati(daraja,en){
  const k=sozKaliti(daraja,en);
  return PROGRESS.sozlar[k] || {level:0, keyingi:0};
}
function sozYangilash(daraja,en,togri){
  const k=sozKaliti(daraja,en);
  let h = PROGRESS.sozlar[k] || {level:0, keyingi:0};
  if(togri){ h.level = Math.min(h.level+1, 5); }
  else{ h.level = 0; }
  const kunlar = SRS_OYLIQ_KUN[h.level];
  h.keyingi = Date.now() + kunlar*86400000;
  PROGRESS.sozlar[k]=h;
  PROGRESS.jami_takrorlash = (PROGRESS.jami_takrorlash||0)+1;
  progressSaqlash(PROGRESS);
}
function sozlarDueRoyxati(daraja){
  const pool = SOZLAR_DB[daraja];
  const hozir = Date.now();
  const due=[]; const yangi=[];
  pool.forEach(([en,uz])=>{
    const k=sozKaliti(daraja,en);
    const h = PROGRESS.sozlar[k];
    if(!h) yangi.push([en,uz]);
    else if(h.keyingi<=hozir) due.push([en,uz]);
  });
  return {due:aralashtir(due), yangi:aralashtir(yangi)};
}

function aralashtir(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function bolimBelgila(mod){

function modulAlmashtir(mod){

  else if(mod==='antonim') antonimKo_rsatish();
  else if(mod==='suhbat') suhbatKo_rsatish();
  else if(mod==='chat') chatKo_rsatish();
  else if(mod==='taraqqiyot') taraqqiyotKo_rsatish();
  else if(mod==='oyinlar') oyinlarKo_rsatish();
}

    </div>
    ${(()=>{const zs=Object.keys(PROGRESS.zaif||{}).length,zg=Object.keys(PROGRESS.zaifGram||{}).length;return (zs||zg)?`<div class="srs-banner"><div><strong>♻️ Takrorlash kerak</strong><div style="font-size:12.5px;color:var(--kulrang);margin-top:4px;">${zs} ta so'z · ${zg} ta grammatika mavzusi</div></div><button class="test-keyingi" style="margin:0;" onclick="testRejim='xato';modulAlmashtir('test')">Boshlash</button></div>`:'';})()}

        const jami = SOZLAR_DB[d].length;

        return `<div class="daraja-progress-qator">
          <div class="daraja-progress-bosh"><span>${DARAJA_NOMLARI[d]}</span><span class="daraja-progress-son">${mustahkamD}/${jami} (${foiz}%)</span></div>

function progressTozalash(){
  if(!confirm("Rostdan ham barcha taraqqiyotni o'chirmoqchimisiz? Bu qaytarib bo'lmaydi.")) return;

/* ── ANTONIM SAVOLLARI (test rejimi) ── */
function antSavolOne(d,[w,a,uz,ex]){
  const hamma=Object.keys(ANTONIMLAR).flatMap(k=>ANTONIMLAR[k].map(x=>[k,...x]));
  const chal=[];
  const yaqin={frugal:['stingy','generous']};
  aralashtir(hamma).forEach(([xd,xw,xa,xuz])=>{
    if(chal.length>=3) return;
    if(xw===w||xa===a||xw===a||xa===w||chal.includes(xa)) return;
    if((yaqin[w]||[]).includes(xa)) return;
    if(uzOxshash(xuz,uz)) return;
    chal.push(xa);
  });
  const variantlar=aralashtir([a,...chal]);
  const hl=ex.replace(new RegExp('\\b'+w+'\\b','i'),m=>`<span style="color:var(--sariq);font-weight:800;">${m}</span>`);
  return {savol:`'${w}' (${uz}) so'zining antonimi qaysi?<br><span style="color:var(--osmon);font-weight:500;">${hl}</span>`,variantlar,togri:variantlar.indexOf(a),izoh:`🇬🇧 ${w} ↔ ${a} — ${uz}<br>${ex}`,teg:{tur:'antonim',daraja:d,en:w}};
}
function antonimSavollari(daraja,son){
  const hamma=Object.keys(ANTONIMLAR).flatMap(d=>ANTONIMLAR[d].map(x=>[d,...x]));
  const pool=ANTONIMLAR[daraja]&&ANTONIMLAR[daraja].length?hamma.filter(x=>x[0]===daraja):hamma;
  return aralashtir(pool).slice(0,son).map(([d,...e])=>antSavolOne(d,e));
}
/* ── OMONIM SAVOLLARI (test rejimi) ── */
function omSavolOne(d,[w,senses]){
  const hamma=Object.values(OMONIMLAR).flat();

  const k=Math.random()<0.5?0:1;
  const [togriUz,gap]=senses[k];
  const boshqaUz=senses[1-k][0];
  const chal=[boshqaUz];
  aralashtir(sensalar).forEach(x=>{
    if(chal.length>=3) return;
    if(x.w===w||chal.includes(x.uz)) return;
    if(uzOxshash(x.uz,togriUz)||uzOxshash(x.uz,boshqaUz)) return;
    chal.push(x.uz);
  });
  const variantlar=aralashtir([togriUz,...chal]);
  const highlight=gap.replace(new RegExp('\\b'+w+'\\b','i'),m=>`<span style="color:var(--sariq);font-weight:800;">${m}</span>`);
  return {savol:`Gapdagi "${w}" qaysi ma'noda ishlatilgan?<br><span style="color:var(--osmon);font-weight:500;">${highlight}</span>`,variantlar,togri:variantlar.indexOf(togriUz),izoh:`🇬🇧 ${gap}<br>🇺🇿 ${w} — ${togriUz}`,teg:{tur:'omonim',daraja:d,en:w}};
}
function omonimSavollari(daraja,son){
  const hamma=Object.keys(OMONIMLAR).flatMap(d=>OMONIMLAR[d].map(x=>[d,x]));

function sinonimSavollari(daraja,son){

function grammatikaToglash(i){grammatikaOchiq=grammatikaOchiq===i?-1:i;grammatikaKo_rsatish();}
function grammatikaMashqJavob(unitIdx,qi,oi){
  const g=GRAMMATIKA_20[unitIdx];
  const kalit=g.raqam+'_'+qi;
  if(grammatikaMashqJavoblandi[kalit]) return;
  grammatikaMashqJavoblandi[kalit]=true;
  const m=g.mashqlar[qi];
  const togri=oi===m.togri;
  if(togri) xpQoshish(4);
  for(let k=0;k<m.variantlar.length;k++){
    const btn=document.getElementById('gm_'+g.raqam+'_'+qi+'_'+k);
    if(!btn) continue;

/* ── ZAIF SO'Z VA MAVZULAR: xato qilinganlar ko'proq qaytadi ── */
function zaifTayyorla(){ if(!PROGRESS.zaif) PROGRESS.zaif={}; if(!PROGRESS.zaifGram) PROGRESS.zaifGram={}; }
function zaifBelgila(tur,kalit,togri){
  zaifTayyorla();
  const m=tur==='soz'?PROGRESS.zaif:PROGRESS.zaifGram;
  if(togri){ if(m[kalit]){ m[kalit]-=1; if(m[kalit]<=0) delete m[kalit]; } }
  else m[kalit]=Math.min((m[kalit]||0)+1,5);

}
function uzTokenlar(s){return String(s).toLowerCase().replace(/\(.*?\)/g,' ').split(/[\s\/,;]+/).map(x=>x.trim()).filter(x=>x.length>2);}
function uzOxshash(a,b){const A=uzTokenlar(a),B=uzTokenlar(b);return A.some(x=>B.includes(x));}
function sozTanlash(daraja,son){
  const pool=SOZLAR_DB[daraja]||[];const hozir=Date.now();
  const zaif=[],due=[],qolgan=[];
  pool.forEach(w=>{
    const k=sozKaliti(daraja,w[0]);
    if(PROGRESS.zaif&&PROGRESS.zaif[k]) zaif.push(w);
    else{const h=PROGRESS.sozlar[k]; if(h&&h.keyingi<=hozir&&h.level<5) due.push(w); else qolgan.push(w);}
  });
  const ustuvor=[...aralashtir(zaif),...aralashtir(due)].slice(0,Math.ceil(son/2));
  const ishlatilgan=new Set(ustuvor.map(w=>w[0]));
  const yangi=aralashtir(qolgan).filter(w=>!ishlatilgan.has(w[0])).slice(0,Math.max(0,son-ustuvor.length));
  return aralashtir([...ustuvor,...yangi]).slice(0,son);
}
function ochiqSozlar(son){
  const ochiq=DARAJA_TARTIBI.filter(darajaOchiqmi);
  const har=Math.ceil(son/ochiq.length)+2;
  let r=[];ochiq.forEach(d=>sozTanlash(d,har).forEach(w=>r.push([w[0],w[1],d])));
  return aralashtir(r).slice(0,son);
}
function chalgitgichlar(pool,w,kalit){
  const korilgan=new Set([w[kalit]]);
  return aralashtir(pool.filter(x=>x[0]!==w[0]&&!uzOxshash(x[1],w[1]))).filter(x=>!korilgan.has(x[kalit])&&korilgan.add(x[kalit])).slice(0,3).map(x=>x[kalit]);
}

function sozSavollari(daraja,son){
  const pool=SOZLAR_DB[daraja];
  return sozTanlash(daraja,son).map(w=>{
    const [en,uz]=w;
    const variantlar=aralashtir([uz,...chalgitgichlar(pool,w,1)]);
    return {savol:`'${en}' so'zining o'zbekcha ma'nosi qaysi?`,variantlar,togri:variantlar.indexOf(uz),izoh:'',teg:{tur:'soz',daraja,en}};
  });
}
function teskariSavollari(daraja,son){
  const pool=SOZLAR_DB[daraja];
  return sozTanlash(daraja,son).map(w=>{
    const [en,uz]=w;
    const variantlar=aralashtir([en,...chalgitgichlar(pool,w,0)]);
    return {savol:`"${uz}" — inglizchasi qaysi?`,variantlar,togri:variantlar.indexOf(en),izoh:'',teg:{tur:'soz',daraja,en}};
  });
}
function tinglaSavollari(daraja,son){

    return {savol:`Eshiting va ma'nosini toping:${ovoz}${ovozBor?'':`<div style="text-align:center;font-weight:700;">${en}</div>`}`,variantlar,togri:variantlar.indexOf(uz),izoh:`🇬🇧 ${en} — ${uz}`,avto:en,teg:{tur:'soz',daraja,en}};
  });
}

function clozeSavollari(daraja,son){

  return royxat.slice().sort((a,b)=>baho(a)-baho(b)).slice(0,son).map(([gap,togri,notogri,kalit,uz])=>{
    const variantlar=aralashtir([togri,...notogri]);
    const lug=(SOZLAR_DB[daraja]||[]).find(w=>w[0]===kalit);
    const korinish=gap.replace('___','<span style="color:var(--sariq);font-weight:800;">______</span>');
    return {savol:`Gapga mos so'zni tanlang:<br><span style="color:var(--osmon);font-weight:500;">${korinish}</span>`,variantlar,togri:variantlar.indexOf(togri),izoh:`🇬🇧 ${gap.replace('___','<strong>'+togri+'</strong>')}<br>🇺🇿 ${uz}${lug?`<br>🔤 ${kalit} — ${lug[1]}`:''}`,teg:{tur:'soz',daraja,en:kalit,kont:true}};
  });
}
function boshliqSavollari(daraja,son){

function zamonSavollari(daraja,son){

function gramMashqlari(daraja,birliklar){
  const r=[];
  GRAMMATIKA_20.forEach((g,gi)=>{
    if(!g.tayyor) return;
    if(daraja&&g.daraja!==daraja) return;
    if(birliklar&&!birliklar.includes(g.raqam)) return;

function gramSavolYasash(x){
  const {g,m,qi}=x;
  const togriMatn=m.variantlar[m.togri];
  const variantlar=aralashtir(m.variantlar.slice());
  const korinish=m.savol.replace('___','<span style="color:var(--sariq);font-weight:800;">______</span>');
  const savol=m.savol.includes('___')?`Bo'shliqni to'ldiring:<br><span style="color:var(--osmon);font-weight:500;">${korinish}</span>`:`<span style="color:var(--osmon);font-weight:500;">${m.savol}</span>`;
  return {savol,variantlar,togri:variantlar.indexOf(togriMatn),izoh:m.izoh,teg:{tur:'gram',raqam:g.raqam,qi}};
}
function gramSavollari(daraja,son){return aralashtir(gramMashqlari(daraja)).slice(0,son).map(gramSavolYasash);}
function xatoYangiSavol(k){
  const [p,d,en]=k.split('::');
  if(p==='sin'){const e=(SINONIMLAR[d]||[]).find(x=>x[0]===en);return e?sinSavolOne(d,e):null;}
  if(p==='ant'){const e=(ANTONIMLAR[d]||[]).find(x=>x[0]===en);return e?antSavolOne(d,e):null;}
  if(p==='om'){const e=(OMONIMLAR[d]||[]).find(x=>x[0]===en);return e?omSavolOne(d,e):null;}
  return null;
}
function xatoSavollari(){
  zaifTayyorla();
  const yangiKalit=k=>/^(sin|ant|om)::/.test(k);
  const soz=Object.keys(PROGRESS.zaif).filter(k=>!yangiKalit(k)).map(k=>{const [d,en]=k.split('::');const w=(SOZLAR_DB[d]||[]).find(x=>x[0]===en);return w?{d,w}:null;}).filter(Boolean);
  const sq=aralashtir(soz).slice(0,6).map((x,i)=>{
    const pool=SOZLAR_DB[x.d];
    if(i%2===0){const v=aralashtir([x.w[1],...chalgitgichlar(pool,x.w,1)]);return {savol:`'${x.w[0]}' so'zining o'zbekcha ma'nosi qaysi?`,variantlar:v,togri:v.indexOf(x.w[1]),izoh:'',teg:{tur:'soz',daraja:x.d,en:x.w[0]}};}
    const v=aralashtir([x.w[0],...chalgitgichlar(pool,x.w,0)]);return {savol:`"${x.w[1]}" — inglizchasi qaysi?`,variantlar:v,togri:v.indexOf(x.w[0]),izoh:'',teg:{tur:'soz',daraja:x.d,en:x.w[0]}};
  });
  const yangi=aralashtir(Object.keys(PROGRESS.zaif).filter(yangiKalit)).map(xatoYangiSavol).filter(Boolean).slice(0,4);
  const birliklar=Object.keys(PROGRESS.zaifGram).map(Number);
  const gq=birliklar.length?aralashtir(gramMashqlari(null,birliklar)).slice(0,4).map(gramSavolYasash):[];
  return aralashtir([...sq,...yangi,...gq]);
}function savolBirlashtir(...guruhlar){
  const korilgan=new Set();const r=[];
  guruhlar.flat().forEach(q=>{
    const k=q.teg&&q.teg.tur==='soz'?'soz:'+q.teg.en:q.savol;
    if(korilgan.has(k)||korilgan.has(q.savol)) return;
    korilgan.add(k);korilgan.add(q.savol);r.push(q);
  });
  return r;
}
function testGenerats(daraja,rejim){
  if(rejim==='soz') return sozSavollari(daraja,10);
  if(rejim==='sinonim') return sinonimSavollari(daraja,10);
  if(rejim==='omonim') return omonimSavollari(daraja,10);
  if(rejim==='antonim') return antonimSavollari(daraja,10);
  if(rejim==='teskari') return teskariSavollari(daraja,10);
  if(rejim==='tingla') return tinglaSavollari(daraja,8);
  if(rejim==='gapda') return clozeSavollari(daraja,10);
  if(rejim==='gram') return gramSavollari(daraja,10);
  if(rejim==='zamon') return zamonSavollari(daraja,6);
  if(rejim==='xato') return xatoSavollari();
  if(rejim==='boshliq'){
    const g=gramSavollari(daraja,99).filter(q=>q.savol.startsWith("Bo'shliqni"));
    return savolBirlashtir(aralashtir([...boshliqSavollari(daraja,99),...g])).slice(0,10);
  }
  // aralash: 5 ta so'z (2 ta en→uz, 1 ta uz→en, 2 ta gapda), 2 bo'shliq, 2 grammatika, 1 zamon
  const sozlar=savolBirlashtir(sozSavollari(daraja,2),teskariSavollari(daraja,2),clozeSavollari(daraja,4)).slice(0,5);
  const boshqa=savolBirlashtir(boshliqSavollari(daraja,2),gramSavollari(daraja,3).slice(0,2),zamonSavollari(daraja,1));
  return aralashtir(savolBirlashtir(sozlar,boshqa));
}

const SRS_KUNLIK_YANGI=10; // bir kunda nechta yangi so'z qo'shiladi

  const {due,yangi} = sozlarDueRoyxati(kartochaDaraja);

  kartochaIndeksi=0;kartochaBildim=0;kartochaAylangan=false;kartochaSessiyaSoni=kartochaRoyxat.length;
  kartochkalarKo_rsatish();
}

    document.getElementById('kontent-joy').innerHTML=`

function kartochaDarajaTanlash(d){if(!darajaOchiqmi(d)){darajaQulfXabari(d);return;}kartochaDaraja=d;kartochaYangiBoshlash();}

function kartochaBildimni(){
  const [en]=kartochaRoyxat[kartochaIndeksi];
  sozYangilash(kartochaDaraja,en,true);
  kartochaBildim++;kartochaIndeksi++;kartochaAylangan=false;kartochkalarKo_rsatish();
}
function kartochaBilmadim(){
  const [en]=kartochaRoyxat[kartochaIndeksi];
  sozYangilash(kartochaDaraja,en,false);
  kartochaIndeksi++;kartochaAylangan=false;kartochkalarKo_rsatish();
}

function suhbatKo_rsatish(){
  let chatQism='';
  if(joriyMavzu!==null){
    const sc=STSENARIYLAR[joriyMavzu];
    let xabarlar=suhbatTarixi.length===0?`<div style="text-align:center;color:var(--kulrang);padding:30px;font-size:13px;">Suhbat boshlanmoqda...</div>`:
      suhbatTarixi.map(m=>`<div class="xabar ${m.rol==='user'?'foydalanuvchi':''}">${m.rol==='assistant'?`<div class="xabar-avatar">🎭</div>`:''}<div class="xabar-matn">${m.matn.replace(/\n/g,'<br/>')}</div></div>`).join('');
    if(suhbatYuklanyapti) xabarlar+=`<div class="xabar"><div class="xabar-avatar">🎭</div><div class="xabar-matn"><div class="yozmoqda"><span class="nuqta"></span><span class="nuqta"></span><span class="nuqta"></span></div></div></div>`;
    chatQism=`<div style="border:1px solid var(--chegara);border-radius:var(--radius);padding:16px;margin-top:4px;">
        <div style="font-size:13px;font-weight:600;color:var(--osmon);margin-bottom:12px;">${sc.icon} ${sc.nomi}</div>
        <div class="chat-qobiq" style="height:320px;">
          <div class="chat-xabarlar" id="suhbatXabarlar">${xabarlar}</div>
          <div class="yozish-qatori">
            <textarea class="matn-kiritish" id="suhbatKiritish" rows="2" placeholder="Inglizcha yozing..."></textarea>
            <button class="yuborish-tugma" onclick="suhbatYuborish()" ${suhbatYuklanyapti?'disabled':''}>Yuborish</button>
          </div>
        </div></div>`;
  }
  document.getElementById('kontent-joy').innerHTML=`
    <div class="sahifa-sarlavha"><h2>Suhbat Amaliyoti</h2><p>Real hayot vaziyatlarida inglizcha suhbat — ustoz xatolaringizni o'zbek tilida tuzatadi</p></div>
    <div class="stsenariy-grid">
      ${STSENARIYLAR.map((s,i)=>`<div class="stsenariy-karta ${joriyMavzu===i?'faol':''}" onclick="stsenariyBoshlash(${i})"><div class="stsenariy-icon">${s.icon}</div><div class="stsenariy-nomi">${s.nomi}</div><div class="stsenariy-uz">${s.ingliz}</div></div>`).join('')}
    </div>${chatQism}`;
  if(joriyMavzu!==null){
    setTimeout(()=>{const el=document.getElementById('suhbatXabarlar');if(el)el.scrollTop=el.scrollHeight;},60);
    const ki=document.getElementById('suhbatKiritish');
    if(ki) ki.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();suhbatYuborish();}});
  }
}
function stsenariyBoshlash(i){
  joriyMavzu=i;suhbatTarixi=[];suhbatYuklanyapti=true;
  const sc=STSENARIYLAR[i];
  suhbatKo_rsatish();
  aiSuhbatSorash([
    {role:'user',content:`Siz ingliz tili o'qituvchisisiz. "${sc.nomi}" vaziyatida talaba bilan inglizcha suhbat o'tkazing. Har javobdan so'ng xatolarni O'ZBEK tilida tuzating va tarjima bering. Hozir: ${sc.nomi} vaziyatida suhbat boshlang.`}
  ]).then(matn=>{suhbatTarixi.push({rol:'assistant',matn});})
    .catch(()=>{suhbatTarixi.push({rol:'assistant',matn:"AI hozircha mavjud emas. Iltimos qaytadan urinib ko'ring."});})
    .finally(()=>{suhbatYuklanyapti=false;suhbatKo_rsatish();});
}
async function suhbatYuborish(){
  const ki=document.getElementById('suhbatKiritish');const matn=ki?.value?.trim();
  if(!matn||suhbatYuklanyapti) return;
  ki.value='';suhbatTarixi.push({rol:'user',matn});suhbatYuklanyapti=true;suhbatKo_rsatish();
  try{
    const tizim=`Siz ingliz tili o'qituvchisisiz. "${STSENARIYLAR[joriyMavzu]?.nomi}" vaziyatida suhbat davom ettiring. Xatolarni O'ZBEK tilida tuzating.`;
    const msgs=[{role:'user',content:tizim},{role:'assistant',content:"Tushunarli, boshlaymiz."},...suhbatTarixi.map(m=>({role:m.rol==='user'?'user':'assistant',content:m.matn}))];
    const javob = await aiSuhbatSorash(msgs);
    suhbatTarixi.push({rol:'assistant',matn:javob});
  }catch{suhbatTarixi.push({rol:'assistant',matn:'AI hozircha mavjud emas.'});}
  suhbatYuklanyapti=false;suhbatKo_rsatish();
}

/* ── AI ULANISH: "sample" capability orqali — API kalit kerak emas ── */
function aiXabarlarniTozala(msgs){
  const out=[];
  for(const m of msgs){const last=out[out.length-1];if(last&&last.role===m.role)last.content+="\n\n"+m.content;else out.push({role:m.role,content:m.content});}
  if(out.length&&out[0].role!=="user")out.unshift({role:"user",content:"Boshlaymiz."});
  return out;
}
const BACKEND_URL = "https://uzlearn-backend.SIZNING-NOMINGIZ.workers.dev";
async function aiSuhbatSorash(msgs){
  if(BACKEND_URL.includes("SIZNING-NOMINGIZ")) throw new Error("Backend sozlanmagan");
  let tizim="";
  if(msgs.length>=2&&msgs[0].role==="user"&&msgs[1].role==="assistant"&&(msgs[1].content==="Tushundim, tayyorman."||msgs[1].content==="Tushunarli, boshlaymiz.")){tizim=msgs[0].content;msgs=msgs.slice(2);}
  msgs=aiXabarlarniTozala(msgs);
  const res=await fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs,systemPrompt:tizim})});
  if(!res.ok){const x=await res.json().catch(()=>({}));throw new Error(x.error||"Server xatosi");}
  const d=await res.json();return d.text||"Javob olinmadi.";
}

/* ── AI USTOZ (kichik, qo'shimcha modul) ── */
function chatKo_rsatish(){
  let xabarlar=chatTarixi.length===0?`<div style="text-align:center;color:var(--kulrang);padding:40px 20px;"><div style="font-size:36px;margin-bottom:12px;">🎓</div><div style="font-size:14px;">Savolingizni bering — ustoz o'zbek tilida javob beradi</div></div>`:
    chatTarixi.map(m=>`<div class="xabar ${m.rol==='user'?'foydalanuvchi':''}">${m.rol==='assistant'?`<div class="xabar-avatar">🎓</div>`:''}<div class="xabar-matn">${m.matn.replace(/\n/g,'<br/>')}</div></div>`).join('');
  if(chatYuklanyapti) xabarlar+=`<div class="xabar"><div class="xabar-avatar">🎓</div><div class="xabar-matn"><div class="yozmoqda"><span class="nuqta"></span><span class="nuqta"></span><span class="nuqta"></span></div></div></div>`;
  document.getElementById('kontent-joy').innerHTML=`
    <div class="sahifa-sarlavha"><h2>AI Ustoz</h2><p>Savolingizni yozing — ustoz o'zbek tilida tushuntirib beradi</p></div>
    <div class="chat-qobiq" style="height:calc(100vh - 340px);">
      <div class="chat-xabarlar" id="chatXabarlar">${xabarlar}</div>
      <div class="yozish-qatori">
        <textarea class="matn-kiritish" id="chatKiritish" rows="2" placeholder="Savolingizni yozing..."></textarea>
        <button class="ovoz-tugma" onclick="chatMik()" title="Gapirib yozing">🎙️</button>
        <button class="yuborish-tugma" onclick="chatYuborish()" ${chatYuklanyapti?'disabled':''}>Yuborish</button>
      </div>
    </div>`;
  setTimeout(()=>{const el=document.getElementById('chatXabarlar');if(el)el.scrollTop=el.scrollHeight;},60);
  const ki=document.getElementById('chatKiritish');
  if(ki) ki.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatYuborish();}});
}
function chatMik(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){alert("Brauzeringiz ovozli kiritishni qo'llamaydi (Chrome'da sinab ko'ring).");return;}
  let r;try{r=new R();}catch(e){return;}
  r.lang='en-US';r.interimResults=false;
  r.onresult=e=>{const ki=document.getElementById('chatKiritish');if(ki)ki.value=e.results[0][0].transcript;};
  try{r.start();}catch(e){}
}
async function chatYuborish(){
  const ki=document.getElementById('chatKiritish');const matn=ki?.value?.trim();
  if(!matn||chatYuklanyapti) return;
  ki.value='';chatTarixi.push({rol:'user',matn});chatYuklanyapti=true;chatKo_rsatish();
  try{
    const msgs=[{role:'user',content:TIZIM_PROMTI},{role:'assistant',content:"Tushundim, tayyorman."},...chatTarixi.map(m=>({role:m.rol==='user'?'user':'assistant',content:m.matn}))];
    const javob = await aiSuhbatSorash(msgs);
    chatTarixi.push({rol:'assistant',matn:javob});
  }catch{chatTarixi.push({rol:'assistant',matn:"AI hozircha mavjud emas (ruxsat berilmagan bo'lishi mumkin)."});}
  chatYuklanyapti=false;chatKo_rsatish();
}

/* 1) Suhbat o'yini */
function dialogTanlash(){
  document.getElementById('kontent-joy').innerHTML=`<div class="sahifa-sarlavha"><div class="qator"><h2>💬 Suhbat o'yini</h2><button class="reset-tugma" onclick="oyinlarKo_rsatish()">← Menyu</button></div><p>Vaziyatni tanlang va suhbatda to'g'ri javobni toping.</p></div><div class="stsenariy-grid">${DIALOGLAR.map((d,i)=>`<div class="stsenariy-karta" onclick="dialogBoshlash(${i})"><div class="stsenariy-icon">${d.icon}</div><div class="stsenariy-nomi">${d.nomi}</div><div class="stsenariy-uz">${d.qadamlar.length} qadam</div></div>`).join('')}</div>`;
}
function dialogBoshlash(si){O={tur:'dialog',si,i:0,togri:0,xp:0,jami:DIALOGLAR[si].qadamlar.length};dialogQadam();}
function dialogQadam(){

}
function dialogJavob(k){

/* 2) Gap tuzish */
function gapRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz]=O.royxat[O.i];O.en=en;O.uz=uz;O.sozlar=en.split(' ');
  let b=aralashtir(O.sozlar.map((s,k)=>k));
  for(let t=0;t<5&&O.sozlar.length>2&&b.every((v,k)=>v===k);t++)b=aralashtir(b);
  O.bank=b;O.tanlangan=[];O.javoblandi=false;O.natija=null;gapChiz();
}
function gapChiz(){
  const tolgan=O.tanlangan.length===O.sozlar.length;
  const qolgan=O.bank.filter(k=>!O.tanlangan.includes(k));
  let pastki='';
  if(O.javoblandi){pastki=`<div class="test-fikr ${O.natija?'yaxshi':'yomon'}">${O.natija?"✅ To'g'ri! +5 XP":"❌ To'g'ri gap:"} <strong>${O.en}</strong></div>${oyinMavzuHTML(IBORA_MAVZU[O.en])}<button class="test-keyingi" onclick="O.i++;gapRaund()">Keyingisi →</button>`;}
  else pastki=`<button class="test-keyingi" ${tolgan?'':'disabled style="opacity:.4;"'} onclick="gapTekshir()">Tekshirish</button>`;

}
function gapQosh(k){if(O.javoblandi)return;O.tanlangan.push(k);gapChiz();}
function gapOlib(p){if(O.javoblandi)return;O.tanlangan.splice(p,1);gapChiz();}
function gapTekshir(){
  if(O.javoblandi||O.tanlangan.length!==O.sozlar.length)return;
  O.natija=O.tanlangan.map(k=>O.sozlar[k]).join(' ')===O.en;O.javoblandi=true;
  if(O.natija){O.togri++;O.xp+=5;xpQoshish(5);oyinOvoz(O.en);}
  gapChiz();
}
/* 3) Tinglab top */
function tingRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz]=O.royxat[O.i];
  const notogri=aralashtir(IBORALAR.filter(p=>p[1]!==uz)).slice(0,3).map(p=>p[1]);
  O.en=en;O.uz=uz;O.vs=aralashtir([uz,...notogri]);O.javoblandi=false;tingChiz();

}
function tingChiz(){

}
function tingJavob(k){
  if(O.javoblandi)return;O.javoblandi=true;
  const ok=O.vs[k]===O.uz;oyinJavobTugmalari('tv_',O.vs.length,O.vs.indexOf(O.uz),k);

  document.getElementById('oyinIzoh').innerHTML=`<div class="test-fikr ${ok?'yaxshi':'yomon'}">${ok?"✅ To'g'ri! +5 XP":"❌ Noto'g'ri."} 🇬🇧 <strong>${O.en}</strong> — ${O.uz}</div>${oyinMavzuHTML(IBORA_MAVZU[O.en])}<button class="test-keyingi" onclick="O.i++;tingRaund()">Keyingisi →</button>`;
}
/* 4) Gapirib ko'r */
function gapirRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz]=O.royxat[O.i];O.en=en;O.uz=uz;O.javoblandi=false;O.holat='';O.eshitildi='';O.foiz=null;gapirChiz();
}
function gapirChiz(){
  let pastki='';
  if(O.javoblandi){
    const matn=O.foiz===null?`✅ Yaxshi! (o'zingiz belgilagansiz) +2 XP`:(O.foiz>=70?`✅ Ajoyib! ${O.foiz}% mos keldi. +5 XP`:`❌ ${O.foiz}% mos keldi. Yana urinib ko'ring yoki keyingisiga o'ting.`);
    pastki=`<div class="test-fikr ${O.foiz===null||O.foiz>=70?'yaxshi':'yomon'}">${matn}${O.eshitildi?`<div style="font-size:12.5px;font-weight:400;margin-top:6px;">Siz aytdingiz: "${O.eshitildi}"</div>`:''}</div>${oyinMavzuHTML(IBORA_MAVZU[O.en])}<button class="test-keyingi" onclick="O.i++;gapirRaund()">Keyingisi →</button>`;
    if(O.foiz!==null&&O.foiz<70)pastki+=` <button class="reset-tugma" onclick="O.javoblandi=false;O.holat='';gapirChiz()">🔁 Qayta urinish</button>`;
  } else if(O.holat==='tinglanyapti'){pastki=`<div class="test-fikr yaxshi">🎙️ Eshitilmoqda... ayting!</div>`;}
  else {
    const xabar=O.holat==='qollamaydi'?"Brauzeringiz ovozni tanishni qo'llamaydi (Chrome'da sinab ko'ring).":O.holat==='xato'?"Mikrofon ishlamadi yoki ruxsat berilmadi.":O.holat==='jim'?"Hech narsa eshitilmadi, qayta urining.":'';
    pastki=`${xabar?`<div class="test-fikr yomon" style="margin-bottom:12px;">${xabar}</div>`:''}<button class="test-keyingi" onclick="mikBoshla()">🎙️ Gapirish</button> <button class="reset-tugma" onclick="gapirMenAyttim()">✋ Aytdim</button>`;
  }
  document.getElementById('kontent-joy').innerHTML=oyinSarlavha('🎙️ Gapirib ko\'r',O.i,O.jami)+`<div class="test-karta" style="text-align:center;"><div style="font-size:12.5px;color:var(--kulrang);margin-bottom:8px;">Ovoz chiqarib ayting:</div><div style="font-size:24px;font-weight:700;margin-bottom:6px;">🇬🇧 ${O.en}</div><div style="color:var(--osmon);font-size:14px;margin-bottom:16px;">🇺🇿 ${O.uz}</div><button class="reset-tugma" onclick="oyinOvoz(O.en)" style="margin-bottom:16px;">🔊 Namunani tinglash</button><div>${pastki}</div></div>`;
}
function mikBoshla(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){O.holat='qollamaydi';gapirChiz();return;}
  let r;try{r=new R();}catch(e){O.holat='qollamaydi';gapirChiz();return;}
  r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;O.holat='tinglanyapti';gapirChiz();
  r.onresult=e=>{gapirBaho(e.results[0][0].transcript);};
  r.onerror=()=>{if(O.holat==='tinglanyapti'){O.holat='xato';gapirChiz();}};
  r.onend=()=>{if(O.holat==='tinglanyapti'){O.holat='jim';gapirChiz();}};
  try{r.start();}catch(e){O.holat='xato';gapirChiz();}
}
function sozlarTozala(s){return s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);}
function gapirBaho(t){
  const h=sozlarTozala(O.en),a=sozlarTozala(t);
  O.foiz=Math.round(h.filter(w=>a.includes(w)).length/h.length*100);O.eshitildi=t;O.holat='';O.javoblandi=true;
  if(O.foiz>=70){O.togri++;O.xp+=5;xpQoshish(5);}
  gapirChiz();
}
function gapirMenAyttim(){if(O.javoblandi)return;O.javoblandi=true;O.foiz=null;O.togri++;O.xp+=2;xpQoshish(2);gapirChiz();}

/* 5) Juftlikni top — so'z va tarjimasini juftlang */
function juftBoshlash(){O={tur:'juftlik',i:0,togri:0,xp:0,jami:3};juftRaund();}
function juftRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const tanlangan=[];
  ochiqSozlar(24).forEach(w=>{
    if(tanlangan.length>=6) return;
    if(tanlangan.some(x=>x[0]===w[0]||uzOxshash(x[1],w[1]))) return;
    tanlangan.push(w);
  });
  O.sozlar=tanlangan;O.n=tanlangan.length;
  const tiles=[];
  tanlangan.forEach((w,k)=>{tiles.push({k,yon:'en',t:w[0]});tiles.push({k,yon:'uz',t:w[1]});});
  O.tiles=aralashtir(tiles).map((t,id)=>({...t,id,topildi:false,xato:false}));
  O.tanl=null;O.topilgan=0;O.xato=0;O.qulf=false;O.tugadi=false;
  juftChiz();
}
function juftChiz(){
  const katak=O.tiles.map(t=>`<button class="test-variant juft-katak ${t.topildi?'togri':''} ${t.xato?'noto-gri':''} ${O.tanl===t.id?'tanlangan-katak':''}" style="text-align:center;min-height:58px;${t.yon==='en'?'font-weight:700;':''}" ${t.topildi?'disabled':''} onclick="juftBos(${t.id})">${t.t}</button>`).join('');
  const past=O.tugadi?`<div class="test-fikr yaxshi">✅ Raund tugadi! Xatolar: ${O.xato}</div><button class="test-keyingi" onclick="O.i++;juftRaund()">${O.i+1>=O.jami?'Yakunlash':'Keyingi raund'} →</button>`:`<div style="font-size:12.5px;color:var(--kulrang);margin-top:12px;">Juftlangan: ${O.topilgan}/${O.n} · Xato: ${O.xato}</div>`;
  document.getElementById('kontent-joy').innerHTML=oyinSarlavha('🧠 Juftlikni top',O.i,O.jami)+`<div class="test-karta"><div style="font-size:13px;color:var(--kulrang);margin-bottom:12px;">Inglizcha so'zni va uning o'zbekcha ma'nosini ketma-ket bosing.</div><div id="juft-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">${katak}</div>${past}</div>`;
}
function juftBos(id){
  if(O.qulf||O.tugadi) return;
  const t=O.tiles[id];if(!t||t.topildi) return;
  if(O.tanl===null){O.tanl=id;if(t.yon==='en')oyinOvoz(t.t);juftChiz();return;}
  if(O.tanl===id){O.tanl=null;juftChiz();return;}
  const a=O.tiles[O.tanl];
  if(a.yon===t.yon){O.tanl=id;juftChiz();return;}
  if(a.k===t.k){
    a.topildi=t.topildi=true;O.tanl=null;O.topilgan++;O.xp+=3;xpQoshish(3);
    const w=O.sozlar[t.k];oyinOvoz(w[0]);zaifBelgila('soz',sozKaliti(w[2],w[0]),true);
    if(O.topilgan===O.n){O.tugadi=true;O.togri++;streakYangilash();}
    juftChiz();
  }else{
    O.xato++;O.qulf=true;a.xato=t.xato=true;
    [O.sozlar[a.k],O.sozlar[t.k]].forEach(w=>zaifBelgila('soz',sozKaliti(w[2],w[0]),false));
    juftChiz();
    const raund=O.i;
    setTimeout(()=>{
      if(O.tur!=='juftlik'||O.i!==raund||!document.getElementById('juft-grid')) return;
      a.xato=t.xato=false;O.tanl=null;O.qulf=false;juftChiz();
    },700);
  }
}

/* 6) Harf terish — harflardan so'z yig'ing */
function harfBoshlash(){
  const kand=ochiqSozlar(60).filter(w=>/^[a-z]{4,9}$/.test(w[0]));
  O={tur:'harf',royxat:kand.slice(0,8),i:0,togri:0,xp:0};O.jami=O.royxat.length;
  if(!O.jami){oyinlarKo_rsatish();return;}
  harfRaund();
}
function harfRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz,d]=O.royxat[O.i];O.en=en;O.uz=uz;O.d=d;
  let b=aralashtir(en.split('').map((h,k)=>k));
  for(let t=0;t<8&&b.map(k=>en[k]).join('')===en;t++)b=aralashtir(b);
  O.bank=b;O.tanlangan=[];O.javoblandi=false;O.natija=null;O.ishora=false;harfChiz();
}
function harfChiz(){
  const tolgan=O.tanlangan.length===O.en.length;
  const qolgan=O.bank.filter(k=>!O.tanlangan.includes(k));
  let slotlar='';
  for(let p=0;p<O.en.length;p++){
    const k=O.tanlangan[p];
    slotlar+=k===undefined?`<span class="chip" style="min-width:34px;text-align:center;opacity:.35;">_</span>`:`<button class="chip" style="min-width:34px;text-align:center;font-weight:700;" onclick="harfOlib(${p})">${O.en[k]}</button>`;
  }
  const bank=qolgan.map(k=>`<button class="chip" style="min-width:42px;min-height:42px;text-align:center;font-weight:700;font-size:16px;" onclick="harfQosh(${k})">${O.en[k]}</button>`).join('');
  let past;
  if(O.javoblandi) past=`<div class="test-fikr ${O.natija?'yaxshi':'yomon'}">${O.natija?"✅ To'g'ri!"+(O.ishora?' +3 XP':' +5 XP'):"❌ To'g'ri yozilishi:"} <strong>${O.en}</strong></div><button class="test-keyingi" onclick="O.i++;harfRaund()">Keyingisi →</button>`;
  else past=`<button class="test-keyingi" ${tolgan?'':'disabled style="opacity:.4;"'} onclick="harfTekshir()">Tekshirish</button> <button class="reset-tugma" onclick="harfIshora()">💡 Ishora</button>`;
  document.getElementById('kontent-joy').innerHTML=oyinSarlavha('🔠 Harf terish',O.i,O.jami)+`<div class="test-karta"><div style="font-size:13px;color:var(--kulrang);margin-bottom:6px;">Inglizchasini yig'ing:</div><div style="font-size:20px;font-weight:700;margin-bottom:6px;">🇺🇿 ${O.uz}</div>${O.ishora?`<div style="font-size:13px;color:var(--sariq);margin-bottom:8px;">Birinchi harf: <strong>${O.en[0]}</strong> · ${O.en.length} ta harf</div>`:''}<div class="javob-joy">${slotlar}</div><div class="chip-qator">${bank}</div>${past}</div>`;
}
function harfQosh(k){if(O.javoblandi)return;O.tanlangan.push(k);harfChiz();}
function harfOlib(p){if(O.javoblandi)return;O.tanlangan.splice(p,1);harfChiz();}
function harfIshora(){if(O.javoblandi)return;O.ishora=true;oyinOvoz(O.en);harfChiz();}
function harfTekshir(){
  if(O.javoblandi||O.tanlangan.length!==O.en.length) return;
  O.natija=O.tanlangan.map(k=>O.en[k]).join('')===O.en;O.javoblandi=true;
  zaifBelgila('soz',sozKaliti(O.d,O.en),O.natija);
  if(O.natija){O.togri++;const x=O.ishora?3:5;O.xp+=x;xpQoshish(x);oyinOvoz(O.en);}
  harfChiz();
}

/* 7) Tezkor so'z — 30 soniyada to'g'ri/noto'g'ri */
function tezkorBoshlash(){
  tezkorToxtat();
  O={tur:'tezkor',pool:ochiqSozlar(80),togri:0,jami:0,xp:0,t:30,oxirgi:''};

  tezkorKarta();tezkorChiz();
  O.timer=setInterval(tezkorTik,1000);
}
function tezkorKarta(){
  const p=O.pool;const w=p[Math.floor(Math.random()*p.length)];
  let uz=w[1],togri=true;
  if(Math.random()<0.5){
    const boshqa=aralashtir(p.filter(x=>x[0]!==w[0]&&!uzOxshash(x[1],w[1])));
    if(boshqa.length){uz=boshqa[0][1];togri=false;}
  }
  O.karta={w,uz,togri};
}
function tezkorChiz(){
  const k=O.karta;
  document.getElementById('kontent-joy').innerHTML=`<div class="sahifa-sarlavha"><div class="qator"><h2>⚡ Tezkor so'z</h2><button class="reset-tugma" onclick="tezkorToxtat();oyinlarKo_rsatish()">← Menyu</button></div></div><div class="test-karta" style="text-align:center;"><div class="qator" style="justify-content:space-between;margin-bottom:14px;"><span class="belgi" id="tezkor-vaqt">⏱ ${O.t} s</span><span class="belgi">✅ ${O.togri} / ${O.jami}</span><span class="belgi">⭐ ${O.xp}</span></div><div style="font-size:30px;font-weight:800;margin:18px 0 6px;">${k.w[0]}</div><div style="font-size:20px;color:var(--osmon);margin-bottom:22px;">= ${k.uz}</div><div class="qator" style="justify-content:center;gap:14px;"><button class="test-keyingi" style="margin:0;min-width:130px;background:linear-gradient(135deg,#047857,#065f46);" onclick="tezkorJavob(true)">✅ To'g'ri</button><button class="test-keyingi" style="margin:0;min-width:130px;background:linear-gradient(135deg,#b91c1c,#7f1d1d);" onclick="tezkorJavob(false)">❌ Noto'g'ri</button></div><div style="min-height:40px;margin-top:16px;font-size:13px;color:var(--kulrang);">${O.oxirgi}</div></div>`;
}
function tezkorJavob(b){
  if(O.tur!=='tezkor'||O.t<=0) return;
  const k=O.karta;const ok=b===k.togri;O.jami++;
  if(ok){O.togri++;O.xp+=2;xpQoshish(2);O.oxirgi=`✅ To'g'ri`;}
  else{O.oxirgi=`❌ To'g'risi: <strong>${k.w[0]}</strong> = ${k.w[1]}`;zaifBelgila('soz',sozKaliti(k.w[2],k.w[0]),false);}
  tezkorKarta();tezkorChiz();
}
function tezkorTik(){
  const el=document.getElementById('tezkor-vaqt');
  if(!el||!O||O.tur!=='tezkor'){tezkorToxtat();return;}
  O.t--;el.textContent=`⏱ ${Math.max(O.t,0)} s`;
  if(O.t<=0){tezkorToxtat();oyinTugadi();}
}
function tezkorToxtat(){if(O&&O.timer){clearInterval(O.timer);O.timer=null;}}

  const asl=window[fn]; if(typeof asl!=='function') return;

modulAlmashtir('sozlik');
document.getElementById('streakYonPanel').textContent = `🔥 ${PROGRESS.streak.joriy} kunlik seriya`;
xpKorsatkichniYangilash();
