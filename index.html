<style>
:root{--asosiy:#0b1730;--asosiy2:#12244a;--ko-k:#8f1d2c;--ko-k2:#8f1d2c;--osmon:#8f1d2c;--oq:#f5efe6;--kulrang:#b9c0d0;--chegara:#2a4378;--karta:#12244a;--yashil:#d9b382;--qizil:#d9535f;--sariq:#d9b382;--radius:14px;box-sizing:border-box;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--asosiy);color:var(--oq);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;font-family:'Inter',sans-serif;border:none;outline:none;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--chegara);background:#0b1730ee;backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:10px;}
.nav-logo{width:40px;height:40px;border-radius:11px;background:#8f1d2c;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 1px 2px rgba(0,0,0,.35);}
.nav-nomi{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;}
.nav-tagline{font-size:11px;color:var(--kulrang);margin-top:1px;}
.nav-bayroq{font-size:22px;display:flex;align-items:center;gap:6px;}
.nav-bayroq span{font-size:13px;color:var(--kulrang);}
.asosiy-joy{display:flex;flex:1;min-height:calc(100vh - 73px);}
.yon-panel{width:245px;flex-shrink:0;border-right:1px solid var(--chegara);padding:22px 14px;background:#0b1730;display:flex;flex-direction:column;gap:4px;}
.yon-sarlavha{font-size:10px;letter-spacing:2.5px;color:var(--kulrang);font-weight:600;margin:8px 0 10px 10px;}
.modul-tugma{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;border:1px solid transparent;background:none;color:#d9b382;font-size:13.5px;font-weight:500;transition:all .18s;width:100%;text-align:left;}
.modul-tugma:hover{background:var(--karta);color:var(--oq);border-color:var(--chegara);}
.modul-tugma.faol{background:#8f1d2c;border-color:#d9b382;color:var(--oq);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.modul-icon{font-size:17px;width:24px;text-align:center;}
.modul-nomi{font-size:13.5px;font-weight:600;}
.modul-tavsif{font-size:10.5px;color:var(--kulrang);margin-top:1px;}
.yon-ajratgich{height:1px;background:var(--chegara);margin:10px 0;}
.kichik-modul{opacity:.75;}
.kichik-modul .modul-icon{font-size:14px;}
.kichik-modul .modul-nomi{font-size:12px;}
.kontent{flex:1;padding:30px 34px;overflow-y:auto;max-height:calc(100vh - 73px);}
.sahifa-sarlavha{margin-bottom:22px;}
.sahifa-sarlavha h2{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
.sahifa-sarlavha p{color:var(--kulrang);margin-top:6px;font-size:13.5px;line-height:1.6;}
.qator{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.belgi{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;background:#2a4378;border:1px solid var(--chegara);color:#d9b382;}
.jonli-belgi{background:#2c2418;border:1px solid var(--yashil);color:var(--yashil);font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:5px;}
.jonli-dot{width:7px;height:7px;border-radius:50%;background:var(--yashil);animation:yilt 2s infinite;display:inline-block;}
@keyframes yilt{0%,100%{opacity:1}50%{opacity:.3}}
.daraja-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.daraja-tugma{padding:7px 15px;border-radius:20px;border:1px solid var(--chegara);background:var(--asosiy2);color:var(--kulrang);font-size:12.5px;font-weight:600;transition:all .18s;}
.daraja-tugma.tanlangan{background:#8f1d2c;border-color:#d9b382;color:var(--oq);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.chat-qobiq{display:flex;flex-direction:column;height:calc(100vh - 310px);min-height:380px;}
.chat-xabarlar{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding-right:4px;padding-bottom:8px;}
.xabar{display:flex;align-items:flex-start;gap:9px;}
.xabar.foydalanuvchi{flex-direction:row-reverse;}
.xabar-avatar{width:34px;height:34px;border-radius:50%;background:#8f1d2c;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.35);}
.xabar-matn{max-width:72%;padding:12px 16px;font-size:13.5px;line-height:1.8;border:1px solid var(--chegara);background:var(--karta);border-radius:4px 14px 14px 14px;}
.xabar.foydalanuvchi .xabar-matn{background:#8f1d2c;border-color:#d9b382;border-radius:14px 4px 14px 14px;}
.yozish-qatori{display:flex;gap:10px;margin-top:14px;}
.matn-kiritish{flex:1;background:var(--karta);border:1px solid var(--chegara);border-radius:12px;padding:12px 16px;color:var(--oq);font-size:14px;font-family:'Inter',sans-serif;resize:none;outline:none;transition:border-color .2s;line-height:1.5;}
.matn-kiritish:focus{border-color:#d9b382;}
.yuborish-tugma{padding:12px 22px;background:#8f1d2c;border-radius:12px;color:#fbf7f0;font-weight:600;font-size:14px;transition:opacity .2s;white-space:nowrap;}
.yuborish-tugma:disabled{opacity:.4;}
.yozmoqda{display:flex;gap:5px;align-items:center;padding:4px 0;}
.nuqta{width:7px;height:7px;border-radius:50%;background:var(--osmon);animation:sakra .9s infinite;}
.nuqta:nth-child(2){animation-delay:.15s;}
.nuqta:nth-child(3){animation-delay:.3s;}
@keyframes sakra{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sozlik-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.sozlik-karta{background:var(--karta);border:1px solid var(--chegara);border-radius:var(--radius);padding:15px 15px 42px 15px;transition:all .22s;position:relative;overflow:hidden;}
.sozlik-karta:hover{border-color:#d9b382;transform:translateY(-3px);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.sozlik-karta .inglizcha{font-size:16.5px;font-weight:700;color:var(--oq);}
.sozlik-karta .uzbekcha{font-size:13px;color:#d9b382;margin-top:5px;}
.sozlik-karta .daraja-belgi{position:absolute;top:9px;right:11px;font-size:9.5px;color:#fbf7f0;font-weight:700;background:var(--ko-k);padding:2px 7px;border-radius:8px;}
.sozlik-eshit{position:absolute;bottom:10px;right:11px;width:28px;height:28px;border-radius:50%;background:#2a4378;border:1px solid var(--chegara);color:#d9b382;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.sozlik-eshit:hover{background:var(--ko-k);border-color:#d9b382;}
.sozlik-son{font-size:12.5px;color:var(--kulrang);margin-bottom:14px;}
.grammatika-royxat{display:flex;flex-direction:column;gap:12px;}
.grammatika-element{background:var(--karta);border:1px solid var(--chegara);border-radius:var(--radius);overflow:hidden;}
.grammatika-bosh{padding:15px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;transition:background .2s;gap:10px;}
.grammatika-bosh:hover{background:#17305e;}
.unit-raqam{background:#2a4378;color:#d9b382;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;flex-shrink:0;}
.grammatika-tana{padding:0 20px;max-height:0;overflow:hidden;transition:max-height .4s ease,padding .25s;}
.grammatika-tana.ochiq{max-height:none;overflow:visible;padding:16px 20px;}
.qoida-blok{background:#12244a;border-left:3px solid var(--ko-k);border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:12px;font-size:13.5px;line-height:1.8;color:#d9b382;}
.misol-qator{margin-bottom:9px;padding:10px 14px;background:#0b1730;border-radius:8px;}
.misol-ingliz{font-size:14px;color:var(--oq);font-weight:500;}
.misol-uzbek{font-size:13px;color:#d9b382;margin-top:4px;}
.ogat-blok{background:#12244a;border:1px solid #8f1d2c;border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.ogat-sarl{font-weight:700;color:var(--sariq);margin-bottom:6px;font-size:13.5px;}
.ogat-qadam{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:13.5px;line-height:1.7;color:#d9b382;}
.ogat-son{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ko-k);color:#fbf7f0;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;}
.ogat-izoh{font-size:13px;line-height:1.7;color:#b9c0d0;margin:4px 0;}
.ogat-ichki{padding-left:32px;}
.ogat-misol{font-size:13px;background:#0b1730;border-radius:6px;padding:6px 10px;margin:4px 0 4px 32px;color:#f5efe6;}
.xato-ogohlantirish{background:#2c2418;border-left:3px solid var(--sariq);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:10px;font-size:12.5px;color:#d9b382;line-height:1.7;}
.test-karta{background:var(--karta);border:1px solid var(--chegara);border-radius:var(--radius);padding:26px;max-width:620px;}
.test-savol{font-size:17px;font-weight:600;margin-bottom:22px;line-height:1.55;}
.test-variantlar{display:flex;flex-direction:column;gap:10px;}
.test-variant{padding:13px 17px;border-radius:10px;border:1px solid var(--chegara);background:var(--asosiy2);color:var(--oq);font-size:13.5px;text-align:left;transition:all .2s;}
.test-variant:hover:not(:disabled){border-color:#d9b382;background:#17305e;}
.test-variant.togri{border-color:var(--yashil);background:#2c2418;color:var(--yashil);}
.test-variant.noto-gri{border-color:var(--qizil);background:#3a1a22;color:var(--qizil);}
.test-fikr{margin-top:16px;padding:13px 17px;border-radius:10px;font-size:13.5px;font-weight:500;}
.test-fikr.yaxshi{background:#2c2418;border:1px solid var(--yashil);color:var(--yashil);}
.test-fikr.yomon{background:#3a1a22;border:1px solid var(--qizil);color:var(--qizil);}
.test-keyingi{margin-top:14px;padding:11px 26px;background:#8f1d2c;border-radius:10px;color:#fbf7f0;font-weight:600;font-size:14px;}
.test-progress{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.progress-chiziq{flex:1;height:7px;background:var(--chegara);border-radius:10px;overflow:hidden;}
.progress-toʻlgan{height:100%;background:var(--ko-k);border-radius:10px;transition:width .4s;}
.test-ball{font-size:13px;color:#d9b382;font-weight:600;}
.kartochka-qobiq{display:flex;flex-direction:column;align-items:center;gap:20px;}
.kartochka-ust{width:100%;max-width:480px;height:210px;perspective:1200px;cursor:pointer;}
.kartochka-ichki{width:100%;height:100%;position:relative;transition:transform .55s cubic-bezier(.4,2,.55,.44);transform-style:preserve-3d;}
.kartochka-ust.aylangan .kartochka-ichki{transform:rotateY(180deg);}
.kartochka-yuz{position:absolute;inset:0;border-radius:18px;border:1px solid var(--chegara);display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:22px;}
.old-yuz{background:#17305e;}
.orqa-yuz{background:#2a4378;transform:rotateY(180deg);}
.kartochka-soz{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;}
.kartochka-maslahat{font-size:12px;color:var(--kulrang);margin-top:8px;}
.kartochka-tarjima{font-size:26px;color:#d9b382;font-weight:600;}
.kartochka-tugmalar{display:flex;gap:12px;}
.k-tugma{padding:11px 26px;border-radius:10px;font-size:14px;font-weight:600;transition:all .2s;}
.k-tugma.bildim{background:#2c2418;border:1px solid var(--yashil);color:var(--yashil);}
.k-tugma.bildim:hover{background:#2c2418;}
.k-tugma.otkazish{background:#17305e;border:1px solid var(--chegara);color:var(--kulrang);}
.k-tugma.otkazish:hover{border-color:#d9b382;color:var(--oq);}
.k-tugma.aralashtir{background:#2c2418;border:1px solid var(--sariq);color:var(--sariq);}
.kartochka-hisoblagich{font-size:13px;color:var(--kulrang);}
.stsenariy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px;margin-bottom:26px;}
.stsenariy-karta{background:var(--karta);border:1px solid var(--chegara);border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:all .2s;}
.stsenariy-karta:hover,.stsenariy-karta.faol{border-color:#d9b382;background:#2a4378;}
.stsenariy-icon{font-size:28px;margin-bottom:7px;}
.stsenariy-nomi{font-size:13px;font-weight:600;}
.stsenariy-uz{font-size:11px;color:var(--kulrang);margin-top:3px;}
.chip{padding:9px 15px;border-radius:10px;border:1px solid var(--chegara);background:var(--asosiy2);color:var(--oq);font-size:14px;font-weight:500;transition:all .15s;}
.chip:hover:not(:disabled){border-color:#d9b382;background:#17305e;}
.javob-joy{min-height:58px;border:1px dashed var(--chegara);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.chip-qator{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.katta-ovoz{width:84px;height:84px;border-radius:50%;background:#8f1d2c;color:#fbf7f0;font-size:34px;box-shadow:0 1px 2px rgba(0,0,0,.35);}
.kichik-banner{background:#17305e;border:1px solid var(--chegara);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--kulrang);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.manba-eslatma{font-size:11.5px;color:var(--kulrang);margin-top:18px;padding:10px 14px;background:#12244a;border-radius:8px;line-height:1.6;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
.stat-karta{background:var(--karta);border:1px solid var(--chegara);border-radius:var(--radius);padding:20px;text-align:center;}
.stat-raqam{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;color:#d9b382;}
.stat-belgi{font-size:12px;color:var(--kulrang);margin-top:4px;}
.stat-karta.olov{background:#17305e;border-color:var(--sariq);}
.stat-karta.olov .stat-raqam{color:var(--sariq);}
.daraja-progress-royxat{display:flex;flex-direction:column;gap:10px;}
.daraja-progress-qator{background:var(--karta);border:1px solid var(--chegara);border-radius:12px;padding:14px 18px;}
.daraja-progress-bosh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:600;}
.daraja-progress-son{font-size:12px;color:var(--kulrang);font-weight:500;}
.daraja-progress-chiziq{height:8px;background:var(--chegara);border-radius:10px;overflow:hidden;}
.daraja-progress-tolgan{height:100%;background:var(--ko-k);border-radius:10px;transition:width .4s;}
.srs-banner{display:flex;align-items:center;justify-content:space-between;background:#2a4378;border:1px solid var(--ko-k);border-radius:12px;padding:14px 20px;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.srs-banner-matn{font-size:13px;color:#d9b382;font-weight:600;}
.srs-banner-son{font-size:22px;font-weight:800;color:#fbf7f0;}
.reset-tugma{background:none;border:1px solid var(--chegara);color:var(--kulrang);padding:8px 16px;border-radius:8px;font-size:12px;transition:all .2s;}
.reset-tugma:hover{border-color:var(--qizil);color:var(--qizil);}
.srs-daraja-belgi{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:8px;}
.srs-yangi{background:#2a4378;color:#d9b382;}
.srs-takror{background:#2c2418;color:var(--sariq);}
.srs-mustahkam{background:#2c2418;color:var(--yashil);}
.daraja-tugma.qulflangan{opacity:.4;cursor:not-allowed;position:relative;}
.daraja-tugma.qulflangan:hover{border-color:var(--chegara);}
.jon-qatori{display:flex;gap:6px;align-items:center;margin-bottom:16px;}
.jon{font-size:20px;transition:all .3s;}
.jon.ochirilgan{opacity:.25;filter:grayscale(1);transform:scale(.8);}
.xp-belgi{display:inline-flex;align-items:center;gap:4px;background:#12244a;border:1px solid var(--sariq);color:var(--sariq);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;}
.xp-uchish{position:fixed;color:var(--sariq);font-weight:800;font-size:18px;pointer-events:none;z-index:999;animation:xpUch 1s ease-out forwards;}
@keyframes xpUch{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}
.daraja-ochildi-modal{position:fixed;inset:0;background:#000000cc;display:flex;align-items:center;justify-content:center;z-index:1000;}
.daraja-ochildi-karta{background:#2a4378;border:2px solid var(--sariq);border-radius:20px;padding:40px;text-align:center;max-width:380px;}
.jon-tugadi-karta{text-align:center;padding:50px 30px;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#8f1d2c;border-radius:4px;}
.nav-xp{white-space:nowrap;display:none;}
@media (max-width:768px){
  .nav{padding:10px 14px;}
  .nav-tagline{display:none;}
  .nav-nomi{font-size:18px;}
  .nav-logo{width:34px;height:34px;font-size:17px;}
  .nav-xp{display:inline-flex;}
  .nav-bayroq{font-size:18px;gap:8px;}
  .nav{gap:8px;}
  .nav-tagline{display:none;}
  .nav-bayroq{display:none;}
  .ak-user{max-width:none;}
  .ak-user span:not(.ak-chiq){display:none;}
  .ak-user{background:none;border:none;padding:0;}
  .asosiy-joy{flex-direction:column;min-height:0;}
  .yon-panel{position:fixed;bottom:0;left:0;right:0;width:100%;z-index:90;flex-direction:row;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:none;border-top:1px solid var(--chegara);overflow:hidden;background:#0b1730f5;backdrop-filter:blur(12px);}
  .yon-panel > div{display:none;}
  .modul-tugma{flex-direction:column;gap:2px;width:auto;min-width:0;flex:1 1 0;padding:7px 4px;text-align:center;justify-content:center;}
  .modul-tugma .modul-tavsif{display:none;}
  .modul-icon{font-size:20px;width:auto;}
  .modul-nomi{font-size:10.5px;white-space:nowrap;}
  .kichik-modul{opacity:1;}
  .kichik-modul .modul-icon{font-size:20px;}
  .kichik-modul .modul-nomi{font-size:10.5px;}
  .kontent{padding:18px 14px 96px;max-height:none;overflow:visible;}
  .sahifa-sarlavha h2{font-size:20px;}
  .sozlik-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
  .stsenariy-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}

const GRAMMATIKA_20 = [{"raqam":1,"sarlavha":"To be fe'li — am / is / are","daraja":"A1","tayyor":true,"qoida":"📌 'Bo'lmoq' fe'li (be). Gap kimga tegishli bo'lsa, shunga qarab o'zgaradi:\n▸ I → am (men ... man)\n▸ He / She / It → is (u ... ekan)\n▸ You / We / They → are (siz / biz / ular ... ekan)\n\n💡 O'zbekchada 'men talabaman' deyiladi, inglizchada esa 'am' majburiy.\n\nMisollar:\n✔ I am a student. (Men talabaman.)\n✔ She is a doctor. (U shifokor.)\n✔ We are ready. (Biz tayyormiz.)","ogatish":"🧭 Qadam-baqadam:\n1) Gap kim haqida? (I, you, he, she, we, they...)\n2) Egaga mos fe'l: I → am; he/she/it → is; you/we/they → are.\n   Masalan: 'Ali' — he → Ali is at school.\n3) Inkor: fe'ldan keyin not. I am not; she is not (isn't); they are not (aren't).\n   Misol: He isn't tired. (U charchamagan.)\n4) Savol: fe'lni boshga chiqaring.\n   Are you tired? Is she at home?\n   Javob: Yes, I am. / No, she isn't.","misollar":[{"ingliz":"I am from Uzbekistan.","uzbek":"Men O'zbekistondanman."},{"ingliz":"She is a doctor.","uzbek":"U shifokor."},{"ingliz":"We are ready.","uzbek":"Biz tayyormiz."},{"ingliz":"Is he your brother?","uzbek":"U sizning akangizmi?"},{"ingliz":"They aren't at home now.","uzbek":"Ular hozir uyda emas."},{"ingliz":"Am I late?","uzbek":"Men kechikdimmi?"}],"xato":"❌ I is a student. → ✅ I am a student.\n❌ She are tired. → ✅ She is tired.\n❌ Is you ready? → ✅ Are you ready?","mashqlar":[{"savol":"My parents ___ teachers.","variantlar":["is","am","are","be"],"togri":2,"izoh":"My parents = They → are."},{"savol":"___ you tired?","variantlar":["Is","Are","Am","Do"],"togri":1,"izoh":"You bilan 'Are' ishlatiladi."},{"savol":"This ___ my favourite book.","variantlar":["are","am","is","be"],"togri":2,"izoh":"This = It → is."},{"savol":"I ___ not hungry now.","variantlar":["is","are","am","do"],"togri":2,"izoh":"I bilan 'am' ishlatiladi, inkor: am not."}]},{"raqam":2,"sarlavha":"Hozirgi oddiy zamon — Present Simple","daraja":"A1","tayyor":true,"qoida":"📌 Odatiy ish, takrorlanadigan harakat va doimiy haqiqat uchun.\n▸ I / you / we / they + fe'l (o'zgarmaydi): I work, they play.\n▸ He / she / it + fe'l + -s / -es: he works, she watches, it goes.\n\n💡 Ko'p ishlatiladigan vaqt so'zlari: always, usually, every day, on Mondays, at night.\n\nMisollar:\n✔ I drink tea every morning. (Har ertalab choy ichaman.)\n✔ She works at a bank. (U bankda ishlaydi.)\n✔ Water boils at 100 degrees. (Suv 100 darajada qaynaydi.)","ogatish":"🧭 Qadam-baqadam:\n1) Ish har kuni yoki doim bo'ladimi? Ha → Present Simple.\n2) Ega he/she/it bo'lsa → fe'lga -s. Oxiri -s, -sh, -ch, -o bo'lsa → -es: go → goes, watch → watches, do → does.\n3) Inkor: I/you/we/they don't; he/she/it doesn't. Fe'l oddiy shaklda: She doesn't work (works emas).\n4) Savol: Do yoki Does ni boshga qo'ying.\n   Do you work? Does he play?\n\nMisollar:\n• He plays football on Sundays.\n• We don't watch TV.\n• Does your brother study English?","misollar":[{"ingliz":"I work every day.","uzbek":"Men har kuni ishlayman."},{"ingliz":"He works in a bank.","uzbek":"U bankda ishlaydi."},{"ingliz":"She doesn't like coffee.","uzbek":"U qahvani yoqtirmaydi."},{"ingliz":"Do you speak English?","uzbek":"Siz inglizcha gapirasizmi?"},{"ingliz":"My father goes to work at 8.","uzbek":"Otam soat 8 da ishga boradi."},{"ingliz":"The sun rises in the east.","uzbek":"Quyosh sharqdan chiqadi."}],"xato":"❌ She work at school. → ✅ She works at school.\n❌ He doesn't works. → ✅ He doesn't work.\n❌ Does she likes tea? → ✅ Does she like tea?","mashqlar":[{"savol":"My sister ___ in a hospital.","variantlar":["work","works","working","to work"],"togri":1,"izoh":"She → fe'lga -s qo'shiladi: works."},{"savol":"___ they live in Tashkent?","variantlar":["Do","Does","Is","Are"],"togri":0,"izoh":"They bilan savolda 'Do' ishlatiladi."},{"savol":"I ___ understand this question.","variantlar":["doesn't","don't","not","isn't"],"togri":1,"izoh":"I bilan inkorda 'don't' ishlatiladi."},{"savol":"The sun ___ in the east.","variantlar":["rise","rises","rising","rose"],"togri":1,"izoh":"The sun = It → fe'lga -s qo'shiladi: rises."}]},{"raqam":3,"sarlavha":"Artikllar — a / an / the","daraja":"A1","tayyor":true,"qoida":"📌 a, an, the — otdan oldin turadi va narsaning noaniq yoki aniq ekanini bildiradi.\n▸ a — undosh TOVUSH bilan boshlangan bitta narsa: a book, a car, a university (yu- tovushi).\n▸ an — unli TOVUSH bilan boshlangan: an apple, an egg, an hour (h o'qilmaydi).\n▸ the — aniq yoki hamma biladigan narsa: the sun, the door, the book on the table.\n\n💡 Harf emas, tovush muhim.\n\nMisollar:\n✔ I have a cat. The cat is black. (Bitta mushuk bor. O'sha mushuk qora.)\n✔ She is an engineer. (U muhandis.)\n✔ Open the window, please. (Iltimos, derazani oching.)","ogatish":"🧭 Qadam-baqadam:\n1) Narsa birinchi marta tilga olinmoqdami? Ha → a yoki an.\n2) Ikkinchi marta aytilyaptimi yoki hamma biladimi? Ha → the.\n3) a yoki an tanlash: so'z tovushiga qarang. Undosh → a (a car, a house). Unli → an (an orange, an idea).\n4) Yagona narsalar uchun ham the: the sun, the moon, the Earth.\n\nMisollar:\n• I saw a man. The man was tall.\n• It's an old building.\n• Where is the bathroom?","misollar":[{"ingliz":"I bought a book yesterday.","uzbek":"Kecha bir kitob sotib oldim."},{"ingliz":"The book was very interesting.","uzbek":"O'sha kitob juda qiziqarli edi."},{"ingliz":"She is an engineer.","uzbek":"U muhandis."},{"ingliz":"He ate an apple.","uzbek":"U bir olma yedi."},{"ingliz":"The sun rises in the east.","uzbek":"Quyosh sharqdan chiqadi."},{"ingliz":"It takes an hour to get there.","uzbek":"U yerga borish uchun bir soat ketadi."}],"xato":"❌ I have an car. → ✅ I have a car.\n❌ She is a engineer. → ✅ She is an engineer.\n❌ I saw a dog. Dog was big. → ✅ I saw a dog. The dog was big.","mashqlar":[{"savol":"She wants to be ___ doctor.","variantlar":["a","an","the","—"],"togri":0,"izoh":"'Doctor' undosh 'd' bilan boshlanadi → a doctor."},{"savol":"Can you close ___ door, please?","variantlar":["a","an","the","—"],"togri":2,"izoh":"Aniq, ma'lum eshik nazarda tutilyapti → the door."},{"savol":"Ali is ___ honest man. (birinchi marta tilga olinyapti)","variantlar":["a","an","the","—"],"togri":1,"izoh":"'Honest' so'zida 'h' o'qilmaydi, tovush unli 'o' dan boshlanadi → an honest."},{"savol":"___ moon goes around the Earth.","variantlar":["A","An","The","—"],"togri":2,"izoh":"Oy — yagona, hammaga ma'lum narsa → the moon."}]},{"raqam":4,"sarlavha":"Ko'plik son — Plural nouns","daraja":"A1","tayyor":true,"qoida":"📌 Bir nechta narsa uchun ko'plik shakli.\n▸ Odatda: -s qo'shiladi: book → books, car → cars.\n▸ s, sh, ch, x, z bilan tugasa → -es: bus → buses, dish → dishes, box → boxes.\n▸ undosh + y → y ni olib -ies: city → cities, baby → babies.\n▸ unli + y → -s: boy → boys, day → days.\n▸ Tartibsiz: man → men, child → children, foot → feet, tooth → teeth, person → people.\n\nMisollar:\n✔ two books, three buses, five cities\n✔ The children are playing. (Bolalar o'ynashyapti.)\n✔ Many people came. (Ko'p odam keldi.)","ogatish":"🧭 Qadam-baqadam:\n1) Narsa bittami yoki ko'pmi? Ko'p bo'lsa → ko'plik.\n2) So'z oxiriga qarang: s/sh/ch/x/z → -es; undosh+y → -ies; qolgan → -s.\n3) Tartibsiz so'zlarni yod oling (man, child, foot).\n4) Son bilan ham ko'plik shart: three books.\n\nMisollar:\n• one box → two boxes\n• one city → three cities\n• one man → four men","misollar":[{"ingliz":"I have two brothers.","uzbek":"Mening ikkita akam bor."},{"ingliz":"There are five buses here.","uzbek":"Bu yerda beshta avtobus bor."},{"ingliz":"She visited three cities.","uzbek":"U uchta shaharga tashrif buyurdi."},{"ingliz":"The children are playing outside.","uzbek":"Bolalar tashqarida o'ynashyapti."},{"ingliz":"Many people live in Tashkent.","uzbek":"Toshkentda ko'p odam yashaydi."},{"ingliz":"Put the dishes on the table.","uzbek":"Idishlarni stolga qo'ying."}],"xato":"❌ three book → ✅ three books\n❌ two citys → ✅ two cities\n❌ two mans → ✅ two men","mashqlar":[{"savol":"How many ___ do you have?","variantlar":["childs","child","children","childrens"],"togri":2,"izoh":"'Child' — tartibsiz, ko'pligi 'children'."},{"savol":"There are many ___ in the box.","variantlar":["boxs","boxes","boxies","box"],"togri":1,"izoh":"'Box' 'x' bilan tugaydi → boxes."},{"savol":"I saw two ___ in the park.","variantlar":["ladys","ladies","ladyes","lady"],"togri":1,"izoh":"Undosh+y → ladies."},{"savol":"These ___ are expensive.","variantlar":["watchs","watches","watchies","watch"],"togri":1,"izoh":"'Watch' 'ch' bilan tugaydi → watches."}]},{"raqam":5,"sarlavha":"Ko'rsatish olmoshlari — this / that / these / those","daraja":"A1","tayyor":true,"qoida":"📌 Narsaga ishora qiladi. Ikki savolga javob bering:\n▸ Narsa bittami yoki ko'pmi?\n▸ Yaqinmi yoki uzoqmi?\n\nthis — bu (bitta, yaqin): this book\nthat — u (bitta, uzoq): that car\nthese — bular (ko'p, yaqin): these shoes\nthose — ular (ko'p, uzoq): those houses\n\nMisollar:\n✔ This is my phone. (Bu mening telefonim.)\n✔ That is your house over there. (Ana u yerdagi uyingiz.)\n✔ These are my keys. (Bular mening kalitlarim.)\n✔ Those shoes are new. (O'sha poyabzallar yangi.)","ogatish":"🧭 Qadam-baqadam:\n1) Narsa bittami? → this / that. Ko'pmi? → these / those.\n2) Yaqinmi? → this / these. Uzoqmi? → that / those.\n3) Ko'plik bo'lsa ot ham ko'plikda: these books (this books emas).\n\nMisollar:\n• This pen is cheap. (Bu ruchka arzon.)\n• Those mountains are high. (O'sha tog'lar baland.)\n• What are these? (Bular nima?)","misollar":[{"ingliz":"This is my friend.","uzbek":"Bu mening do'stim."},{"ingliz":"That is the bank.","uzbek":"Ana u bank."},{"ingliz":"These are my books.","uzbek":"Bular mening kitoblarim."},{"ingliz":"Those children are very tall.","uzbek":"O'sha bolalar juda baland bo'yli."},{"ingliz":"Look at this!","uzbek":"Buni qarang!"},{"ingliz":"Is that your car?","uzbek":"U sizning mashinangizmi?"}],"xato":"❌ This books are new. → ✅ These books are new.\n❌ These is my keys. → ✅ These are my keys.\n❌ Those is old. → ✅ That is old.","mashqlar":[{"savol":"___ apples on the table are fresh. (yaqin, ko'p)","variantlar":["This","That","These","Those"],"togri":2,"izoh":"Yaqin + ko'p = these."},{"savol":"Look at ___ mountains far away! (uzoq, ko'p)","variantlar":["this","that","these","those"],"togri":3,"izoh":"Uzoq + ko'p = those."},{"savol":"___ is my new bag. (yaqin, bitta)","variantlar":["This","That","These","Those"],"togri":0,"izoh":"Yaqin + bitta = this."},{"savol":"Who is ___ man standing near the door? (uzoq, bitta)","variantlar":["this","that","these","those"],"togri":1,"izoh":"Uzoq + bitta = that."}]},{"raqam":6,"sarlavha":"Egalik olmoshlari — my / your / his / her / our / their","daraja":"A1","tayyor":true,"qoida":"📌 Narsa kimga tegishli ekanini ko'rsatadi. Otdan OLDIN turadi va o'zi o'zgarmaydi.\n▸ my — mening: my book\n▸ your — sizning / sening: your car\n▸ his — uning (erkak egasi): his house\n▸ her — uning (ayol egasi): her bag\n▸ its — uning (narsa yoki hayvon): its tail\n▸ our — bizning: our school\n▸ their — ularning: their dog\n\n💡 Egalik olmoshi EGASIGA qaraydi, narsaning jinsiga emas.\n\nMisollar:\n✔ Ali lost his phone. (Ali telefonini yo'qotdi.)\n✔ Maria forgot her keys. (Mariya kalitlarini unutdi.)\n✔ The cat drinks its milk. (Mushuk o'z sutini ichadi.)","ogatish":"🧭 Qadam-baqadam:\n1) Narsa kimniki? (men, siz, u, biz, ular)\n2) Egasi erkakmi, ayolmi, yoki narsa/hayvonmi? Erkak → his; ayol → her; narsa → its.\n3) Olmoshni otning oldiga qo'ying: his car, her bag, our house.\n\nMisollar:\n• Our teacher is kind. (Bizning o'qituvchi mehribon.)\n• Their house is big. (Ularning uyi katta.)\n• I love my family. (Men oilamni sevaman.)","misollar":[{"ingliz":"This is my book.","uzbek":"Bu mening kitobim."},{"ingliz":"Is this your car?","uzbek":"Bu sizning mashinangizmi?"},{"ingliz":"He lost his phone.","uzbek":"U telefonini yo'qotdi."},{"ingliz":"She loves her country.","uzbek":"U o'z vataniga muhabbat qo'yadi."},{"ingliz":"We painted our house.","uzbek":"Biz uyimizni bo'yadik."},{"ingliz":"They invited their friends.","uzbek":"Ular do'stlarini taklif qilishdi."}],"xato":"❌ Ali lost her phone. → ✅ Ali lost his phone.\n❌ Me book → ✅ My book.\n❌ The cat drinks it's milk. → ✅ The cat drinks its milk. (it's = it is)","mashqlar":[{"savol":"Maria lost ___ umbrella.","variantlar":["his","her","their","its"],"togri":1,"izoh":"Maria — ayol → her."},{"savol":"The company changed ___ name last year.","variantlar":["his","her","its","their"],"togri":2,"izoh":"Kompaniya — narsa, shuning uchun its ishlatiladi."},{"savol":"We finished ___ homework early.","variantlar":["my","our","their","your"],"togri":1,"izoh":"We → our."},{"savol":"John and Ali brought ___ books.","variantlar":["his","her","their","our"],"togri":2,"izoh":"John and Ali = they → their."}]},{"raqam":7,"sarlavha":"There is / There are","daraja":"A1","tayyor":true,"qoida":"📌 Biror narsa borligini aytish uchun. O'zbekchada 'bor' degan ma'noda.\n▸ There is — bitta yoki sanab bo'lmaydigan narsa bor: There is a bank here. There is some milk.\n▸ There are — ko'p narsa bor: There are three students.\n▸ Inkor: There isn't / There aren't.\n▸ Savol: Is there...? Are there...?\n\nMisollar:\n✔ There is a cat in the garden. (Bog'da bitta mushuk bor.)\n✔ There are many books on the shelf. (Javonda ko'p kitob bor.)\n✔ Is there any water? (Suv bormi?)","ogatish":"🧭 Qadam-baqadam:\n1) Keyingi narsa bittami yoki ko'pmi?\n2) Bitta yoki sanab bo'lmaydigan → There is. Ko'p → There are.\n3) Inkor: is/are dan keyin not. Savol: is/are ni boshga.\n\nMisollar:\n• There is a problem. (Bir muammo bor.)\n• There are no students today. (Bugun talaba yo'q.)\n• Are there any questions? (Savollar bormi?)","misollar":[{"ingliz":"There is a park near my house.","uzbek":"Uyimning yonida bog' bor."},{"ingliz":"There are two chairs in the room.","uzbek":"Xonada ikkita stul bor."},{"ingliz":"There is some tea in the cup.","uzbek":"Piyolada biroz choy bor."},{"ingliz":"Is there a bank near here?","uzbek":"Bu yaqin atrofda bank bormi?"},{"ingliz":"There aren't any tickets left.","uzbek":"Chipta qolmagan."},{"ingliz":"There are many people at the station.","uzbek":"Vokzalda ko'p odam bor."}],"xato":"❌ There is many books. → ✅ There are many books.\n❌ There are a book. → ✅ There is a book.\n❌ Is there a books? → ✅ Are there any books?","mashqlar":[{"savol":"___ a bank near here?","variantlar":["Is there","Are there","There is","There are"],"togri":0,"izoh":"Birlik savol: Is there...?"},{"savol":"___ many people at the party.","variantlar":["There is","There are","Is there","Are there"],"togri":1,"izoh":"Ko'plik (many people) → There are."},{"savol":"There ___ any sugar in the jar.","variantlar":["isn't","aren't","don't","not"],"togri":0,"izoh":"'Sugar' sanalmaydigan ot, birlik kabi: isn't."},{"savol":"___ two windows in this room.","variantlar":["There is","There are","Is there","Has"],"togri":1,"izoh":"Ko'plik (two windows) → There are."}]},{"raqam":8,"sarlavha":"O'rin predloglari — in / on / at","daraja":"A1","tayyor":true,"qoida":"📌 Joy va o'rin uchun 3 asosiy predlog:\n▸ in — ichida, katta joy ichida: in the box, in Tashkent, in the room\n▸ on — ustida, yuzasida: on the table, on the wall, on Monday\n▸ at — aniq nuqta yoki manzil: at home, at school, at the door\n\n💡 Shahar va mamlakat: in Uzbekistan, in Samarkand.\n\nMisollar:\n✔ The keys are in my bag. (Kalitlar sumkamda.)\n✔ The picture is on the wall. (Rasm devorda.)\n✔ I'm at work now. (Hozir ishdaman.)","ogatish":"🧭 Qadam-baqadam:\n1) Narsa ichidami? → in\n2) Narsa ustida yoki yuzasidami? → on\n3) Aniq nuqta, manzil yoki uy? → at\n4) Shahar, mamlakat, yil, oy → odatda in.\n\nMisollar:\n• She lives in Bukhara. (U Buxoroda yashaydi.)\n• Put it on the shelf. (Uni javonga qo'ying.)\n• We meet at the cafe. (Biz kafeda uchrashamiz.)","misollar":[{"ingliz":"I live in Samarkand.","uzbek":"Men Samarqandda yashayman."},{"ingliz":"The book is on the table.","uzbek":"Kitob stol ustida."},{"ingliz":"She is at the bus stop.","uzbek":"U avtobus bekatida."},{"ingliz":"We arrived at the airport.","uzbek":"Biz aeroportga yetib keldik."},{"ingliz":"There is a cat in the box.","uzbek":"Qutida mushuk bor."},{"ingliz":"Hang the coat on the hook.","uzbek":"Paltoni ilgakka osing."}],"xato":"❌ She is in home. → ✅ She is at home.\n❌ The book is in the table. → ✅ The book is on the table.\n❌ I live at Uzbekistan. → ✅ I live in Uzbekistan.","mashqlar":[{"savol":"My keys are ___ my bag. (sumkaning ichida)","variantlar":["in","on","at","to"],"togri":0,"izoh":"Sumka ichida → in."},{"savol":"There is a picture ___ the wall.","variantlar":["in","on","at","under"],"togri":1,"izoh":"Devor yuzasida → on."},{"savol":"I will meet you ___ the entrance.","variantlar":["in","on","at","to"],"togri":2,"izoh":"Aniq nuqta (kirish joyi) → at."},{"savol":"He was born ___ Bukhara.","variantlar":["in","on","at","from"],"togri":0,"izoh":"Shahar nomi bilan → in."}]},{"raqam":9,"sarlavha":"Hozirgi davomli zamon — Present Continuous","daraja":"A2","tayyor":true,"qoida":"📌 Ayni shu paytda davom etayotgan ish.\n▸ Tuzilishi: am / is / are + fe'l-ing\n▸ I am reading now. (Hozir o'qiyapman.)\n▸ She is cooking dinner. (U kechki ovqat pishiryapti.)\n▸ They are playing outside. (Ular tashqarida o'ynashyapti.)\n\n💡 Yaqin kelajak rejasi ham bo'ladi: We are meeting tomorrow. (Ertaga uchrashamiz.)\n\nMisollar:\n✔ I am writing an email. (Email yozyapman.)\n✔ It is raining now. (Hozir yomg'ir yog'yapti.)\n✔ Are you listening to me? (Meni tinglayapsizmi?)","ogatish":"🧭 Qadam-baqadam:\n1) Ish hozir davom etyaptimi? Ha → Present Continuous.\n2) be-fe'lini tanlang: I → am; he/she/it → is; you/we/they → are.\n3) Fe'lga -ing: work → working; write → writing (e tushadi); run → running (n ikki marta).\n4) Inkor: am/is/are + not. Savol: be-fe'li boshga.\n\nMisollar:\n• He is not sleeping. (U uxlamayapti.)\n• Are they coming? (Ular kelyaptimi?)\n• The children are sitting down. (Bolalar o'tirishyapti.)","misollar":[{"ingliz":"I am studying English now.","uzbek":"Hozir inglizcha o'rganyapman."},{"ingliz":"She is wearing a red dress.","uzbek":"U qizil ko'ylak kiyib olgan."},{"ingliz":"They are playing football.","uzbek":"Ular futbol o'ynashyapti."},{"ingliz":"Is it raining?","uzbek":"Yomg'ir yog'yaptimi?"},{"ingliz":"We are waiting for the bus.","uzbek":"Biz avtobusni kutyapmiz."},{"ingliz":"He is not working today.","uzbek":"U bugun ishlamayapti."}],"xato":"❌ I am know the answer. → ✅ I know the answer. (know davom etmaydi)\n❌ She is go to school. → ✅ She is going to school.\n❌ They is playing. → ✅ They are playing.","mashqlar":[{"savol":"Look! It ___ outside.","variantlar":["rains","is raining","rained","rain"],"togri":1,"izoh":"'Look!' — hozir sodir bo'lyapti → is raining."},{"savol":"We ___ dinner right now.","variantlar":["have","are having","has","had"],"togri":1,"izoh":"We → are + having."},{"savol":"She ___ to music at the moment.","variantlar":["listen","listens","is listening","listened"],"togri":2,"izoh":"'At the moment' — hozir → is listening."},{"savol":"I ___ you. I can see you clearly.","variantlar":["am understanding","understand","understood","will understand"],"togri":1,"izoh":"'Understand' his-tuyg'u fe'li, -ing olmaydi: I understand."}]},{"raqam":10,"sarlavha":"Can / Can't — qobiliyat va ruxsat","daraja":"A2","tayyor":true,"qoida":"📌 can — qobiliyat yoki ruxsat.\n▸ I can swim. (Men suza olaman — qobiliyat.)\n▸ You can go now. (Hozir ketishingiz mumkin — ruxsat.)\n▸ can't — qila olmaslik yoki ruxsat yo'qligi: I can't drive.\n\n💡 can dan keyingi fe'l oddiy shaklda: She can swim (swims emas).\n\nMisollar:\n✔ Can you help me? (Menga yordam bera olasizmi?)\n✔ He can speak three languages. (U uch tilda gapira oladi.)\n✔ We can't come today. (Bugun kela olmaymiz.)","ogatish":"🧭 Qadam-baqadam:\n1) Gap qobiliyatmi yoki ruxsatmi? Ikkalasida ham can.\n2) can dan keyin fe'l oddiy shaklda: can read, can write.\n3) Inkor: can't (cannot).\n4) Savol: Can you...? Can I...?\n\nMisollar:\n• I can't hear you. (Sizni eshitmayapman.)\n• Can I sit here? (Bu yerda o'tirsam bo'ladimi?)\n• She can cook very well. (U juda yaxshi pishiradi.)","misollar":[{"ingliz":"I can play the piano.","uzbek":"Men pianino chala olaman."},{"ingliz":"Can you swim?","uzbek":"Siz suza olasizmi?"},{"ingliz":"You can't smoke here.","uzbek":"Bu yerda chekish mumkin emas."},{"ingliz":"Can I borrow your pen?","uzbek":"Ruchkangizni olsam bo'ladimi?"},{"ingliz":"My brother can speak Russian.","uzbek":"Akam rus tilida gapira oladi."},{"ingliz":"We can't find the way.","uzbek":"Yo'lni topa olmayapmiz."}],"xato":"❌ She can swims. → ✅ She can swim.\n❌ I cannot to go. → ✅ I cannot go.\n❌ Can you to help me? → ✅ Can you help me?","mashqlar":[{"savol":"My brother ___ play the piano very well.","variantlar":["cans","can to","can","canning"],"togri":2,"izoh":"Can barcha shaxslar uchun bir xil, -s qo'shilmaydi."},{"savol":"___ you swim?","variantlar":["Do can","Can","Cans","Are can"],"togri":1,"izoh":"Savolda 'Can' shaxsdan oldin keladi."},{"savol":"I ___ understand this word.","variantlar":["can't","don't can","can not to","cann't"],"togri":0,"izoh":"Inkor: can't (yoki cannot)."},{"savol":"Birds ___ fly, but penguins can't.","variantlar":["can to","cans","can","canning"],"togri":2,"izoh":"Can + fe'l (to'siz): can fly."}]},{"raqam":11,"sarlavha":"O'tgan oddiy zamon — Past Simple","daraja":"A2","tayyor":true,"qoida":"📌 Past Simple — o'tmishda tugagan, aniq vaqti ko'rsatilgan ish.\nAniq vaqt so'zlari: yesterday, last week, in 2019, two days ago.\n\nTo'g'ri fe'l (-ed qo'shiladi):\n▸ work → worked (ishladi)\n▸ play → played (o'ynadi)\n▸ visit → visited (tashrif buyurdi)\n\nTartibsiz fe'l (shakli o'zgaradi, yodlash kerak):\n▸ go → went (bordi)\n▸ see → saw (ko'rdi)\n▸ buy → bought (sotib oldi)","ogatish":"🧭 Qadam-baqadam:\n1) Gap o'tmishda tugaganmi va aniq vaqt bormi? Ha bo'lsa — Past Simple.\n2) Fe'l to'g'rimi yoki tartibsizmi? To'g'ri → -ed; tartibsiz → jadvaldan qarang.\n3) Inkor va savolda did ishlating, fe'l oddiy shaklga qaytadi:\n   I didn't go. / Did you go? / She didn't see him.\n\nEslab qoling: did bor bo'lsa, asosiy fe'l o'tgan zamonda yozilmaydi: Did you see? (saw emas).","misollar":[{"ingliz":"I visited my grandmother last Sunday.","uzbek":"Men o'tgan yakshanba buvimnikiga bordim."},{"ingliz":"She went to Samarkand two years ago.","uzbek":"U ikki yil oldin Samarqandga bordi."},{"ingliz":"We didn't see the film.","uzbek":"Biz filmni ko'rmadik."},{"ingliz":"Did you buy a new phone?","uzbek":"Yangi telefon sotib oldingizmi?"}],"xato":"O'zbekchada o'tgan zamon har doim fe'lning o'ziga qo'shiladi (bordim, bormadim, bordingmi). Inglizchada esa savol va inkorda o'tgan zamon did ga o'tadi, asosiy fe'l o'zgarmaydi. Xato: 'Did you went?' va 'I didn't saw'. To'g'risi: 'Did you go?' va 'I didn't see'.","mashqlar":[{"savol":"We ___ a great film last night.","variantlar":["watched","watching","watches","watch"],"togri":0,"izoh":"'Last night' — o'tgan vaqt, muntazam fe'l: watch + ed."},{"savol":"She ___ to school yesterday.","variantlar":["went","gone","go","goes"],"togri":0,"izoh":"'Go' tartibsiz fe'l, o'tgan zamoni 'went'."},{"savol":"I didn't ___ the answer.","variantlar":["knows","know","knew","knowed"],"togri":1,"izoh":"Inkorda didn't dan keyin fe'lning oddiy shakli keladi: didn't know."},{"savol":"___ you visit your aunt last week?","variantlar":["Do","Did","Were","Have"],"togri":1,"izoh":"'Last week' — o'tgan zamon savoli: Did + ega + oddiy fe'l."}]},{"raqam":12,"sarlavha":"Savol so'zlari va Do/Does/Did savollari","daraja":"A2","tayyor":true,"qoida":"📌 Savol so'zlari (wh-questions) ma'lumot so'raydi.\nwhat — nima · where — qayerda · when — qachon · why — nega · who — kim · how — qanday / qancha\n\nFe'l bilan tuzilishi: savol so'zi + do/does/did + ega + fe'l?\n▸ Where do you live? (Qayerda yashaysiz?)\n▸ What does she want? (U nima xohlaydi?)\n▸ When did they arrive? (Ular qachon kelishdi?)\n\nBe-fe'li bo'lsa, yordamchi fe'l kerak emas:\n▸ Where are you? (Qayerdasiz?)\n▸ When is he coming? (U qachon keladi?)","ogatish":"🧭 Qadam-baqadam:\n1) Qaysi savol so'zi kerak? Joy → where; vaqt → when; sabab → why; odam → who; narsa → what.\n2) Gapda be-fe'li bormi (am/is/are/was/were)? Ha bo'lsa, u savol so'zidan keyin keladi: Where is the bank?\n3) Aks holda do/does/did ni ega oldiga qo'ying: What do they need? / Why does he cry?\n4) Fe'lni oddiy shaklda qoldiring: What does he eat? (eats emas)\n\nEslab qoling: who egaga tegishli. Rasmiy matnda whom ob'ektga ishlatiladi, lekin hozir ko'pincha who ishlatiladi.","misollar":[{"ingliz":"Where do you work?","uzbek":"Siz qayerda ishlaysiz?"},{"ingliz":"What did she say?","uzbek":"U nima dedi?"},{"ingliz":"Why is he late?","uzbek":"U nega kech qoldi?"},{"ingliz":"How much does this bag cost?","uzbek":"Bu sumka necha pul turadi?"}],"xato":"O'zbekchada savol so'zi gap ichida turaveradi ('Sen qayerda yashaysan?'). Inglizchada savol so'zi gap boshida, undan keyin yordamchi fe'l va ega keladi. Xato: 'Where you live?' va 'What you want?'. To'g'risi: 'Where do you live?' va 'What do you want?'.","mashqlar":[{"savol":"___ does she work? — In a bank.","variantlar":["Who","How many","Where","Why"],"togri":2,"izoh":"Javob joyni bildiryapti (in a bank), demak Where."},{"savol":"What time ___ the lesson start every day?","variantlar":["do","did","does","is"],"togri":2,"izoh":"The lesson = it, hozirgi zamon: does + oddiy fe'l (start)."},{"savol":"Why ___ you late yesterday?","variantlar":["do","are","were","did"],"togri":2,"izoh":"'Late' sifat, demak to be kerak; 'yesterday' tufayli o'tgan zamon: were."},{"savol":"How many books ___ she read last month?","variantlar":["did","has","do","does"],"togri":0,"izoh":"'Last month' — o'tgan zamon: did + ega + oddiy fe'l."}]},{"raqam":13,"sarlavha":"Solishtirish darajalari — Comparatives & Superlatives","daraja":"A2","tayyor":true,"qoida":"📌 Solishtirish — ikki yoki undan ko'p narsani taqqoslash.\n\n1 bo'g'inli so'zlar: -er / the -est\n▸ tall → taller → the tallest (baland)\n▸ cheap → cheaper → the cheapest (arzon)\n▸ fast → faster → the fastest (tez)\n\n2 va undan ko'p bo'g'inli so'zlar: more / the most\n▸ expensive → more expensive → the most expensive (qimmat)\n▸ beautiful → more beautiful → the most beautiful (go'zal)\n\nTartibsiz: good → better → the best; bad → worse → the worst.","ogatish":"🧭 Qadam-baqadam:\n1) Ikki narsami yoki ko'pmi?\n   Ikkita → -er / more, than bilan: She is taller than me.\n   Ko'p → -est / the most: She is the tallest in the class.\n2) So'z qisqami yoki uzunmi? 1 bo'g'in → -er/-est; 2 va undan ko'p → more/the most.\n3) y bilan tugasa → -ier, -iest: happy → happier → the happiest.\n\nEslab qoling: more va -er ni birga ishlatmang ('more taller' xato). Than ni unutmang: taller than me.","misollar":[{"ingliz":"My brother is taller than me.","uzbek":"Akam mendan balandroq."},{"ingliz":"This book is more interesting than that one.","uzbek":"Bu kitob u kitobdan qiziqarliroq."},{"ingliz":"She is the best student in our class.","uzbek":"U sinfimizdagi eng yaxshi o'quvchi."},{"ingliz":"Tashkent is the biggest city in Uzbekistan.","uzbek":"Toshkent O'zbekistondagi eng katta shahar."}],"xato":"O'zbekchada '-roq' (kattaroq) va 'eng' (eng katta) so'zlari bor, inglizchada esa bir sifatga ikki marta belgi qo'yib bo'lmaydi. Xato: 'more taller', 'more better', 'the most tallest'. To'g'risi: 'taller', 'better', 'the tallest'. Solishtirishda than ni ham unutmang: 'taller than me'.","mashqlar":[{"savol":"Mount Everest is ___ mountain in the world.","variantlar":["the highest","most high","higher","high"],"togri":0,"izoh":"Dunyodagi hamma tog'lar ichida eng baland: the + highest."},{"savol":"This test is ___ than the last one.","variantlar":["easy","more easy","easiest","easier"],"togri":3,"izoh":"Ikkita narsa, than bor, qisqa sifat: easy → easier."},{"savol":"Her English is ___ than mine.","variantlar":["best","more good","good","better"],"togri":3,"izoh":"Good tartibsiz sifat: good → better → best."},{"savol":"This is the ___ film I have ever seen.","variantlar":["more boring","most boring","boringest","bored"],"togri":1,"izoh":"'Boring' uzun sifat, eng yuqori daraja: the most boring."}]},{"raqam":14,"sarlavha":"O'tgan davomli zamon — Past Continuous","daraja":"B1","tayyor":true,"qoida":"📌 Past Continuous — o'tmishdagi aniq bir paytda davom etayotgan ish.\n\nTuzilishi: was / were + fe'l-ing\n▸ I was sleeping at 10 p.m. (Soat 22:00 da uxlayotgan edim.)\n▸ They were watching TV at 8. (Ular soat 8 da televizor ko'rayotgan edi.)\n▸ She was cooking all evening. (U kechqurun butun ovqat pishirayotgan edi.)\n\nwas — I, he, she, it bilan; were — you, we, they bilan.","ogatish":"🧭 Qadam-baqadam:\n1) Gap o'tmishdagi aniq paytda davom etayotgan ish haqidami? Ha bo'lsa — Past Continuous.\n2) Egaga qarab was yoki were tanlang: I was / you were.\n3) Fe'lga -ing qo'shing: read → reading; come → coming; run → running.\n4) Qisqa voqea bo'lsa, u Past Simple bo'ladi: I was reading when he came.\n\nEslab qoling: when Past Simple bilan, while Past Continuous bilan keladi: While I was cooking, she called.","misollar":[{"ingliz":"At 8 o'clock yesterday, I was studying.","uzbek":"Kecha soat 8 da men dars qilayotgan edim."},{"ingliz":"She was reading while he was watching TV.","uzbek":"U (ayol) kitob o'qiyotgan paytda, u (erkak) televizor ko'rayotgan edi."},{"ingliz":"I was walking home when it started to rain.","uzbek":"Men uyga piyoda ketayotganimda yomg'ir yog'a boshladi."},{"ingliz":"They weren't listening.","uzbek":"Ular tinglamayotgan edi."}],"xato":"O'zbekchada '-ayotgan edi' shakli bor, lekin ko'pchilik inglizchada oddiy o'tgan zamonni ishlatib yuboradi. Davom etgan harakat uchun was/were + -ing kerak. Shuningdek 'We was' xato, to'g'risi 'We were'.","mashqlar":[{"savol":"I ___ TV when the lights went out. (televizor ko'rish davom etayotgan edi)","variantlar":["was watching","watched","am watching","were watching"],"togri":0,"izoh":"Uzoq harakat (televizor ko'rish) Past Continuous, I bilan was."},{"savol":"They ___ football at 5 o'clock yesterday. (o'sha paytda o'yin davom etayotgan edi)","variantlar":["was playing","were playing","played","are playing"],"togri":1,"izoh":"Aniq paytda davom etgan harakat; They bilan were."},{"savol":"What ___ you doing at 9 p.m. last night?","variantlar":["did","do","were","was"],"togri":2,"izoh":"You bilan were ishlatiladi: What were you doing?"},{"savol":"My sister started her letter at 7:30 and finished at 9:00. At 8 o'clock yesterday she ___ a letter.","variantlar":["wrote","were writing","writes","was writing"],"togri":3,"izoh":"Aniq paytda (soat 8) harakat davom etayotgan edi: was writing."}]},{"raqam":15,"sarlavha":"Modal fe'llar — must / should / have to","daraja":"B1","tayyor":true,"qoida":"📌 Modal fe'llar — majburiyat, maslahat yoki taqiq ma'nosini beradi.\n\nmust — o'zingizning kuchli qaroringiz yoki majburiyatingiz\n▸ I must study more. (Ko'proq o'qishim kerak.)\n▸ You must rest. (Dam olishingiz kerak.)\n\nhave to — tashqi qoida yoki talab\n▸ I have to wear a uniform at work. (Ishda forma kiyishim kerak.)\n▸ She has to get up early. (U erta turishi kerak.)\n\nshould — maslahat\n▸ You should see a doctor. (Shifokorga ko'rinishingiz kerak.)\n\nmustn't — taqiq\n▸ You mustn't smoke here. (Bu yerda chekish mumkin emas.)\n\nModaldan keyin fe'l har doim oddiy shaklda keladi: must go (goes emas).","ogatish":"🧭 Qadam-baqadam:\n1) Gap majburiyatmi, maslahatmi yoki taqiqmi?\n2) Majburiyat o'zingizniki bo'lsa → must. Qoida yoki tashqi talab bo'lsa → have to.\n3) Maslahat → should. Taqiq → mustn't.\n4) Misollar: You must go. / She has to work. / You should rest.\n\nSavol: Must I go? → Yes, you must. / No, you needn't.\nEslab qoling: mustn't — taqiq; don't have to — shart emas. Ularni aralashtirmang.","misollar":[{"ingliz":"You must stop at a red light.","uzbek":"Qizil chiroqda to'xtashingiz shart."},{"ingliz":"You mustn't smoke here.","uzbek":"Bu yerda chekish mumkin emas."},{"ingliz":"I have to get up early tomorrow.","uzbek":"Ertaga erta turishim kerak."},{"ingliz":"You don't have to pay. It's free.","uzbek":"To'lashingiz shart emas. Bepul."},{"ingliz":"You should drink more water.","uzbek":"Ko'proq suv ichishingiz kerak (maslahat)."}],"xato":"O'zbekchada 'kerak emas' va 'mumkin emas' ba'zan bir xil eshitiladi. Inglizchada 'mustn't' — taqiq, 'don't have to' — shart emas. Yana: modal fe'ldan keyin 'to' qo'yilmaydi ('must to go' xato) va 'He must goes' ham xato. To'g'risi: 'He must go'; 'He has to go'.","mashqlar":[{"savol":"You ___ park here. It's forbidden.","variantlar":["mustn't","needn't to","not must","don't have to"],"togri":0,"izoh":"Taqiqlangan (forbidden) → mustn't."},{"savol":"Tomorrow is a holiday, so we ___ go to school.","variantlar":["mustn't","can't to","must","don't have to"],"togri":3,"izoh":"Dam olish kuni — borish shart emas: don't have to."},{"savol":"She has a bad cough. She ___ see a doctor.","variantlar":["must to","should","shoulds","have to"],"togri":1,"izoh":"Maslahat → should. 'She have to' ham xato (has to bo'lardi)."},{"savol":"I ___ work on Sundays. My boss makes me.","variantlar":["has to","must to","have to","should to"],"togri":2,"izoh":"Tashqi majburiyat, I bilan have to."}]},{"raqam":16,"sarlavha":"Hozirgi tugallangan zamon — Present Perfect","daraja":"B1","tayyor":true,"qoida":"📌 Present Perfect — o'tmishda boshlangan yoki o'tgan, lekin hozirgi vaqt bilan bog'liq ish. Asosan: tajriba, natija, o'zgarish.\n\nTuzilishi: have / has + fe'lning 3-shakli\n▸ I have visited London. (Men Londonda bo'lganman — tajriba.)\n▸ She has lost her keys. (U kalitlarini yo'qotib qo'ydi — hozir ham yo'q.)\n▸ They have just arrived. (Ular endigina kelishdi.)\n\nhave — I, you, we, they bilan; has — he, she, it bilan.","ogatish":"🧭 Qadam-baqadam:\n1) Gapda aniq vaqt bormi (yesterday, in 2010)? Ha bo'lsa — Past Simple, bu yerda emas.\n2) Egaga qarab have yoki has tanlang.\n3) Fe'lning 3-shaklini qo'ying: work → worked; go → gone; see → seen.\n4) Inkor: haven't / hasn't. Savol: Have you...? Has she...?\n\nMasalan: I haven't eaten yet. / Has she called? / Have you ever been to Japan?\n\nTez-tez ishlatiladigan so'zlar: ever, never, already, just, yet.","misollar":[{"ingliz":"I have never eaten sushi.","uzbek":"Men hech qachon sushi yemaganman."},{"ingliz":"She has lived here since 2018.","uzbek":"U 2018-yildan beri shu yerda yashaydi."},{"ingliz":"They have just arrived.","uzbek":"Ular hozirgina yetib kelishdi."},{"ingliz":"Have you finished your homework yet?","uzbek":"Uy vazifangizni tugatdingizmi?"}],"xato":"O'zbekchada 'borganman' va 'bordim' ikkalasi ham o'tgan zamon, shuning uchun ko'pchilik farqni sezmaydi. Inglizchada farq katta. Xato: 'I have seen him yesterday' — to'g'risi 'I saw him yesterday'. Xato: 'I am living here for five years' — to'g'risi 'I have lived here for five years'.","mashqlar":[{"savol":"I have never ___ to Japan.","variantlar":["being","be","been","was"],"togri":2,"izoh":"Have + V3. Be fe'lining V3 shakli: been."},{"savol":"She ___ here since 2019.","variantlar":["lives","lived","has lived","is living"],"togri":2,"izoh":"'Since' (boshlanish nuqtasi) bilan Present Perfect: has lived."},{"savol":"We ___ him yesterday.","variantlar":["saw","see","has seen","have seen"],"togri":0,"izoh":"'Yesterday' — aniq o'tgan vaqt, demak Past Simple: saw."},{"savol":"___ you finished your homework yet?","variantlar":["Did","Are","Has","Have"],"togri":3,"izoh":"'Yet' bilan savol Present Perfect'da: Have you finished...?"}]},{"raqam":17,"sarlavha":"Kelasi zamon — will vs going to","daraja":"B1","tayyor":true,"qoida":"📌 will va going to — kelajak haqida gapirishning ikki asosiy usuli.\n\nwill — shu paytda qaror qilish, va'da yoki taxmin\n▸ It's cold. I'll close the window. (Sovuq. Derazani yopaman.)\n▸ I'll help you. (Yordam beraman — va'da.)\n\ngoing to — oldindan reja yoki hozirgi belgiga asoslangan fikr\n▸ I am going to study medicine. (Tibbiyot o'qimoqchiman — reja bor.)\n▸ Look at the clouds! It is going to rain. (Bulutlarga qarang, yomg'ir yog'adi.)\n\nIkkalasidan keyin fe'l oddiy shaklda: will go, is going to go.","ogatish":"🧭 Qadam-baqadam:\n1) Qaror shu paytda qabul qilindimi? → will.\n2) Oldindan reja, niyat yoki hozirgi belgi bormi? → be going to.\n3) Va'da yoki yordam taklifi → will: I'll call you later.\n4) Taxmin: I think she will win. (Menimcha, u yutadi.)\n\nEslab qoling: going to ko'proq oldindan reja uchun, will esa shu zahoti qarorlar uchun tabiiyroq.","misollar":[{"ingliz":"'I'm thirsty.' — 'I'll get you some water.'","uzbek":"'Chanqadim.' — 'Men sizga suv olib kelaman.' (hozirgi qaror)"},{"ingliz":"I'm going to study medicine next year.","uzbek":"Men kelasi yil tibbiyotni o'qimoqchiman. (oldindan reja)"},{"ingliz":"Look at the sky! It's going to rain.","uzbek":"Osmonga qarang! Yomg'ir yog'adigan bo'ldi. (belgi bor)"},{"ingliz":"I think she will win.","uzbek":"Menimcha, u g'alaba qozonadi. (fikr)"}],"xato":"O'zbekchada kelasi zamon bitta shaklda ('boraman'), shuning uchun ko'pchilik hamma joyda faqat 'will' ishlatadi. Oldindan rejalashtirilgan ishda 'going to' tabiiyroq. Yana: 'I will to go' va 'I am going to went' xato. To'g'risi: 'I will go'; 'I am going to go'.","mashqlar":[{"savol":"(oldindan reja) We have bought the tickets. We ___ visit Bukhara next month.","variantlar":["are going to","are going","go to","are going visit"],"togri":0,"izoh":"Chiptalar allaqachon olingan, reja bor: are going to."},{"savol":"(hozir qaror qildingiz) 'We have no bread.' — 'OK, I ___ buy some.'","variantlar":["am going","go to","will","going to"],"togri":2,"izoh":"Qaror gapirayotgan paytda qabul qilindi: will. Boshqa variantlarning shakli noto'g'ri."},{"savol":"(ko'z oldingizda belgi bor) Look! That car ___ crash!","variantlar":["goes to","will","is going to","is going"],"togri":2,"izoh":"Ko'rinib turgan belgi asosida bashorat: is going to."},{"savol":"(fikr, bashorat) I think Uzbekistan ___ win the match.","variantlar":["is going","will","going to","wills"],"togri":1,"izoh":"'I think' bilan fikrga asoslangan bashorat: will win."}]},{"raqam":18,"sarlavha":"1-tur shart gaplar — First Conditional","daraja":"B2","tayyor":true,"qoida":"📌 Haqiqatga aylanishi mumkin bo'lgan kelajak shart (First Conditional).\n\nTuzilishi: If + Present Simple, will + fe'l\n▸ If it rains, I will stay home. (Yomg'ir yog'sa, uyda qolaman.)\n▸ If you study, you will pass. (O'qisangiz, o'tasiz.)\n▸ If she comes, we will go out. (U kelsa, biz chiqamiz.)\n\nMuhim: if qismida will ishlatilmaydi. 'If it will rain' — xato.","ogatish":"🧭 Qadam-baqadam:\n1) If qismida Present Simple: rains, studies, comes.\n2) Asosiy qismda will + oddiy fe'l: will stay, will pass, will go.\n3) Tartibni almashtirish mumkin: I will stay home if it rains. Bunda vergul kerak emas.\n4) will o'rniga can, may, might ham bo'ladi: If it rains, we might cancel.\n\nEslab qoling: bu shakl real, mumkin bo'lgan kelajak uchun. Hozirgi yoki o'tgan haqiqatni bu shakl bilan aytmang.","misollar":[{"ingliz":"If it rains, we will stay at home.","uzbek":"Agar yomg'ir yog'sa, uyda qolamiz."},{"ingliz":"If you study hard, you will pass the exam.","uzbek":"Agar qattiq o'qisangiz, imtihondan o'tasiz."},{"ingliz":"She will be angry if you don't call her.","uzbek":"Agar unga qo'ng'iroq qilmasangiz, u g'azablanadi."},{"ingliz":"If I see him, I will tell him.","uzbek":"Agar uni ko'rsam, unga aytaman."}],"xato":"O'zbekchada shart '-sa' qo'shimchasi bilan ifodalanadi ('yog'sa'), kelasi zamon ma'nosi o'zi bilinadi. Inglizchada ham shart qismida kelajak ma'nosi bor, lekin fe'l hozirgi zamonda turadi. Xato: 'If it will rain, we will stay'. To'g'risi: 'If it rains, we will stay'.","mashqlar":[{"savol":"If it ___ tomorrow, we will cancel the picnic.","variantlar":["rains","would rain","will rain","rain"],"togri":0,"izoh":"Shart qismida will yo'q: it + rains."},{"savol":"If you ___ hard, you will pass the exam.","variantlar":["will study","studied","study","would study"],"togri":2,"izoh":"If dan keyin hozirgi zamon: study."},{"savol":"I will call you if I ___ time.","variantlar":["have","would have","had","will have"],"togri":0,"izoh":"If dan keyin will ishlatilmaydi: if I have time."},{"savol":"If you don't hurry, you ___ the last bus tonight.","variantlar":["would miss","missed","miss","will miss"],"togri":3,"izoh":"Natija qismi: will + fe'l."}]},{"raqam":19,"sarlavha":"Majhul nisbat — Passive Voice","daraja":"B2","tayyor":true,"qoida":"📌 Majhul nisbat — harakatni kim qilgani emas, nima bo'lgani muhim bo'lganda ishlatiladi. Gap ob'ekt bilan boshlanadi.\n\nTuzilishi: ob'ekt + be-fe'li + 3-shakl\n▸ The letter was written yesterday. (Xat kecha yozilgan.)\n▸ The bridge is built by workers. (Ko'prik ishchilar tomonidan quriladi.)\n▸ Coffee is grown in Brazil. (Qahva Braziliyada yetishtiriladi.)\n\nKim qilgani aytilsa, by bilan qo'shiladi, lekin ko'pincha tushirib qoldiriladi.","ogatish":"🧭 Qadam-baqadam:\n1) Ob'ektni gap boshiga qo'ying: the letter, the house, the cake.\n2) Zamonga qarab be-fe'lini tanlang: is/are (hozir), was/were (o'tgan), will be (kelajak), has been (hozirgacha).\n3) Asosiy fe'lning 3-shaklini qo'ying: written, built, made, taken.\n4) Kim qilgani aytilsa, by + ega: The book was written by Ali.\n\nMasalan: The cake was made by my mother. / The house will be painted next week. / The car has been repaired.\n\nEslab qoling: Ali wrote the book → The book was written by Ali.","misollar":[{"ingliz":"This bridge was built in 1995.","uzbek":"Bu ko'prik 1995-yilda qurilgan."},{"ingliz":"English is spoken all over the world.","uzbek":"Ingliz tilida butun dunyoda gaplashiladi."},{"ingliz":"The documents will be sent tomorrow.","uzbek":"Hujjatlar ertaga yuboriladi."},{"ingliz":"The window was broken by the boy.","uzbek":"Deraza bola tomonidan sindirilgan."}],"xato":"O'zbekchada majhul nisbat fe'lga -il / -in qo'shimchasi bilan yasaladi ('qurildi', 'yoziladi'). Inglizchada faqat V3 yetmaydi, oldidan be kerak. Xato: 'The house built in 1990'. To'g'risi: 'The house was built in 1990'. Yana: happen, arrive, die kabi fe'llar passivga o'tmaydi ('was happened' xato).","mashqlar":[{"savol":"This mosque ___ in the 15th century.","variantlar":["is built","has build","was built","built"],"togri":2,"izoh":"O'tgan zamon, majhul nisbat: was + V3."},{"savol":"Many languages ___ in Uzbekistan.","variantlar":["speak","spoke","is spoken","are spoken"],"togri":3,"izoh":"Many languages ko'plik, hozirgi zamon: are + V3."},{"savol":"The report ___ tomorrow.","variantlar":["will be sent","sent","will send","is sending"],"togri":0,"izoh":"Kelasi zamon majhul nisbat: will be + V3."},{"savol":"The thief ___ by the police yesterday.","variantlar":["caught","is caught","was caught","catches"],"togri":2,"izoh":"Yesterday va by the police: was caught."}]},{"raqam":20,"sarlavha":"Ko'chirma gap — Reported Speech","daraja":"B2","tayyor":true,"qoida":"📌 Ko'chirma gap — birovning gapini o'z so'zlaringiz bilan aytish. Gap orqaga suriladi: zamon bir pog'ona orqaga o'tadi.\n▸ 'I am tired.' → He said he was tired. (U charchaganini aytdi.)\n▸ 'I will come.' → She said she would come. (U kelishini aytdi.)\n▸ 'I have finished.' → They said they had finished. (Ular tugatganlarini aytdi.)\n\nVaqt va o'rin ham o'zgaradi:\n▸ today → that day · yesterday → the day before\n▸ here → there · now → then","ogatish":"🧭 Qadam-baqadam:\n1) Asosiy gapda said yoki told bo'ladi. Told bo'lsa, ob'ekt kerak: told me.\n2) Zamonni orqaga suring: am/is → was/were; will → would; can → could; have → had; Past Simple → Past Perfect.\n3) Olmosh va vaqtni o'zgartiring: I → he/she; my → his/her; today → that day.\n4) Savol bo'lsa: He asked where I lived.\n\nEslab qoling: agar gap umumiy haqiqat bo'lsa (Yer aylanadi), zamon o'zgarmasligi mumkin: He said the Earth goes around the Sun.","misollar":[{"ingliz":"'I am tired,' he said. → He said he was tired.","uzbek":"'Charchadim,' dedi u. → U charchaganini aytdi."},{"ingliz":"'I will call you,' she said. → She said she would call me.","uzbek":"'Sizga qo'ng'iroq qilaman,' dedi u. → U menga qo'ng'iroq qilishini aytdi."},{"ingliz":"'Do you like tea?' he asked. → He asked if I liked tea.","uzbek":"'Choy yoqadimi?' deb so'radi u. → U menga choy yoqadimi, deb so'radi."},{"ingliz":"'I bought a car,' Ali said. → Ali said he had bought a car.","uzbek":"'Mashina sotib oldim,' dedi Ali. → Ali mashina sotib olganini aytdi."}],"xato":"O'zbekchada ko'chirma gapni egalik qo'shimchalari bilan oson aytib beramiz va zamon deyarli o'zgarmaydi. Inglizchada zamon orqaga suriladi. Xato: 'He said he is tired' (hozir ham to'g'ri bo'lsa mumkin, lekin o'rganish uchun qoida: was). Savolda ham xato ko'p: 'He asked where do I live' — to'g'risi 'He asked where I lived'.","mashqlar":[{"savol":"(qoida bo'yicha zamonni orqaga suring) 'I am hungry,' she said. → She said she ___ hungry.","variantlar":["was","is","has been","were"],"togri":0,"izoh":"Am → was, olmosh I → she."},{"savol":"(qoida bo'yicha) 'I will help you,' he said. → He said he ___ help me.","variantlar":["can","would","will","shall"],"togri":1,"izoh":"Will → would."},{"savol":"(qoida bo'yicha) 'I bought a car,' Ali said. → Ali said he ___ a car.","variantlar":["has bought","buys","had bought","bought"],"togri":2,"izoh":"Past Simple → Past Perfect: had bought."},{"savol":"'Do you like tea?' he asked me. → He asked me ___ tea.","variantlar":["do I like","that I liked","if did I like","if I liked"],"togri":3,"izoh":"Ha-yo'q savolda if + oddiy tartib, zamon orqaga: if I liked."}]},{"raqam":21,"sarlavha":"Sanaladigan / sanalmaydigan — some / any / much / many","daraja":"A2","tayyor":true,"qoida":"📌 some, any, much, many — \"bir nechta\" yoki \"ko'p\" ma'nosini beradi, lekin ishlatilishi turlicha.\n\nsome — ijobiy gapda:\n▸ I have some friends. (Do'stlarim bor.)\n▸ There is some milk in the fridge. (Muzlatgichda sut bor.)\n▸ She bought some apples. (U olma sotib oldi.)\n\nany — savol va inkor gapda:\n▸ Do you have any friends? (Do'stlaringiz bormi?)\n▸ I don't have any money. (Pulim yo'q.)\n▸ Are there any questions? (Savollar bormi?)\n\nmany — sanaladigan narsa uchun: many books, many cars.\nmuch — sanab bo'lmaydigan narsa uchun: much time, much water.","ogatish":"🧭 Qadam-baqadam:\n1) Gap ijobiymi, yoki savol va inkormi? Ijobiy → some; savol va inkor → any.\n2) Narsani sanash mumkinmi (books, cars)? Ha → many; yo'q (water, time, money) → much.\n3) 'a lot of' ikkalasi uchun ham ishlaydi: a lot of books, a lot of water.\n\nMasalan: We have some time. / Do we have much time? / There are many students here.","misollar":[{"ingliz":"There are some apples on the table.","uzbek":"Stol ustida bir nechta olma bor."},{"ingliz":"I don't have any money.","uzbek":"Mening pulim yo'q."},{"ingliz":"How many students are in your class?","uzbek":"Sinfingizda nechta o'quvchi bor?"},{"ingliz":"How much time do we have?","uzbek":"Qancha vaqtimiz bor?"}],"xato":"O'zbekchada 'ko'p' bitta so'z, inglizchada esa sanaladigan va sanalmaydigan otlar uchun har xil so'z kerak. Xato: 'much students', 'many water'. Yana bir tuzoq: o'zbekchada sanaladigan tuyulgan so'zlar inglizchada sanalmaydi (advice, information, news). Xato: 'an advice', 'informations'. To'g'risi: 'some advice', 'some information'.","mashqlar":[{"savol":"There isn't ___ milk in the fridge.","variantlar":["any","many","a","some"],"togri":0,"izoh":"Inkor gapda any ishlatiladi; milk sanalmaydi, shuning uchun many va a mos kelmaydi."},{"savol":"How ___ people came to the party?","variantlar":["much","any","some","many"],"togri":3,"izoh":"People sanaladi, savolda many ishlatiladi: How many people?"},{"savol":"I need ___ advice.","variantlar":["some","an","a few","many"],"togri":0,"izoh":"Advice sanalmaydigan ot: some advice (an advice yoki many advice emas)."},{"savol":"We don't have ___ time.","variantlar":["some","much","many","a lot"],"togri":1,"izoh":"Time sanalmaydi, inkorda much ishlatiladi: We don't have much time."}]},{"raqam":22,"sarlavha":"To'ldiruvchi olmoshlar — me / him / her / us / them","daraja":"A2","tayyor":true,"qoida":"📌 Ob'ekt olmoshlari — fe'ldan keyin keladi va ism o'rnini bosadi (kimni yoki nimani, kimga yoki nimaga).\n\nme — meni / menga · you — sizni / sizga · him — uni (erkak)\nher — uni (ayol) · it — uni (narsa, hayvon) · us — bizni / bizga · them — ularni / ularga\n\n▸ I see her. (Men uni ko'raman.)\n▸ They help us. (Ular bizga yordam beradi.)\n▸ Give it to me. (Buni menga bering.)","ogatish":"🧭 Qadam-baqadam:\n1) Fe'ldan keyin kim yoki nima kerak? Ism o'rniga olmosh qo'ying.\n2) Ega olmoshlari (I, he, she, we, they) fe'l oldida, ob'ekt olmoshlari fe'l orqasida.\n3) Tekshirish: 'I see she' xato, to'g'risi 'I see her'.\n\nMasalan: Call me later. / I trust him. / Please wait for us.\n\nEslab qoling: predlogdan keyin ham ob'ekt olmoshi ishlatiladi: to me, for us.","misollar":[{"ingliz":"Can you help me, please?","uzbek":"Iltimos, menga yordam bera olasizmi?"},{"ingliz":"I see him every day.","uzbek":"Men uni har kuni ko'raman."},{"ingliz":"She is talking to us.","uzbek":"U biz bilan gaplashyapti."},{"ingliz":"These books are interesting. I read them often.","uzbek":"Bu kitoblar qiziqarli. Men ularni tez-tez o'qiyman."}],"xato":"O'zbekchada 'meni, menga, men bilan' qo'shimchalar bilan ifodalanadi. Inglizchada esa bu uchun alohida so'z bor. Xato: 'I like she', 'Give I the book', 'He called I'. To'g'risi: 'I like her', 'Give me the book', 'He called me'.","mashqlar":[{"savol":"Where is Ali? I want to talk to ___.","variantlar":["himself","he","him","his"],"togri":2,"izoh":"Predloqdan (to) keyin to'ldiruvchi shakli kerak: him."},{"savol":"My parents are here. I love ___ very much.","variantlar":["they","their","them","theirs"],"togri":2,"izoh":"Fe'ldan (love) keyin: them."},{"savol":"Can you help ___? I don't understand.","variantlar":["my","me","mine","I"],"togri":1,"izoh":"Fe'ldan (help) keyin: me."},{"savol":"Anna is my sister. I often call ___.","variantlar":["she","hers","he","her"],"togri":3,"izoh":"Fe'ldan (call) keyin: her."}]},{"raqam":23,"sarlavha":"Takrorlanish ravishlari — always / usually / often / never","daraja":"A2","tayyor":true,"qoida":"📌 Takrorlanish ravishlari — ish qanchalik tez-tez bo'lishini bildiradi (100% dan 0% gacha).\n\nalways — doim (100%) · usually — odatda · often — ko'pincha\nsometimes — ba'zan · rarely / seldom — kamdan-kam · never — hech qachon (0%)\n\n▸ I always wake up early. (Men doim erta uyg'onaman.)\n▸ She is never late. (U hech qachon kechikmaydi.)\n▸ We sometimes go to the park. (Biz ba'zan bog'ga boramiz.)","ogatish":"🧭 Qadam-baqadam:\n1) Ish qanchalik tez-tez bo'ladi? Ro'yxatdan mos so'z tanlang.\n2) Odatda fe'l oldiga qo'yiladi: I often read. / He never lies.\n3) Be-fe'li bo'lsa, ravish be dan keyin keladi: She is always happy. / They are rarely late.\n4) Savolda ravish egadan keyin keladi: Do you often travel?\n\nEslab qoling: 'never' o'zi inkor ma'nosini beradi, shuning uchun 'not' bilan birga ishlatmang: I never go (I don't never go emas).","misollar":[{"ingliz":"I always drink tea in the morning.","uzbek":"Men ertalab doim choy ichaman."},{"ingliz":"She is never late for work.","uzbek":"U ishga hech qachon kech qolmaydi."},{"ingliz":"We sometimes go to the park.","uzbek":"Biz ba'zan bog'ga boramiz."},{"ingliz":"How often do you visit your grandmother?","uzbek":"Buvingizni qanchalik tez-tez ko'rgani borasiz?"}],"xato":"O'zbekchada 'doim', 'ba'zan' gapning istalgan joyiga qo'yiladi. Inglizchada joyi qat'iy. Xato: 'I go always to school', 'She plays usually football'. To'g'risi: 'I always go to school', 'She usually plays football'.","mashqlar":[{"savol":"She ___ late for class.","variantlar":["never is","does never be","never be","is never"],"togri":3,"izoh":"To be fe'li bor, ravish undan keyin turadi: is never."},{"savol":"(0%) I ___ drink coffee in the evening.","variantlar":["usually","often","always","never"],"togri":3,"izoh":"0% — never."},{"savol":"My brother ___ to the gym on Sundays.","variantlar":["goes usually to","goes usually","usually goes","usually go"],"togri":2,"izoh":"Ravish asosiy fe'ldan oldin keladi; he/brother bilan goes."},{"savol":"___ do you visit your grandmother? — Once a week.","variantlar":["How much","How long","How often","How many"],"togri":2,"izoh":"Javob takrorlanishni bildiryapti (once a week): How often."}]},{"raqam":24,"sarlavha":"Vaqt predloglari — in / on / at","daraja":"A2","tayyor":true,"qoida":"📌 Vaqt predloglari — ish qachon bo'lganini ko'rsatadi. Asosiy uchtasi: at, on, in.\n\nat — aniq vaqt: at 7 o'clock, at noon, at night\non — kun va sana: on Monday, on 5 May, on my birthday\nin — uzun davr: in 2025, in July, in winter, in the morning\n\n▸ The lesson starts at 9 o'clock. (Dars soat 9 da boshlanadi.)\n▸ My birthday is on 12 March. (Tug'ilgan kunim 12 martda.)\n▸ We go on holiday in August. (Biz avgustda dam olishga boramiz.)","ogatish":"🧭 Qadam-baqadam:\n1) Aniq soat yoki vaqt bormi (at 5, at noon)? → at.\n2) Kun yoki sana bormi (Monday, 5 May)? → on.\n3) Oy, yil, fasl yoki qism bormi (in July, in 2025, in the morning)? → in.\n\nMasalan: at midnight / on Sunday morning / in the evening.\n\nEslab qoling: at night (tunda), lekin in the morning (ertalab). Bu istisnolar, yodda tuting.","misollar":[{"ingliz":"The lesson starts at 9 o'clock.","uzbek":"Dars soat 9 da boshlanadi."},{"ingliz":"My birthday is on 12 March.","uzbek":"Mening tug'ilgan kunim 12-martda."},{"ingliz":"We go on holiday in August.","uzbek":"Biz avgustda ta'tilga chiqamiz."},{"ingliz":"I like to read at night.","uzbek":"Men kechasi kitob o'qishni yaxshi ko'raman."}],"xato":"O'zbekchada vaqt qo'shimchalar bilan ('soat 9 da', 'dushanbada', 'avgustda') beriladi va farq sezilmaydi. Inglizchada esa har birining o'z predlogi bor. Xato: 'in Monday', 'at July', 'on 2024'. To'g'risi: 'on Monday', 'in July', 'in 2024'.","mashqlar":[{"savol":"The lesson starts ___ 9 o'clock.","variantlar":["on","by","at","in"],"togri":2,"izoh":"Aniq soat bilan at ishlatiladi."},{"savol":"My birthday is ___ 12 March.","variantlar":["in","on","at","to"],"togri":1,"izoh":"Sana bilan on ishlatiladi."},{"savol":"We usually go on holiday ___ August.","variantlar":["on","to","at","in"],"togri":3,"izoh":"Oy bilan in ishlatiladi."},{"savol":"I like to read ___ night.","variantlar":["at","by","in","on"],"togri":0,"izoh":"'At night' — istisno, in the night emas."}]},{"raqam":25,"sarlavha":"Fe'l + -ing yoki to + fe'l (like doing / want to do)","daraja":"A2","tayyor":true,"qoida":"📌 Ba'zi fe'llardan keyin -ing, ba'zilaridan keyin to + fe'l keladi.\n\n-ing keladigan fe'llar: enjoy, finish, avoid, mind, suggest, practice.\n▸ I enjoy reading. (Men o'qishdan zavqlanaman.)\n▸ She finished cooking. (U ovqat pishirishni tugatdi.)\n▸ He suggested going out. (U chiqishni taklif qildi.)\n\nto + fe'l keladigan fe'llar: want, decide, plan, hope, learn, agree, promise.\n▸ I want to travel. (Men sayohat qilmoqchiman.)\n▸ We decided to cancel the trip. (Biz sayohatni bekor qilishga qaror qildik.)\n▸ She is learning to drive. (U mashina haydashni o'rganyapti.)\n\nIkkalasi ham mumkin, ma'no farqi bilan: like, love, start, begin.","ogatish":"🧭 Qadam-baqadam:\n1) Asosiy fe'l qaysi guruhda? Ro'yxatga qarang.\n2) -ing guruhida bo'lsa, keyin -ing: finish working, avoid smoking.\n3) to guruhida bo'lsa, keyin to + fe'l: decide to go, hope to see.\n4) Ikkalasi mumkin bo'lsa, ma'nosiga qarang: I like reading (umuman yoqadi) / I like to read (bu safar o'qishni xohlayman).\n\nEslab qoling: ro'yxatni 20–30 ta so'z bilan yodlash osonroq.","misollar":[{"ingliz":"I enjoy learning English.","uzbek":"Men ingliz tilini o'rganishdan zavq olaman."},{"ingliz":"She wants to become a doctor.","uzbek":"U shifokor bo'lmoqchi."},{"ingliz":"He finished doing his homework at eight.","uzbek":"U uy vazifasini soat sakkizda tugatdi."},{"ingliz":"We decided to cancel the trip.","uzbek":"Biz sayohatni bekor qilishga qaror qildik."}],"xato":"O'zbekchada ikkinchi fe'l bitta shaklda ('o'qishni xohlayman', 'o'qishdan zavqlanaman'). Inglizchada esa fe'lga qarab shakl o'zgaradi. Xato: 'I want go', 'I enjoy to read', 'She decided leaving'. To'g'risi: 'I want to go', 'I enjoy reading', 'She decided to leave'.","mashqlar":[{"savol":"I enjoy ___ English.","variantlar":["learn","learned","learning","to learn"],"togri":2,"izoh":"Enjoy dan keyin -ing: enjoy learning."},{"savol":"She wants ___ a doctor.","variantlar":["become","became","becoming","to become"],"togri":3,"izoh":"Want dan keyin to + fe'l: wants to become."},{"savol":"He finished ___ his homework at 8.","variantlar":["doing","does","to do","do"],"togri":0,"izoh":"Finish dan keyin -ing: finished doing."},{"savol":"We decided ___ the trip.","variantlar":["cancel","to cancel","cancelling","cancelled"],"togri":1,"izoh":"Decide dan keyin to + fe'l: decided to cancel."}]},{"raqam":26,"sarlavha":"Egalik kelishigi — 's va whose","daraja":"A2","tayyor":true,"qoida":"📌 Egalik kelishigi — 's va whose. Narsa kimga tegishli ekanini ko'rsatadi.\n\nOdam uchun 's: Ali's book (Alining kitobi) · my mother's car (onamning mashinasi)\nKo'plik -s bilan tugasa, faqat ': the students' books (talabalarning kitoblari)\nKo'plik -s bilan tugamasa, 's: the children's toys (bolalarning o'yinchoqlari)\n\nwhose — \"kimniki\" savoli: Whose car is this? (Bu kimning mashinasi?)","ogatish":"🧭 Qadam-baqadam:\n1) Ega kim yoki nima? Ismi yoki odam so'zi oldiga qo'ying.\n2) Ega ko'plik bo'lib, -s bilan tugasa, faqat ': the teachers' room.\n3) Ega ko'plik bo'lib, -s bilan tugamasa, 's: the men's room.\n4) Narsalar uchun ko'pincha of ishlatiladi: the door of the house.\n\nMasalan: This is my brother's car. / The dogs' bowls are empty. / The door of the room is blue.\n\nEslab qoling: 'Ali's' — Alining narsasi; 'Ali and his brother's' — ikki kishining umumiy narsasi.","misollar":[{"ingliz":"This is my brother's car.","uzbek":"Bu mening akamning mashinasi."},{"ingliz":"The children's toys are on the floor.","uzbek":"Bolalarning o'yinchoqlari polda."},{"ingliz":"The door of the room is blue.","uzbek":"Xonaning eshigi ko'k."},{"ingliz":"Whose phone is this? — It's Madina's.","uzbek":"Bu kimning telefoni? — Madinaniki."}],"xato":"O'zbekchada egalik '-ning' va '-i' bilan beriladi ('akamning mashinasi'). Inglizchada tartib teskari: egasi oldin, narsa keyin. Xato: 'the car my brother', 'Alis book'. To'g'risi: 'my brother's car', 'Ali's book', 'the door of the room' (narsalar uchun odatda of).","mashqlar":[{"savol":"___ phone is this? — It's Madina's.","variantlar":["Whose","Who","What","Who's"],"togri":0,"izoh":"Kimning narsasi ekanini so'rash uchun Whose."},{"savol":"The ___ toys are on the floor. (ko'p bola)","variantlar":["childrens'","children's","childs","children"],"togri":1,"izoh":"Children ko'plik, lekin -s bilan tugamaydi, shuning uchun 's: children's."},{"savol":"The colour ___ is blue.","variantlar":["house of","houses","the house's","of the house"],"togri":3,"izoh":"Narsaning rangi uchun of: the colour of the house."},{"savol":"That is my ___ room. (bitta opa)","variantlar":["sisters","sister","sisters'","sister's"],"togri":3,"izoh":"Bitta egasi bor: sister's."}]},{"raqam":27,"sarlavha":"Avvalgi odat — used to","daraja":"B1","tayyor":true,"qoida":"📌 used to — o'tmishda muntazam qilingan, lekin hozir qilinmaydigan odat yoki holat.\n\n▸ I used to play football when I was young. (Yoshligimda futbol o'ynardim.)\n▸ She used to live in Bukhara. (U Buxoroda yashardi.)\n▸ We used to visit them every summer. (Har yozda ularnikiga borardik.)\n\nInkor: didn't use to · Savol: Did you use to...?","ogatish":"🧭 Qadam-baqadam:\n1) Gap o'tmishdagi odat haqidami va hozir bu yo'qmi? Ha bo'lsa — used to.\n2) used to dan keyin fe'lni oddiy shaklda yozing: used to go (went emas).\n3) Inkor: didn't use to. Savol: Did ... use to?\n\nMasalan: He didn't use to smoke. / Did you use to swim here? / We used to go to school on foot.\n\nEslab qoling: 'used to' — odat (hozir yo'q); 'be used to' — odatlanish (hozir ham shunday): I am used to getting up early.","misollar":[{"ingliz":"I used to live in Samarkand.","uzbek":"Men ilgari Samarqandda yashardim."},{"ingliz":"We used to play chess every evening.","uzbek":"Biz ilgari har oqshom shaxmat o'ynardik."},{"ingliz":"Did you use to smoke?","uzbek":"Siz ilgari chekarmidingiz?"},{"ingliz":"I am used to getting up early.","uzbek":"Men erta turishga ko'nikkanman."}],"xato":"O'zbekchada 'o'ynardim' shakli bor, lekin ko'pchilik inglizchada oddiy o'tgan zamonni ishlatadi. Xato: 'I used to going', 'I didn't used to play'. To'g'risi: 'I used to go', 'I didn't use to play'. Savol va inkorda d yo'qoladi.","mashqlar":[{"savol":"I ___ live in Samarkand, but now I live in Tashkent.","variantlar":["used to","am used to","was used","use to"],"togri":0,"izoh":"Avval shunday edi, endi yo'q: used to + fe'l."},{"savol":"Did you ___ play chess as a child?","variantlar":["used to","using to","used","use to"],"togri":3,"izoh":"Savolda did bor, shuning uchun use to (d siz)."},{"savol":"I am used to ___ up early.","variantlar":["getting","get","to get","got"],"togri":0,"izoh":"Be used to dan keyin -ing: getting."},{"savol":"When I was a child, we ___ every summer at my grandparents' house.","variantlar":["use to stay","are used to staying","used to stay","used staying"],"togri":2,"izoh":"O'tmishdagi takrorlangan odat: used to stay."}]},{"raqam":28,"sarlavha":"O'tgan tugallangan zamon — Past Perfect","daraja":"B1","tayyor":true,"qoida":"📌 Past Perfect — o'tmishda ikki voqeadan oldingisi. Qaysi biri oldin bo'lganini ko'rsatadi.\n\nTuzilishi: had + fe'lning 3-shakli\n▸ When I arrived, the train had already left. (Men kelganimda, poyezd allaqachon ketgan edi.)\n▸ She had studied English before she moved to London. (Londonga ko'chishdan oldin u ingliz tilini o'rgangan edi.)\n▸ I couldn't get in because I had left my key at home. (Kalitimni uyda qoldirganim uchun kira olmadim.)\n\nhad — hamma egalar bilan bir xil: I had, she had, they had.","ogatish":"🧭 Qadam-baqadam:\n1) Gapda ikki o'tmish voqea bormi? Qaysi biri oldin bo'lgan?\n2) Oldingisi uchun had + 3-shakl. Keyingisi uchun Past Simple.\n3) Ko'pincha before, after, when, b
