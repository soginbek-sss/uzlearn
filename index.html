"___ in a hurry, he forgot his keys.","variantlar":["Being","Been","Be","To be"],"togri":0,"izoh":"Ibora: being in a hurry — egasi 'he'."},{"savol":"___ by the teacher, the students passed the test.","variantlar":["Prepared","Preparing","Prepare","To prepare"],"togri":0,"izoh":"Majhul ma'no — tayyorlangan: prepared."},{"savol":"___ the bus, I realised I had lost my wallet.","variantlar":["Missing","Missed","Miss","To miss"],"togri":0,"izoh":"Aktiv: sog'indim (bus) — missing."}]},{"raqam":65,"sarlavha":"Bo'lish gaplar (cleft sentences): It was ... that, What I need is","daraja":"C1","tayyor":true,"qoida":"📌 Gapning muhim qismini ta'kidlash uchun ikki tuzilma:\n\nIt ... that — ta'kidlangan qism it + is/was dan keyin keladi:\n▸ It was Ali who broke the window. (Oynani sindirgan — Ali edi.)\n▸ It was in Samarkand that we first met. (Biz birinchi marta Samarqandda uchrashganmiz.)\n\nWhat ... is — \"menga kerak narsa\":\n▸ What I need is time. (Menga kerak narsa — vaqt.)\n▸ What surprised me was how quickly she learned. (Meni hayron qoldirgan — u qanchalik tez o'rganganligi.)","ogatish":"2 qadam:\n1) Qaysi qismni ta'kidlamoqchisiz (kim, nima, qachon, qayerda)?\n2) It is/was + ta'kidlangan qism + that/who + qolgan gap. Yoki: What + gap + is + ta'kidlangan qism.\n\nEslab qoling: bu tuzilma nutqda va yozuvda ta'kid uchun juda kuchli.","misollar":[{"ingliz":"It was Ali who called me.","uzbek":"Meni aynan Ali chaqirdi."},{"ingliz":"It was in Samarkand that we first met.","uzbek":"Biz birinchi marta aynan Samarqandda uchrashdik."},{"ingliz":"What I need is a holiday.","uzbek":"Menga kerak narsa — dam olish."},{"ingliz":"What surprised me was how quickly she learned.","uzbek":"Meni hayratga solgan narsa — u qanchalik tez o'rganganligi edi."}],"xato":"'It was Ali that called' emas, odam uchun 'who' ham to'g'ri. Joy uchun 'where' yoki 'that' ishlatilishi mumkin.","mashqlar":[{"savol":"It was my sister ___ helped me move.","variantlar":["who","which","what","when"],"togri":0,"izoh":"Odam — it was ... who."},{"savol":"___ I want most is some peace and quiet.","variantlar":["What","Which","That","Who"],"togri":0,"izoh":"What I want most is ... (urg'u)."},{"savol":"It was in 2020 ___ the company was founded.","variantlar":["that","what","who","which"],"togri":0,"izoh":"Vaqt uchun 'that' ishlatiladi."},{"savol":"___ we really need is more time.","variantlar":["What","Who","Which","Where"],"togri":0,"izoh":"What we need is ... (urg'u)."}]},{"raqam":66,"sarlavha":"Subjunctive: suggest / recommend / insist that + fe'l","daraja":"C1","tayyor":true,"qoida":"📌 suggest, recommend, insist kabi fe'llardan keyin that bilan gap keladi, va fe'l egaga qaramay oddiy shaklda bo'ladi (subjunctive).\n\n▸ I suggest that he go now. (Hozir ketishini tavsiya qilaman.)\n▸ They recommended that she see a doctor. (Shifokorga ko'rinishini tavsiya qilishdi.)\n▸ He insisted that we wait. (Biz kutishimiz kerakligini talab qildi.)\n\nBunda he goes emas, go. Fe'l o'zgarmaydi.","ogatish":"2 qadam:\n1) Gapda suggest, recommend, insist, demand bormi? Ha → that dan keyin.\n2) Egadan keyin fe'lni oddiy shaklda yozing (go, see, wait). -s yoki -ed qo'shilmaydi.\n\nMasalan: It is essential that everyone arrive on time. / The teacher demanded that he apologize.\n\nEslab qoling: ingliz tilida bu rasmiy va to'g'ri uslub. Oddiy nutqda 'should' ham ishlatiladi.","misollar":[{"ingliz":"I suggest that he be careful.","uzbek":"Men unga ehtiyot bo'lishni maslahat beraman."},{"ingliz":"The doctor recommended that she rest for a week.","uzbek":"Shifokor unga bir hafta dam olishni tavsiya qildi."},{"ingliz":"They insisted that we stay for dinner.","uzbek":"Ular kechki ovqatga qolishimizni talab qilishdi."},{"ingliz":"It is essential that everyone arrive on time.","uzbek":"Har kim vaqtida kelishi muhim."}],"xato":"'I suggest that he is careful' yoki 'he goes' — noto'g'ri. Shu fe'llardan keyin oddiy shakl: 'that he be'.","mashqlar":[{"savol":"The teacher suggested that everyone ___ the book by Friday.","variantlar":["read","reads","reading","will read"],"togri":0,"izoh":"Suggest that + base form: read."},{"savol":"They insisted that the meeting ___ postponed.","variantlar":["be","is","will be","was"],"togri":0,"izoh":"Insist that + be."},{"savol":"I recommend that you ___ a doctor as soon as possible.","variantlar":["see","sees","will see","seeing"],"togri":0,"izoh":"Recommend that + base form: see."},{"savol":"It is vital that he ___ the rules.","variantlar":["follow","follows","followed","will follow"],"togri":0,"izoh":"Vital/essential that + base form: follow."}]},{"raqam":67,"sarlavha":"Ta'kidlash: do / does / did bilan","daraja":"B2","tayyor":true,"qoida":"📌 Ta'kid uchun do / does / did ishlatiladi. Odatda gapni ishonarli qilish yoki e'tirozni rad etish uchun.\n\n▸ I do like this song. (Men bu qo'shiqni haqiqatan yoqtiraman.)\n▸ He does know the answer. (U javobni haqiqatan biladi.)\n▸ She did finish the work. (U ishni haqiqatan tugatdi.)","ogatish":"2 qadam:\n1) Gapda ta'kid kerakmi (haqiqatan, albatta)? Ha → do/does/did.\n2) Ega bo'yicha: I, you, we, they → do; he, she, it → does; o'tmish → did. Keyin fe'l oddiy shaklda: does know, did finish.\n\nMasalan: Do come in! We're waiting for you. / He did finish the report on time.\n\nEslab qoling: be-fe'li bilan do ishlatilmaydi: I am sure (I do am sure emas).","misollar":[{"ingliz":"I do like your new car.","uzbek":"Yangi mashinangiz haqiqatan ham yoqadi."},{"ingliz":"She does work hard, you know.","uzbek":"U haqiqatan ko'p ishlaydi, bilasizmi."},{"ingliz":"Do come in! We're waiting for you.","uzbek":"Marhamat, kiring! Sizni kutyapmiz."},{"ingliz":"He did finish the report on time.","uzbek":"U hisobotni haqiqatan vaqtida tugatdi."}],"xato":"'I do likes' — noto'g'ri. 'Do' dan keyin fe'l oddiy shaklda: 'I do like'.","mashqlar":[{"savol":"I ___ believe you, but it's hard to accept.","variantlar":["do","am","did","will"],"togri":0,"izoh":"Ta'kid — do believe."},{"savol":"She ___ look tired today.","variantlar":["does","is","did","has"],"togri":0,"izoh":"Ta'kid — does look (ijobiy gap, hozirgi zamon)."},{"savol":"He ___ apologise, but he didn't mean it.","variantlar":["did","does","do","is"],"togri":0,"izoh":"O'tgan zamon ta'kidi — did apologise."},{"savol":"___ sit down; make yourself comfortable.","variantlar":["Do","Does","Did","Are"],"togri":0,"izoh":"Iltimos ta'kidi — Do sit down."}]},{"raqam":68,"sarlavha":"Ravish o'rni: frequency, manner, certainty","daraja":"B2","tayyor":true,"qoida":"📌 Ravish gapning qayerida turishini bilish kerak:\n\nTez-tez (always, often, never) — fe'l oldida:\n▸ I often go to the library. (Ko'pincha kutubxonaga boraman.)\n\nQanday qilinishi (quickly, carefully, well) — fe'l orqasida:\n▸ He spoke quietly. (U pastdan gapirdi.)\n▸ She speaks English fluently. (U ingliz tilini ravon gapiradi.)\n\nIshonch (probably, definitely, certainly) — fe'l oldida:\n▸ She will probably come. (U ehtimol keladi.)\n\nJoy va vaqt — gap oxirida:\n▸ We met yesterday in the park. (Biz kecha bog'da uchrashdik.)","ogatish":"2 qadam:\n1) Ravish nimani bildiradi? Tez-tez yoki ishonch → fe'l oldida; qanday → fe'l orqasida; joy yoki vaqt → gap oxirida.\n2) Be-fe'li bo'lsa, ravish be dan keyin: He is usually late; She was carefully dressed.\n\nEslab qoling: ko'p ravishlar -ly bilan tugaydi: quick → quickly.","misollar":[{"ingliz":"I always check my email.","uzbek":"Men har doim pochtamni tekshiraman."},{"ingliz":"She is always late on Mondays.","uzbek":"U dushanbalarda har doim kechikadi."},{"ingliz":"She speaks English fluently.","uzbek":"U ingliz tilida ravon gaplashadi."},{"ingliz":"He will probably call you tonight.","uzbek":"U bugun kechqurun sizga qo'ng'iroq qiladi, ehtimol."}],"xato":"'I check always my email' — noto'g'ri. Chastota ravishi fe'l oldida: 'always check'.","mashqlar":[{"savol":"We ___ go to the gym on Saturdays.","variantlar":["usually","usual","usual to","are usually"],"togri":0,"izoh":"Chastota — usually fe'l oldida."},{"savol":"She ___ is ready on time.","variantlar":["is always","always is","is","is alway"],"togri":0,"izoh":"To be bilan: is always."},{"savol":"He speaks Russian ___.","variantlar":["fluently","fluent","fluency","more fluent"],"togri":0,"izoh":"Tarz — fluently."},{"savol":"They will ___ win the match.","variantlar":["definitely","definite","definitely be","defined"],"togri":0,"izoh":"Ishonch — definitely fe'l oldida."}]},{"raqam":69,"sarlavha":"Inversiya kengaytmasi: Hardly / No sooner / Rarely / Only after","daraja":"C1","tayyor":true,"qoida":"📌 Ta'kid uchun bir qator so'zlar gap boshiga chiqadi va yordamchi fe'l egadan oldin keladi:\n\n▸ Hardly had I arrived when it started raining. (Kelishim bilanoq yomg'ir yog'a boshladi.)\n▸ No sooner had she left than he called. (U ketishi bilan, u qo'ng'iroq qildi.)\n▸ Rarely do we see such a thing. (Bunday narsani kamdan-kam ko'ramiz.)\n▸ Only after the meeting did I understand. (Yig'ilishdan keyingina tushundim.)","ogatish":"2 qadam:\n1) Gap boshida hardly, no sooner, rarely, only after bormi? Ha → inversiya.\n2) Yordamchi fe'l (had, do, did, is) egadan oldin keladi, keyin ega, keyin fe'l.\n\nEslab qoling: hardly ... when, no sooner ... than — ikki qismli tuzilma, shularni birga yodlang.","misollar":[{"ingliz":"Hardly had I arrived when it started to rain.","uzbek":"Men yetib kelishim bilanoq yomg'ir yog'a boshladi."},{"ingliz":"No sooner had she left than the phone rang.","uzbek":"U chiqib ketishi bilanoq telefon jiringladi."},{"ingliz":"Rarely do we see such talent.","uzbek":"Biz bunday iste'dodni kamdan-kam uchratamiz."},{"ingliz":"Only after the meeting did I understand the plan.","uzbek":"Faqat yig'ilishdan keyin rejani tushundim."}],"xato":"'Hardly I had arrived' — noto'g'ri. Inversiyada yordamchi fe'l egadan oldin: 'Hardly had I arrived'.","mashqlar":[{"savol":"Hardly ___ the room when the lights went out.","variantlar":["had I entered","I had entered","I entered","entered I"],"togri":0,"izoh":"Hardly + had + ega + V3."},{"savol":"Rarely ___ such a beautiful view.","variantlar":["have I seen","I have seen","I see","did I see"],"togri":0,"izoh":"Rarely + have + ega + V3."},{"savol":"No sooner ___ home than he fell asleep.","variantlar":["had he got","he had got","he got","got he"],"togri":0,"izoh":"No sooner + had + ega + V3."},{"savol":"Only after years of practice ___ she win.","variantlar":["did","she did","she would","would she"],"togri":0,"izoh":"Only after ... did + ega + fe'l (o'tmish)."}]},{"raqam":70,"sarlavha":"Ehtiyotkor bayonot: seem to, tend to, is likely to","daraja":"C1","tayyor":true,"qoida":"📌 Ehtiyotkor, yumshoq bayon. Gap aniq emas, balki ehtimol yoki odat haqida.\n\nseem to + fe'l:\n▸ It seems to be easy. (Oson ko'rinadi.)\n▸ She seems to know everything. (U hamma narsani biladigan ko'rinadi.)\n\ntend to + fe'l:\n▸ She tends to be late. (U odatda kechikadi.)\n▸ People tend to forget names quickly. (Odamlar ismlarni tez unutishga moyil.)\n\nis likely to + fe'l:\n▸ It is likely to rain. (Yomg'ir yog'ishi ehtimoli bor.)\n\nappear to + fe'l:\n▸ He appears to know the answer. (U javobni biladi shekilli.)","ogatish":"2 qadam:\n1) Gap aniq emas, ehtimol yoki odat haqidami? Ha → seem / tend / likely / appear.\n2) Shu iboradan keyin to + fe'l: seems to know, tends to forget.\n\nEslab qoling: 'It seems that' ham mumkin: It seems that he is right.","misollar":[{"ingliz":"She seems to know everything.","uzbek":"U hamma narsani biladigandek ko'rinadi."},{"ingliz":"People tend to forget names quickly.","uzbek":"Odamlar ismlarni tez unutishga moyil."},{"ingliz":"It is likely to rain this afternoon.","uzbek":"Bugun tushda yomg'ir yog'ishi ehtimoli bor."},{"ingliz":"The results appear to support our theory.","uzbek":"Natijalar nazariyamizni qo'llab-quvvatlaganga o'xshaydi."}],"xato":"'She seems know' — noto'g'ri. 'Seem to' + fe'l: 'seems to know'. 'Tend to' ham xuddi shunday.","mashqlar":[{"savol":"This method ___ to give better results.","variantlar":["seems","seem","is seeming","seemed to be"],"togri":0,"izoh":"Seem (uchinchi shaxs) + to + fe'l."},{"savol":"He ___ to be late when he is nervous.","variantlar":["tends","tend","is tending","tended not"],"togri":0,"izoh":"Odat — tends to."},{"savol":"It is ___ that the project will be delayed.","variantlar":["likely","likeliness","like","probable of"],"togri":0,"izoh":"It is likely that ... — ehtimol."},{"savol":"The new policy appears ___ successful.","variantlar":["to be","be","being","is to"],"togri":0,"izoh":"Appear to be — ko'rinadi."}]}];

coffee in the morning.", "variantlar": ["drink", "drinks", "drinking", "drank"], "togri": 1, "izoh": "He bilan fe'lga -s qo'shiladi: drinks coffee."}]}, {"raqam": 72, "sarlavha": "Buyruq gaplar — Imperative (Open the door!)", "daraja": "A1", "tayyor": true, "qoida": "📌 Buyruq, iltimos, ko'rsatma berish uchun ega (you) tushib qoladi, fe'l esa oddiy shaklda turadi.\n▸ Buyruq: Open the door! (Eshikni oching!)\n▸ Taklif: Let's go! (Keling, boramiz!)\n▸ Taqiq: Don't touch it! (Tegmang!)\n\n💡 Iltimos so'zini qo'shsa, gap yumshoqroq bo'ladi: Please sit down.", "ogatish": "🧭 Qadam-baqadam:\n1) Ega yo'q: Sit down (You sit down emas).\n2) Fe'l oddiy shaklda: Open, Come, Read — -s qo'shilmaydi.\n3) Taqiq uchun: Don't + fe'l: Don't run!\n4) Taklif uchun: Let's + fe'l: Let's start.\n\nMisollar:\n• Listen carefully!\n• Don't be late.\n• Let's eat lunch.", "misollar": [{"ingliz": "Open the window.", "uzbek": "Derazani oching."}, {"ingliz": "Sit down, please.", "uzbek": "Iltimos, o'tiring."}, {"ingliz": "Come here!", "uzbek": "Bu yerga keling!"}, {"ingliz": "Don't worry.", "uzbek": "Xavotir olmang."}, {"ingliz": "Don't touch that!", "uzbek": "Unga tegmang!"}, {"ingliz": "Let's go to the park.", "uzbek": "Keling, parkka boramiz."}, {"ingliz": "Please be quiet.", "uzbek": "Iltimos, jim bo'ling."}], "xato": "❌ You open the door! → ✅ Open the door!\n❌ Don't goes there. → ✅ Don't go there.\n❌ Let's goes. → ✅ Let's go.", "mashqlar": [{"savol": "___ the door, please.", "variantlar": ["Open", "Opens", "Opening", "You open"], "togri": 0, "izoh": "Buyruqda ega yo'q, fe'l oddiy shaklda: Open."}, {"savol": "___ late!", "variantlar": ["Don't be", "Doesn't be", "Not be", "Isn't be"], "togri": 0, "izoh": "Taqiq: Don't + be (fe'l)."}, {"savol": "___ go to the cinema!", "variantlar": ["Let's", "Let", "Lets", "Us"], "togri": 0, "izoh": "Taklif: Let's (= Let us) + fe'l."}, {"savol": "___ here, please.", "variantlar": ["Come", "Comes", "Coming", "Came"], "togri": 0, "izoh": "Buyruq: Come — oddiy shakl."}]}, {"raqam": 73, "sarlavha": "Sifatning o'rni — a big house (ot oldidan)", "daraja": "A1", "tayyor": true, "qoida": "📌 Ingliz tilida sifat (ADJ) odatda ot oldida turadi.\n▸ a big house (katta uy)\n▸ a beautiful girl (chiroyli qiz)\n\n▸ Lekin fe'ldan keyin ham keladi: The house is big. (Uy katta.)\n\n💡 Sifat hech qachon ko'plik shaklda bo'lmaydi: big houses emas, big houses → ✅ (ot ko'plikda, sifat o'zgarmaydi).", "ogatish": "🧭 Qadam-baqadam:\n1) Gapda nima tasvirlanyapti? Ot topilsin: house.\n2) Sifatni ot oldiga qo'ying: big house.\n3) Agar fe'l bo'lsa (is, are, looks): sifat fe'ldan keyin: The house is big.\n4) Sifat ko'plikka o'tmaydi: big houses ✔, bigs houses ✘.\n\nMisollar:\n• a new car\n• The car is new.", "misollar": [{"ingliz": "a red car", "uzbek": "qizil mashina"}, {"ingliz": "The car is red.", "uzbek": "Mashina qizil."}, {"ingliz": "a tall man", "uzbek": "baland bo'yli erkak"}, {"ingliz": "The man is tall.", "uzbek": "Erkak baland bo'yli."}, {"ingliz": "a small room", "uzbek": "kichik xona"}, {"ingliz": "This soup is hot.", "uzbek": "Bu sho'rva issiq."}, {"ingliz": "a beautiful garden", "uzbek": "chiroyli bog'"}], "xato": "❌ a house big → ✅ a big house\n❌ a cars red → ✅ a red car", "mashqlar": [{"savol": "It is a ___ house. (big)", "variantlar": ["big", "bigly", "bigs", "bigging"], "togri": 0, "izoh": "Sifat ot oldida, o'zgarmaydi: a big house."}, {"savol": "The book is ___. (interesting)", "variantlar": ["interesting", "interestingly", "interests", "interest"], "togri": 0, "izoh": "Fe'ldan keyin sifat: is interesting."}, {"savol": "She has a ___ dress. (blue)", "variantlar": ["blue", "blues", "blueing", "bluely"], "togri": 0, "izoh": "Sifat ko'plikka o'tmaydi: a blue dress."}, {"savol": "They live in ___ old city.", "variantlar": ["an", "a", "the", "some"], "togri": 0, "izoh": "'old' unli bilan boshlanadi, shuning uchun: an old city."}]}, {"raqam": 74, "sarlavha": "Bog'lovchilar — and, but, or, so, because", "daraja": "A2", "tayyor": true, "qoida": "📌 Bog'lovchilar ikki gapni yoki ikki qismni bog'laydi.\n▸ and — va (qo'shish): I like tea and coffee.\n▸ but — lekin (qarama-qarshilik): I am tired, but I work.\n▸ or — yoki (tanlov): Tea or coffee?\n▸ so — shuning uchun (natija): It rained, so we stayed home.\n▸ because — chunki (sabab): We stayed home because it rained.\n\n💡 Vergul: gap boshida 'because' bo'lsa, vergul kerak: Because it rained, we stayed home.", "ogatish": "🧭 Qadam-baqadam:\n1) Ikki g'oya qo'shilyaptimi? → and.\n2) Qarama-qarshimi? → but.\n3) Tanlov bormi? → or.\n4) Natija bormi? → so (oldin sabab, keyin natija).\n5) Sabab bormi? → because (sabab va natija tartibi o'zgarishi mumkin).\n\nMisollar:\n• I was tired, so I went to bed.\n• I went to bed because I was tired.", "misollar": [{"ingliz": "I like apples and bananas.", "uzbek": "Men olma va banan yoqtiraman."}, {"ingliz": "He is young but he is wise.", "uzbek": "U yosh, lekin dono."}, {"ingliz": "Do you want tea or juice?", "uzbek": "Choy yoki sharbat xohlaysizmi?"}, {"ingliz": "It was late, so we took a taxi.", "uzbek": "Kech bo'lib qoldi, shuning uchun taksi oldik."}, {"ingliz": "She stayed home because she was sick.", "uzbek": "U kasal bo'lgani uchun uyda qoldi."}, {"ingliz": "Because it rained, we stayed inside.", "uzbek": "Yomg'ir yog'gani uchun ichkarida qoldik."}, {"ingliz": "I wanted to go, but I was busy.", "uzbek": "Bormoqchi edim, lekin bandman."}], "xato": "❌ I was tired because I went to bed. (sabab va natija aralashdi)\n✅ I went to bed because I was tired.\n❌ He is rich, and he is sad. (qarama-qarshilikda but)\n✅ He is rich, but he is sad.", "mashqlar": [{"savol": "I am hungry ___ I will eat now.", "variantlar": ["so", "because", "but", "or"], "togri": 0, "izoh": "Ochman → natija: shuning uchun (so)."}, {"savol": "She didn't come ___ she was ill.", "variantlar": ["because", "so", "but", "and"], "togri": 0, "izoh": "Sabab: chunki (because)."}, {"savol": "He is poor ___ very happy.", "variantlar": ["but", "and", "so", "or"], "togri": 0, "izoh": "Qarama-qarshilik: lekin (but)."}, {"savol": "Would you like milk ___ water?", "variantlar": ["or", "and", "but", "so"], "togri": 0, "izoh": "Tanlov: yoki (or)."}]}, {"raqam": 75, "sarlavha": "Harakat predloglari — to, into, out of, across, through", "daraja": "A2", "tayyor": true, "qoida": "📌 Predloglar harakatning yo'nalishini ko'rsatadi.\n▸ to — ga (joyga borish): I go to school.\n▸ into — ichiga: She walks into the room.\n▸ out of — tashqariga: He comes out of the shop.\n▸ across — kesib o'tish: We walk across the street.\n▸ through — orqali: The river flows through the city.\n\n💡 Farq: in — ichida (joylashuv). into — ichkariga (harakat). Masalan: He is in the room. / He walks into the room.", "ogatish": "🧭 Qadam-baqadam:\n1) Harakat qayerga? Ichkariga → into.\n2) Ichkaridan chiqish → out of.\n3) Ko'chani kesib o'tish → across.\n4) Biror joy orqali o'tish → through.\n5) Joyga borish (manzil) → to.\n\nMisollar:\n• I go to work by bus.\n• The cat jumped out of the box.", "misollar": [{"ingliz": "I go to school every day.", "uzbek": "Men har kuni maktabga boraman."}, {"ingliz": "She walked into the kitchen.", "uzbek": "U oshxonaga kirdi."}, {"ingliz": "He came out of the bank.", "uzbek": "U bankdan chiqdi."}, {"ingliz": "We walked across the bridge.", "uzbek": "Biz ko'prikdan kesib o'tdik."}, {"ingliz": "The road goes through the forest.", "uzbek": "Yo'l o'rmon orqali o'tadi."}, {"ingliz": "Please come to the office.", "uzbek": "Iltimos, ofisga keling."}, {"ingliz": "The dog ran out of the house.", "uzbek": "It uydan chiqib yugurdi."}], "xato": "❌ She went in the room (harakat). → ✅ She went into the room.\n❌ He came from the shop out. → ✅ He came out of the shop.", "mashqlar": [{"savol": "She walked ___ the shop.", "variantlar": ["into", "in", "on", "at"], "togri": 0, "izoh": "Harakat ichkariga: into."}, {"savol": "He came ___ the car.", "variantlar": ["out of", "out", "from", "into"], "togri": 0, "izoh": "Ichkaridan chiqish: out of."}, {"savol": "We drove ___ the tunnel.", "variantlar": ["through", "across", "into", "to"], "togri": 0, "izoh": "Tunnel orqali o'tish: through."}, {"savol": "Walk ___ the road carefully.", "variantlar": ["across", "through", "out", "into"], "togri": 0, "izoh": "Ko'chani kesib o'tish: across."}]}, {"raqam": 76, "sarlavha": "Phrasal verbs — look up, give up, turn on, put off", "daraja": "B1", "tayyor": true, "qoida": "📌 Phrasal verb — fe'l + predlog/ravish. Ma'nosi ko'pincha fe'lning o'zidan farq qiladi.\n▸ look up — lug'atdan qidirmoq: Look up the word.\n▸ give up — taslim bo'lmoq, tashlamoq: Don't give up!\n▸ turn on / turn off — yoqmoq / o'chirmoq: Turn off the light.\n▸ put off — keyinga qoldirmoq: We put off the meeting.\n▸ get on — (transport) chiqmoq, kelishmoq: I get on the bus.\n\n💡 Ob'ekt gapda qayerda turishi mumkin: Turn the light off / Turn off the light (ikkalasi ham to'g'ri). Lekin 'it' (olmosh) bo'lsa: Turn it off ✔ (Turn off it ✘).", "ogatish": "🧭 Qadam-baqadam:\n1) Fe'lni toping: give.\n2) Predlog/ravishni qo'shing: give up.\n3) Ma'nosini yodlang: give up = taslim bo'lmoq.\n4) Olmosh ob'ekt bo'lsa, o'rtaga qo'ying: Turn it off.\n\nMisollar:\n• Don't give up on your dream.\n• Can you turn the TV on?", "misollar": [{"ingliz": "Look up this word in the dictionary.", "uzbek": "Bu so'zni lug'atdan qidiring."}, {"ingliz": "I will never give up.", "uzbek": "Men hech qachon taslim bo'lmayman."}, {"ingliz": "Turn off the lights before you leave.", "uzbek": "Ketishdan oldin chiroqlarni o'chiring."}, {"ingliz": "We put off the trip until next week.", "uzbek": "Sayohatni keyingi haftaga qoldirdik."}, {"ingliz": "Please turn it on.", "uzbek": "Iltimos, uni yoqing."}, {"ingliz": "I get on the train at 8.", "uzbek": "Men soat 8 da poyezdga chiqaman."}, {"ingliz": "She looked after her little brother.", "uzbek": "U kichik ukasiga qaradi."}], "xato": "❌ Turn off it. → ✅ Turn it off.\n❌ Look up it. → ✅ Look it up.", "mashqlar": [{"savol": "Please ___ the light. (yoqing)", "variantlar": ["turn on", "turn off", "put off", "give up"], "togri": 0, "izoh": "Turn on = yoqmoq."}, {"savol": "We had to ___ the meeting. (keyinga qoldirmoq)", "variantlar": ["put off", "look up", "get on", "give up"], "togri": 0, "izoh": "Put off = keyinga qoldirmoq."}, {"savol": "I don't know this word, so I will ___ it. (qidirmoq)", "variantlar": ["look it up", "look up it", "look at", "give up"], "togri": 0, "izoh": "Olmosh bo'lsa, o'rtada: look it up."}, {"savol": "Never ___ your dreams!", "variantlar": ["give up", "give in up", "give on", "give off"], "togri": 0, "izoh": "Give up = tashlamoq, taslim bo'lmoq."}]}, {"raqam": 77, "sarlavha": "Ruxsat va ehtimol — could, may, might", "daraja": "B1", "tayyor": true, "qoida": "📌 Could va may — ruxsat so'rash uchun yumshoq shakl:\n▸ Could I use your phone? (Telefoningizni ishlatsam bo'ladimi?)\n▸ May I come in? (Kirsam bo'ladimi?) — rasmiyroq.\n\n▸ Ehtimol (kelajak yoki hozirgi): may/might + fe'l: It may rain tomorrow. (Ertaga yomg'ir yog'ishi mumkin.)\n\n💡 Might ehtimolni kuchsizroq qiladi: It might rain. — may ga qaraganda ehtimol kamroq.", "ogatish": "🧭 Qadam-baqadam:\n1) Ruxsat so'rayapsizmi? → Could I / May I + fe'l.\n2) Ehtimol aytyapsizmi? → may / might + fe'l.\n3) Modal fe'ldan keyin fe'l oddiy shaklda: may come (comes emas).\n4) Javob: Yes, you can / Sure, you may.\n\nMisollar:\n• May I sit here?\n• He might be at home now.", "misollar": [{"ingliz": "Could I borrow your pen?", "uzbek": "Ruchkangizni olsam bo'ladimi?"}, {"ingliz": "May I ask a question?", "uzbek": "Savol bersam bo'ladimi?"}, {"ingliz": "It may rain later.", "uzbek": "Keyin yomg'ir yog'ishi mumkin."}, {"ingliz": "She might be late.", "uzbek": "U kechikishi mumkin."}, {"ingliz": "Could you help me, please?", "uzbek": "Iltimos, menga yordam bera olasizmi?"}, {"ingliz": "They might not come.", "uzbek": "Ular kelmasligi mumkin."}, {"ingliz": "You may leave now.", "uzbek": "Endi ketishingiz mumkin."}], "xato": "❌ May I to come in? → ✅ May I come in?\n❌ It might rains. → ✅ It might rain.", "mashqlar": [{"savol": "___ I open the window?", "variantlar": ["Could", "Cooks", "Coulding", "Coulded"], "togri": 0, "izoh": "Ruxsat so'rash: Could I + fe'l."}, {"savol": "It ___ be true, but I'm not sure.", "variantlar": ["might", "mights", "might to", "mighting"], "togri": 0, "izoh": "Modaldan keyin fe'l oddiy: might be."}, {"savol": "___ I sit here? (rasmiy)", "variantlar": ["May", "Mays", "Maying", "Mayed"], "togri": 0, "izoh": "Rasmiy ruxsat: May I + fe'l."}, {"savol": "He ___ come tomorrow.", "variantlar": ["may", "mays", "maying", "to may"], "togri": 0, "izoh": "Ehtimol: may + fe'l (come)."}]}, {"raqam": 78, "sarlavha": "Ega va fe'l moslashuvi — He works / They work", "daraja": "A1", "tayyor": true, "qoida": "📌 Fe'l ega bilan moslashishi kerak.\n▸ I / you / we / they → fe'l oddiy shaklda: I work. They work.\n▸ he / she / it → fe'lga -s (-es): He works. She watches.\n\n💡 Ega ko'plikda bo'lsa ham, 'and' bilan birlashgan bo'lsa: Tom and Ann work (ko'plik). Bu gapda ega ikki kishi — fe'l ko'plik: work.", "ogatish": "🧭 Qadam-baqadam:\n1) Ega kim? (kim yoki nima?)\n2) Bitta kishi/narsa (he, she, it, yoki ism: Tom)? → fe'lga -s.\n3) Ikki yoki ko'p (we, you, they, Tom and Ann)? → oddiy shakl.\n4) Tekshiring: She work ✘ → She works ✔.\n\nMisollar:\n• My brother lives in Tashkent.\n• The children play in the yard.", "misollar": [{"ingliz": "He works in a shop.", "uzbek": "U do'konda ishlaydi."}, {"ingliz": "They work in a school.", "uzbek": "Ular maktabda ishlaydi."}, {"ingliz": "She watches TV every night.", "uzbek": "U har kecha televizor ko'radi."}, {"ingliz": "Tom and Ann live here.", "uzbek": "Tom va Ann shu yerda yashaydi."}, {"ingliz": "The dog sleeps all day.", "uzbek": "It kun bo'yi uxlaydi."}, {"ingliz": "We study English together.", "uzbek": "Biz ingliz tilini birga o'rganamiz."}, {"ingliz": "My father goes to work by car.", "uzbek": "Otam ishga mashinada boradi."}], "xato": "❌ She work at the bank. → ✅ She works at the bank.\n❌ They works here. → ✅ They work here.", "mashqlar": [{"savol": "My sister ___ English. (speak)", "variantlar": ["speaks", "speak", "speaking", "spoke"], "togri": 0, "izoh": "Sister = she: speaks."}, {"savol": "They ___ in the park every day. (play)", "variantlar": ["play", "plays", "playing", "played"], "togri": 0, "izoh": "They bilan fe'l oddiy: play."}, {"savol": "Tom ___ to school by bus. (go)", "variantlar": ["goes", "go", "going", "gone"], "togri": 0, "izoh": "Tom = he: goes."}, {"savol": "We ___ very hard. (work)", "variantlar": ["work", "works", "working", "worked"], "togri": 0, "izoh": "We bilan fe'l oddiy: work."}]}]);

function bugunSana(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function progressYuklash(){
  try{
    const xom=localStorage.getItem(SAQLASH_KALITI);
    if(xom){
      const p=JSON.parse(xom);
      if(typeof p.xp!=='number') p.xp=0;
      if(!Array.isArray(p.ochilgan)) p.ochilgan=['A1'];
      if(!p.zaif||typeof p.zaif!=='object') p.zaif={};
      if(!p.zaifGram||typeof p.zaifGram!=='object') p.zaifGram={};
      return p;
    }
  }catch(e){}
  return {streak:{joriy:0,eng_uzun:0,oxirgi_kun:null},sozlar:{},jami_takrorlash:0,xp:0,ochilgan:['A1'],zaif:{},zaifGram:{}};
}
function progressSaqlash(p){
  try{ localStorage.setItem(SAQLASH_KALITI, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = progressYuklash();

function xpQoshish(son,tur){
  PROGRESS.xp=(PROGRESS.xp||0)+son;
  const r=kunlikYozuv(); r.xp=(r.xp||0)+son;
  if(tur){ r.xpT=r.xpT||{}; r.xpT[tur]=(r.xpT[tur]||0)+son; }
  progressSaqlash(PROGRESS);
  xpKorsatkichniYangilash();
}
function kunlikYozuv(){
  if(!PROGRESS.kunlik||typeof PROGRESS.kunlik!=='object') PROGRESS.kunlik={};
  const k=bugunSana();
  if(!PROGRESS.kunlik[k]) PROGRESS.kunlik[k]={xp:0,savol:0,togri:0};
  return PROGRESS.kunlik[k];
}
/* Kunlik faollik: har kuni nechta savol, to'g'ri javob va XP */
function kunlikQayd(xp,savol,togri,tur){
  const r=kunlikYozuv();
  r.xp+=xp||0; r.savol+=savol||0; r.togri+=togri||0;
  if(tur){ r.t=r.t||{}; const x=r.t[tur]||{s:0,t:0}; x.s+=savol||0; x.t+=togri||0; r.t[tur]=x; }
  progressSaqlash(PROGRESS);
}
function xpKorsatkichniYangilash(){
  const el=document.getElementById('xpYonPanel');
  const sv=(PROGRESS.streak&&PROGRESS.streak.joriy)||0;
  if(el) el.textContent=`🔥 ${sv} · ⭐ ${PROGRESS.xp} XP`;
  const n=document.getElementById('xpNav'); if(n) n.textContent=`🔥 ${sv} | ⭐ ${PROGRESS.xp} XP`;
}
function darajaOchiqmi(d){ return PROGRESS.ochilgan.includes(d); }
function darajaniOchish(d){
  if(d && !PROGRESS.ochilgan.includes(d)){
    PROGRESS.ochilgan.push(d);
    progressSaqlash(PROGRESS);
    return true;
  }
  return false;
}
function keyingiDaraja(d){
  const idx=DARAJA_TARTIBI.indexOf(d);
  return idx>=0 && idx<DARAJA_TARTIBI.length-1 ? DARAJA_TARTIBI[idx+1] : null;
}

function streakYangilash(){
  const bugun = bugunSana();
  const s = PROGRESS.streak;
  if(s.oxirgi_kun===bugun) return; // bugun allaqachon hisoblangan
  const kecha = new Date(Date.now()-86400000);
  const kechaSana = `${kecha.getFullYear()}-${String(kecha.getMonth()+1).padStart(2,'0')}-${String(kecha.getDate()).padStart(2,'0')}`;
  if(s.oxirgi_kun===kechaSana){ s.joriy+=1; }
  else{ s.joriy=1; }
  if(s.joriy>s.eng_uzun) s.eng_uzun=s.joriy;
  s.oxirgi_kun=bugun;
  progressSaqlash(PROGRESS);
}

function sozKaliti(daraja,en){ return daraja+'::'+en; }
function sozHolati(daraja,en){
  const k=sozKaliti(daraja,en);
  return PROGRESS.sozlar[k] || {level:0, keyingi:0};
}
function sozYangilash(daraja,en,togri){
  const k=sozKaliti(daraja,en);
  let h = PROGRESS.sozlar[k] || {level:0, keyingi:0};
  if(togri){ h.level = Math.min(h.level+1, 5); }
  else{ h.level = 0; }
  const kunlar = SRS_OYLIQ_KUN[h.level];
  h.keyingi = Date.now() + kunlar*86400000;
  PROGRESS.sozlar[k]=h;
  PROGRESS.jami_takrorlash = (PROGRESS.jami_takrorlash||0)+1;
  progressSaqlash(PROGRESS);
}
function sozlarDueRoyxati(daraja){
  const pool = SOZLAR_DB[daraja];
  const hozir = Date.now();
  const due=[]; const yangi=[];
  pool.forEach(([en,uz])=>{
    const k=sozKaliti(daraja,en);
    const h = PROGRESS.sozlar[k];
    if(!h) yangi.push([en,uz]);
    else if(h.keyingi<=hozir) due.push([en,uz]);
  });
  return {due:aralashtir(due), yangi:aralashtir(yangi)};
}
let joriyMavzu=null;

function aralashtir(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ── DARAJA REJASI: joriy daraja bo'yicha bajarilgan va qolgan qismlar (jonli, har ochilganda hisoblanadi) ── */
const REJA_SOZ_CHEGARA=3; /* so'z level 3 ga yetsa "o'zlashtirilgan" hisoblanadi */
function darajaReja(d){
  const bolimlar=[];
  if(d==='A1'){
    const ap=alifboProgress();
    bolimlar.push({nom:"🔤 Alifbo (0-daraja)", bajar: ap.otdi?1:0, jami:1, izoh: ap.otdi?"yakunlangan":`${ap.done.length}/${ALIFBO_DARSLAR.length} dars`});
  }
  const sozlar=SOZLAR_DB[d]||[];
  const sozBajar=sozlar.filter(([en])=>{const h=PROGRESS.sozlar[sozKaliti(d,en)];return h&&h.level>=REJA_SOZ_CHEGARA;}).length;
  bolimlar.push({nom:"📖 So'zlar (o'zlashtirilgan)", bajar:sozBajar, jami:sozlar.length, izoh:`${sozBajar}/${sozlar.length}`, qolgan:sozlar.length-sozBajar, soz:true});
  const gr=GRAMMATIKA_20.filter(g=>g.daraja===d);
  const yech=PROGRESS.gramYechilgan||{};
  const grBajar=gr.filter(g=>g.mashqlar.every((_,qi)=>yech[g.raqam+'_'+qi])).length;
  if(gr.length) bolimlar.push({nom:"📘 Grammatika mavzulari", bajar:grBajar, jami:gr.length, izoh:`${grBajar}/${gr.length}`});
  const mt=MATNLAR_DB[d]||[];
  const mj=PROGRESS.matnJavob||{};
  const mtBajar=mt.filter(m=>m.savollar.every((_,qi)=>mj[m.id+'_'+qi])).length;
  if(mt.length) bolimlar.push({nom:"📖 Matnlar", bajar:mtBajar, jami:mt.length, izoh:`${mtBajar}/${mt.length}`});
  const keyingi=keyingiDaraja(d);
  if(keyingi) bolimlar.push({nom:`🏁 ${keyingi} ochish: yakuniy test (${OCHISH_CHEGARASI}%+)`, bajar: darajaOchiqmi(keyingi)?1:0, jami:1, izoh: darajaOchiqmi(keyingi)?"ochilgan":"hali yo'q", test:true});
  const foiz=bolimlar.length?Math.round(bolimlar.reduce((s,b)=>s+(b.jami?b.bajar/b.jami:0),0)/bolimlar.length*100):0;
  const qolganSoz=sozlar.length-sozBajar;
  return {bolimlar, foiz, qolganSoz, kun: Math.ceil(qolganSoz/KVOTA_MAQSAD)};
}
function sozEskirgani(d){
  const hozir=Date.now(), chegara=ESKIRGAN_KUN*86400000;
  return (SOZLAR_DB[d]||[]).filter(([en])=>{const h=PROGRESS.sozlar[sozKaliti(d,en)]; return h && (hozir-h.keyingi)>chegara;}).length;
}
function darajaTayyor(d){
  const r=darajaReja(d);
  const bolimlar=r.bolimlar.filter(b=>!b.test);
  const hammasiTayyor=bolimlar.every(b=>!b.jami || b.bajar/b.jami>=0.9);
  return hammasiTayyor && sozEskirgani(d)===0;
}
function darajaTayyorlikMatni(d){
  const r=darajaReja(d);
  const kam=r.bolimlar.filter(b=>!b.test && b.jami && b.bajar/b.jami<0.9).map(b=>`${b.nom.replace(/^\S+\s/,'')} (${b.izoh})`);
  const es=sozEskirgani(d);
  const qator=[];
  if(kam.length) qator.push(`90% ga yetmagan: ${kam.join(', ')}`);
  if(es>0) qator.push(`🔁 ${ESKIRGAN_KUN} kundan oshgan takrorlanmagan so'zlar: ${es} ta`);
  return qator;
}

function tqXpGrafik(){
  const kun=PROGRESS.kunlik||{}, n=30, bugun=new Date(), pts=[];
  for(let i=n-1;i>=0;i--){const k=tqSanaKalit(new Date(bugun.getTime()-i*86400000)); pts.push({k,xp:(kun[k]&&kun[k].xp)||0});}
  const jami=pts.reduce((s,p)=>s+p.xp,0);
  if(!jami) return `<div class="tq-bos">Hali XP yo'q. Birinchi mashqdan keyin grafik shu yerda chiqadi.</div>`;
  const W=340,H=160,P=26,max=Math.max(10,...pts.map(p=>p.xp));
  const X=i=>P+i*(W-2*P)/(n-1), Y=v=>H-P-(v/max)*(H-2*P);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.xp).toFixed(1)).join(' ');
  const area=line+` L${X(n-1).toFixed(1)} ${H-P} L${X(0).toFixed(1)} ${H-P} Z`;
  const grid=[0,max/2,max].map(v=>`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" class="tq-setka"/><text x="${P-6}" y="${Y(v)+4}" class="tq-osh" text-anchor="end">${Math.round(v)}</text>`).join('');
  const nuqtalar=pts.map((p,i)=>p.xp?`<circle cx="${X(i)}" cy="${Y(p.xp)}" r="${i===n-1?4.5:2.6}" class="${i===n-1?'tq-nuqta-bugun':'tq-nuqta'}"/>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="tq-svg" role="img" aria-label="Oxirgi 30 kun XP">
    <defs><linearGradient id="tqGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#e0606a" stop-opacity=".45"/><stop offset="100%" stop-color="#e0606a" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#tqGrad)"/>
    <path d="${line}" class="tq-chiziq"/>
    ${nuqtalar}
    <text x="${P}" y="${H-6}" class="tq-osh">30 kun oldin</text>
    <text x="${W-P}" y="${H-6}" class="tq-osh" text-anchor="end">Bugun</text>
  </svg>
  <div class="tq-yorliq">Oxirgi 30 kun: <strong>+${jami} XP</strong></div>`;
}
function tqHalqa(darajalar,mustahkamJami,jami){

    const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${TQ_RANG[d]}" stroke-width="14" stroke-dasharray="${uzunlik} ${C-uzunlik}" stroke-dashoffset="${-ofset}" transform="rotate(-90 70 70)"/>`;
    ofset+=uzunlik; return s;
  }).join('');
  const foiz=jami?((mustahkamJami/jami)*100).toFixed(1):'0';
  return `<div class="tq-halqa-wrap">

function taraqqiyotGramHTML(){

}

function sozTakrorMatni(d,en){
  const h=PROGRESS.sozlar[sozKaliti(d,en)];
  if(!h) return 'yangi';
  const qolgan=h.keyingi-Date.now();
  if(qolgan<=0) return 'bugun takrorlanadi';
  const kun=Math.ceil(qolgan/86400000);

  const foiz=Math.min(100,Math.round((k.savol||0)/KVOTA_MAQSAD*100));

  const qoldiSoz=due.length+bugunYangi, jamiSoz=sozT.s+qoldiSoz;

function ogatishHTML(t){
  let out='';
  for(const raw of String(t||'').split('\n')){
    const L=raw.replace(/\s+$/,'');
    if(!L.trim() || /Qadam-baqadam/.test(L)) continue;
    const st=L.match(/^\s*(\d)\)\s*(.*)$/);
    if(st){ out+='<div class="ogat-qadam"><span class="ogat-son">'+st[1]+'</span><span>'+st[2]+'</span></div>'; continue; }
    if(/^\s*•/.test(L)){ out+='<div class="ogat-misol">'+L.replace(/^\s*•\s*/,'')+'</div>'; continue; }
    out+='<div class="ogat-izoh'+(/^\s+/.test(L)?' ogat-ichki':'')+'">'+L.trim()+'</div>';
  }
  return '<div class="ogat-blok"><div class="ogat-sarl">🧭 O\'rgatish namunasi</div>'+out+'</div>';
}

/* ── Alifbo talaffuz mashqi: ovozni tanish va baholash (Levenshtein masofasi) ── */

function alifboLev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function alifboTalBall(eshitildi,hedef){
  const h=sozlarTozala(hedef).join(' '), a=sozlarTozala(eshitildi).join(' ');

function alifboTalMikBoshla(w){

  r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;

  r.onend=()=>{ if(T.holat==='tinglanyapti'){ T.holat='xato'; alifboTalYangila(w); } };

function zaifTayyorla(){ if(!PROGRESS.zaif) PROGRESS.zaif={}; if(!PROGRESS.zaifGram) PROGRESS.zaifGram={}; }
function zaifBelgila(tur,kalit,togri){
  zaifTayyorla();
  const m=tur==='soz'?PROGRESS.zaif:PROGRESS.zaifGram;
  if(togri){ if(m[kalit]){ m[kalit]-=1; if(m[kalit]<=0) delete m[kalit]; } }
  else m[kalit]=Math.min((m[kalit]||0)+1,5);
  progressSaqlash(PROGRESS);
}
function uzTokenlar(s){return String(s).toLowerCase().replace(/\(.*?\)/g,' ').split(/[\s\/,;]+/).map(x=>x.trim()).filter(x=>x.length>2);}
function uzOxshash(a,b){const A=uzTokenlar(a),B=uzTokenlar(b);return A.some(x=>B.includes(x));}
function sozTanlash(daraja,son){
  const pool=SOZLAR_DB[daraja]||[];const hozir=Date.now();
  const zaif=[],due=[],qolgan=[];
  pool.forEach(w=>{
    const k=sozKaliti(daraja,w[0]);
    if(PROGRESS.zaif&&PROGRESS.zaif[k]) zaif.push(w);
    else{const h=PROGRESS.sozlar[k]; if(h&&h.keyingi<=hozir&&h.level<5) due.push(w); else qolgan.push(w);}
  });
  const ustuvor=[...aralashtir(zaif),...aralashtir(due)].slice(0,Math.ceil(son/2));
  const ishlatilgan=new Set(ustuvor.map(w=>w[0]));
  const yangi=aralashtir(qolgan).filter(w=>!ishlatilgan.has(w[0])).slice(0,Math.max(0,son-ustuvor.length));
  return aralashtir([...ustuvor,...yangi]).slice(0,son);
}
function ochiqSozlar(son){
  const ochiq=DARAJA_TARTIBI.filter(darajaOchiqmi);
  const har=Math.ceil(son/ochiq.length)+2;
  let r=[];ochiq.forEach(d=>sozTanlash(d,har).forEach(w=>r.push([w[0],w[1],d])));
  return aralashtir(r).slice(0,son);
}
function chalgitgichlar(pool,w,kalit){
  const korilgan=new Set([w[kalit]]);
  return aralashtir(pool.filter(x=>x[0]!==w[0]&&!uzOxshash(x[1],w[1]))).filter(x=>!korilgan.has(x[kalit])&&korilgan.add(x[kalit])).slice(0,3).map(x=>x[kalit]);
}

/* ── SAVOL YASOVCHILAR ── */
function sozSavollari(daraja,son){
  const pool=SOZLAR_DB[daraja];
  return sozTanlash(daraja,son).map(w=>{
    const [en,uz]=w;
    const variantlar=aralashtir([uz,...chalgitgichlar(pool,w,1)]);
    return {savol:`'${en}' so'zining o'zbekcha ma'nosi qaysi?`,variantlar,togri:variantlar.indexOf(uz),izoh:'',teg:{tur:'soz',daraja,en}};
  });
}
/* Takrorlash: joriy daraja testiga oldingi ochiq darajalardagi so'zlarni aralashtiradi (yod bo'lib qolmasligi uchun) */
function sharhSavollari(daraja,son){
  if(son<=0) return [];
  const oldingi=DARAJA_TARTIBI.slice(0,DARAJA_TARTIBI.indexOf(daraja)).filter(darajaOchiqmi);
  if(!oldingi.length) return [];
  const zaifSoz=[], qolgan=[];
  oldingi.forEach(d=>SOZLAR_DB[d].forEach(w=>{
    const h=PROGRESS.sozlar[sozKaliti(d,w[0])];
    (h&&h.level<5?zaifSoz:qolgan).push([d,w]);
  }));
  const tanlov=[...aralashtir(zaifSoz),...aralashtir(qolgan)].slice(0,son);
  return tanlov.map(([d,w])=>{
    const [en,uz]=w, pool=SOZLAR_DB[d], teg={tur:'soz',daraja:d,en,takror:true};
    if(Math.random()<0.5){
      const v=aralashtir([uz,...chalgitgichlar(pool,w,1)]);
      return {savol:`'${en}' so'zining o'zbekcha ma'nosi qaysi?`,variantlar:v,togri:v.indexOf(uz),izoh:'',teg};
    }
    const v=aralashtir([en,...chalgitgichlar(pool,w,0)]);
    return {savol:`"${uz}" — inglizchasi qaysi?`,variantlar:v,togri:v.indexOf(en),izoh:'',teg};
  });
}
function teskariSavollari(daraja,son){

}

    return `<div class="test-teg">📘 Grammatika · ${grammatikaTartib(g)}-mavzu: ${g.sarlavha}</div>`;
  }
  if(t.tur==='zamon'){
    if(!javob) return `<div class="test-teg">⏱ Zamonni aniqlash</div>`;
    const g=t.raqam?grammatikaBul(t.raqam):null;
    return `<div class="test-teg">⏱ Zamon: ${t.nom}${g?` · ${grammatikaTartib(g)}-mavzu`:''}</div>`;
  }
  return '';
}
function qoidaEslatmaHTML(q,togri){
  const t=q.teg;if(!t||!t.raqam||(t.tur!=='gram'&&t.tur!=='zamon')) return '';
  const g=grammatikaBul(t.raqam);if(!g||!g.tayyor) return '';
  return `<details class="qoida-eslatma" ${togri?'':'open'}><summary>📖 ${grammatikaTartib(g)}-mavzu qoidasi: ${g.sarlavha}</summary><div style="margin-top:8px;">${g.qoida.replace(/\n/g,'<br>')}</div><button class="reset-tugma" style="margin-top:10px;" onclick="testdanMavzu(${g.raqam})">Mavzuni to'liq ochish →</button></details>`;
}

function javobniYozish(q,togri){

  else if((t.tur==='gram'||t.tur==='zamon')&&t.raqam){zaifBelgila('gram',String(t.raqam),togri);}
  else if(t.tur==='sinonim'||t.tur==='antonim'||t.tur==='omonim'){const p={sinonim:'sin',antonim:'ant',omonim:'om'}[t.tur];zaifBelgila('soz',p+'::'+t.daraja+'::'+t.en,togri);}

/* Google Cloud Console'dan OAuth "Web application" Client ID. Bo'sh bo'lsa, Google kirish ko'rinmaydi. */
const GOOGLE_CLIENT_ID = '';

/* ================= AKKAUNT: Google bilan kirish (ixtiyoriy) ================= */
/* Qurilmada faqat ism, profil rasmi va Google ID saqlanadi. Email saqlanmaydi. */
const USER_KALIT='uzlearn_user_v1';
let AKKAUNT=null, GIS_TAYYOR=false;
function akkauntOqish(){ try{ return JSON.parse(localStorage.getItem(USER_KALIT)||'null'); }catch(e){ return null; } }
function akkauntSaqlash(u){ try{ if(u) localStorage.setItem(USER_KALIT, JSON.stringify(u)); else localStorage.removeItem(USER_KALIT); }catch(e){} }
function akEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jwtDekod(tok){
  const p=String(tok).split('.')[1]||''; let s=p.replace(/-/g,'+').replace(/_/g,'/'); s+='='.repeat((4-s.length%4)%4);
  const bin=atob(s); const u=decodeURIComponent(bin.split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(u);
}
function gKirishJavob(resp){
  try{
    const d=jwtDekod(resp.credential);
    if(!d.sub) throw new Error('sub');
    AKKAUNT={ism:d.name||d.given_name||'Foydalanuvchi', rasm:d.picture||'', id:d.sub};
    akkauntSaqlash(AKKAUNT);
    akkauntKo_rsatish();
    ovozXabar('Xush kelibsiz, '+AKKAUNT.ism+'!');
  }catch(e){ ovozXabar("Kirishda xato bo'ldi. Qayta urinib ko'ring."); }
}
/* Google kutubxonasi yuklangach chaqiriladi (script onload) */
function gisYuklandi(){
  if(!GOOGLE_CLIENT_ID||!(window.google&&google.accounts&&google.accounts.id)) return;
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:gKirishJavob, auto_select:false});
  GIS_TAYYOR=true; akkauntKo_rsatish();
}
function akkauntKo_rsatish(){
  const j=document.getElementById('akkaunt'); if(!j) return;
  if(AKKAUNT){
    j.innerHTML='<div class="ak-user">'+(AKKAUNT.rasm?'<img src="'+akEsc(AKKAUNT.rasm)+'" alt="" referrerpolicy="no-referrer"/>':'<span class="ak-ava">👤</span>')+'<span>'+akEsc(AKKAUNT.ism)+'</span><button class="ak-chiq" onclick="akkauntChiqish()">Chiqish</button></div>';
  } else if(GIS_TAYYOR){
    j.innerHTML='<div class="ak-kirish"><div id="g_kirish_joy"></div></div>';
    try{ google.accounts.id.renderButton(document.getElementById('g_kirish_joy'),{theme:'filled_black',size:'medium',shape:'pill',text:'signin_with'}); }catch(e){}
  } else { j.innerHTML=''; }
}

const PF_INP='width:100%;margin:6px 0 12px;padding:10px;border-radius:8px;border:1px solid #2a4378;background:#0b1730;color:#f5efe6;font-size:16px;box-sizing:border-box;';

function gapirtir(soz){
  try{
    if(!('speechSynthesis' in window)){ ovozXabar("Bu brauzer ovozni qo'llamaydi. Chrome yoki Safari'da urinib ko'ring."); return; }
    const s=window.speechSynthesis;
    if(!_ovozlar.length) ovozYukla();
    const u=new SpeechSynthesisUtterance(String(soz));
    u.lang='en-US'; u.rate=0.85; u.pitch=1; u.volume=1;
    const v=inglizOvoz();
    if(v){ try{ u.voice=v; }catch(e){} u.lang=v.lang||u.lang; }
    else if(!_ovozlar.length){ ovozXabar("Ovoz hali yuklanmadi. Bir necha soniyadan keyin qayta bosing yoki telefonda ingliz ovozini yoqing."); }
    else { ovozXabar("Telefonda ingliz tili ovozi topilmadi."); ovozYordamKo(false); }
    u.onerror=(e)=>{ if(e && e.error && e.error!=='interrupted' && e.error!=='canceled') ovozXabar("Ovozni ijro etib bo'lmadi. Qayta urinib ko'ring."); };
    _aktivUtter=u;                 /* brauzer ovozni yig'ib yubormasligi uchun havola saqlanadi */
    if(s.paused) s.resume();
    /* Muhim: speak() foydalanuvchi bosishi ichida, sinxron chaqirilishi kerak (iPhone/Safari shunday talab qiladi).
       Faqat ovoz allaqachon gapirayotgan bo'lsa to'xtatamiz, so'ng kichik kechikish bilan boshlaymiz. */
    const ishlaydi=()=>{ try{ s.speak(u); }catch(e){ ovozXabar("Ovoz xatosi. Qayta urinib ko'ring."); } };
    if(s.speaking||s.pending){ s.cancel(); setTimeout(ishlaydi,80); }
    else ishlaydi();
  }catch(e){ ovozXabar("Ovoz ishlamadi. Qayta urinib ko'ring."); }
}

function oyinJavobTugmalari(idPrefix,n,togriIdx,tanlanganIdx){

function gapRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz]=O.royxat[O.i];O.en=en;O.uz=uz;O.sozlar=en.split(' ');
  let b=aralashtir(O.sozlar.map((s,k)=>k));
  for(let t=0;t<5&&O.sozlar.length>2&&b.every((v,k)=>v===k);t++)b=aralashtir(b);
  O.bank=b;O.tanlangan=[];O.javoblandi=false;O.natija=null;gapChiz();
}
function gapChiz(){
  const tolgan=O.tanlangan.length===O.sozlar.length;

  if(O.javoblandi){pastki=`<div class="test-fikr ${O.natija?'yaxshi':'yomon'}">${O.natija?"✅ To'g'ri! +5 XP":"❌ To'g'ri gap:"} <strong>${O.en}</strong></div>${oyinMavzuHTML(IBORA_MAVZU[O.en])}<button class="test-keyingi" onclick="O.i++;gapRaund()">Keyingisi →</button>`;}
  else pastki=`<button class="test-keyingi" ${tolgan?'':'disabled style="opacity:.4;"'} onclick="gapTekshir()">Tekshirish</button>`;

}

  if(O.javoblandi||O.tanlangan.length!==O.sozlar.length)return;

  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz]=O.royxat[O.i];
  const notogri=aralashtir(IBORALAR.filter(p=>p[1]!==uz)).slice(0,3).map(p=>p[1]);
  O.en=en;O.uz=uz;O.vs=aralashtir([uz,...notogri]);O.javoblandi=false;tingChiz();

}
function tingJavob(k){
  if(O.javoblandi)return;O.javoblandi=true;
  const ok=O.vs[k]===O.uz;oyinJavobTugmalari('tv_',O.vs.length,O.vs.indexOf(O.uz),k);
  if(ok){O.togri++;O.xp+=5;xpQoshish(5,'oyin');}
  document.getElementById('oyinIzoh').innerHTML=`<div class="test-fikr ${ok?'yaxshi':'yomon'}">${ok?"✅ To'g'ri! +5 XP":"❌ Noto'g'ri."} 🇬🇧 <strong>${O.en}</strong> — ${O.uz}</div>${oyinMavzuHTML(IBORA_MAVZU[O.en])}<button class="test-keyingi" onclick="O.i++;tingRaund()">Keyingisi →</button>`;
}

function gapirRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz]=O.royxat[O.i];O.en=en;O.uz=uz;O.javoblandi=false;O.holat='';O.eshitildi='';O.foiz=null;gapirChiz();

  }
  document.getElementById('kontent-joy').innerHTML=oyinSarlavha('🎙️ Gapirib ko\'r',O.i,O.jami)+`<div class="test-karta" style="text-align:center;"><div style="font-size:12.5px;color:var(--kulrang);margin-bottom:8px;">Ovoz chiqarib ayting:</div><div style="font-size:24px;font-weight:700;margin-bottom:6px;">🇬🇧 ${O.en}</div><div style="color:#d9b382;font-size:14px;margin-bottom:16px;">🇺🇿 ${O.uz}</div><button class="reset-tugma" onclick="oyinOvoz(O.en)" style="margin-bottom:16px;">🔊 Namunani tinglash</button><div>${pastki}</div></div>`;
}
/* Gapirib ko'r: holatlar uchun aniq xabarlar */
const GAPIR_XABARLAR={
  qollamaydi:"Bu brauzer ovozni tanimaydi. Chrome (Android yoki kompyuter) ishlating yoki \"✋ Aytdim\" tugmasini bosing.",

  mikrofon:"Mikrofon topilmadi. Telefon yoki kompyuter mikrofoni ulanganini tekshiring.",
  tarmoq:"Ovozni tanish serveriga ulanib bo'lmadi. Internetni tekshirib, qayta urining.",

/* Brauzer xato kodini (error) o'zbekcha holatga o'giramiz */
function mikXatoHolati(kod){
  if(kod==='not-allowed'||kod==='service-not-allowed') return 'ruxsat';
  if(kod==='no-speech') return 'jim';
  if(kod==='audio-capture') return 'mikrofon';
  if(kod==='network') return 'tarmoq';
  return 'xato';
}
let _mikR=null;
function mikBoshla(){
  if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){ O.holat='qollamaydi'; gapirChiz(); return; }
  O.holat='ruxsat_sorov'; gapirChiz();
  mikRuxsatSora(function(ok){ if(ok) mikBoshlaHaqiqiy(); });
}
/* Mikrofon ruxsatini brauzer orqali aniq so'raymiz (bosish ichida chaqiriladi) */
function mikRuxsatSora(cb){
  const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia){ cb(true); return; }
  md.getUserMedia({audio:true}).then(function(st){
    try{ st.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    cb(true);
  }).catch(function(e){
    const n=e&&e.name;
    O.holat=(n==='NotAllowedError'||n==='SecurityError')?'ruxsat':'mikrofon';
    gapirChiz(); cb(false);
  });
}
function mikBoshlaHaqiqiy(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){O.holat='qollamaydi';gapirChiz();return;}
  let r;try{r=new R();}catch(e){O.holat='qollamaydi';gapirChiz();return;}
  _mikR=r;
  r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;O.holat='tinglanyapti';gapirChiz();
  r.onresult=e=>{ const m=e.results&&e.results[0]&&e.results[0][0]; if(m&&m.transcript) gapirBaho(m.transcript); else { O.holat='jim'; gapirChiz(); } };
  r.onerror=e=>{ if(O.holat==='tinglanyapti'){ O.holat = (e&&e.error==='aborted') ? '' : mikXatoHolati(e&&e.error); gapirChiz(); } };
  r.onend=()=>{ if(O.holat==='tinglanyapti'){ O.holat='jim'; gapirChiz(); } };
  try{r.start();}catch(e){ O.holat='xato'; gapirChiz(); }
}
/* Qisqartmalarni to'liq shaklga keltiramiz: I'm → I am, don't → do not */
function sozlarTozala(s){
  let t=String(s).toLowerCase().replace(/’/g,"'");
  t=t.replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/'s\b/g,' is');
  return t.replace(/[^a-z0-9' ]/g,' ').replace(/'/g,'').split(/\s+/).filter(Boolean);
}
function gapirBaho(t){
  const h=sozlarTozala(O.en),a=sozlarTozala(t);
  O.foiz=Math.round(h.filter(w=>a.includes(w)).length/h.length*100);O.eshitildi=t;O.holat='';O.javoblandi=true;
  if(O.foiz>=70){O.togri++;O.xp+=5;xpQoshish(5,'oyin');}
  gapirChiz();
}
function gapirMenAyttim(){if(O.javoblandi)return;O.javoblandi=true;O.foiz=null;O.togri++;O.xp+=2;xpQoshish(2,'oyin');gapirChiz();}

/* 5) Juftlikni top — so'z va tarjimasini juftlang */
function juftBoshlash(){O={tur:'juftlik',i:0,togri:0,xp:0,jami:3};juftRaund();}
function juftRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const tanlangan=[];
  ochiqSozlar(24).forEach(w=>{
    if(tanlangan.length>=6) return;
    if(tanlangan.some(x=>x[0]===w[0]||uzOxshash(x[1],w[1]))) return;
    tanlangan.push(w);
  });
  O.sozlar=tanlangan;O.n=tanlangan.length;
  const tiles=[];
  tanlangan.forEach((w,k)=>{tiles.push({k,yon:'en',t:w[0]});tiles.push({k,yon:'uz',t:w[1]});});
  O.tiles=aralashtir(tiles).map((t,id)=>({...t,id,topildi:false,xato:false}));
  O.tanl=null;O.topilgan=0;O.xato=0;O.qulf=false;O.tugadi=false;
  juftChiz();
}
function juftChiz(){
  const katak=O.tiles.map(t=>`<button class="test-variant juft-katak ${t.topildi?'togri':''} ${t.xato?'noto-gri':''} ${O.tanl===t.id?'tanlangan-katak':''}" style="text-align:center;min-height:58px;${t.yon==='en'?'font-weight:700;':''}" ${t.topildi?'disabled':''} onclick="juftBos(${t.id})">${t.t}</button>`).join('');
  const past=O.tugadi?`<div class="test-fikr yaxshi">✅ Raund tugadi! Xatolar: ${O.xato}</div><button class="test-keyingi" onclick="O.i++;juftRaund()">${O.i+1>=O.jami?'Yakunlash':'Keyingi raund'} →</button>`:`<div style="font-size:12.5px;color:var(--kulrang);margin-top:12px;">Juftlangan: ${O.topilgan}/${O.n} · Xato: ${O.xato}</div>`;
  document.getElementById('kontent-joy').innerHTML=oyinSarlavha('🧠 Juftlikni top',O.i,O.jami)+`<div class="test-karta"><div style="font-size:13px;color:var(--kulrang);margin-bottom:12px;">Inglizcha so'zni va uning o'zbekcha ma'nosini ketma-ket bosing.</div><div id="juft-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">${katak}</div>${past}</div>`;
}
function juftBos(id){
  if(O.qulf||O.tugadi) return;
  const t=O.tiles[id];if(!t||t.topildi) return;
  if(O.tanl===null){O.tanl=id;if(t.yon==='en')oyinOvoz(t.t);juftChiz();return;}
  if(O.tanl===id){O.tanl=null;juftChiz();return;}
  const a=O.tiles[O.tanl];
  if(a.yon===t.yon){O.tanl=id;juftChiz();return;}
  if(a.k===t.k){
    a.topildi=t.topildi=true;O.tanl=null;O.topilgan++;O.xp+=3;xpQoshish(3,'oyin');
    const w=O.sozlar[t.k];oyinOvoz(w[0]);zaifBelgila('soz',sozKaliti(w[2],w[0]),true);
    if(O.topilgan===O.n){O.tugadi=true;O.togri++;streakYangilash();}
    juftChiz();
  }else{
    O.xato++;O.qulf=true;a.xato=t.xato=true;
    [O.sozlar[a.k],O.sozlar[t.k]].forEach(w=>zaifBelgila('soz',sozKaliti(w[2],w[0]),false));
    juftChiz();
    const raund=O.i;
    setTimeout(()=>{
      if(O.tur!=='juftlik'||O.i!==raund||!document.getElementById('juft-grid')) return;
      a.xato=t.xato=false;O.tanl=null;O.qulf=false;juftChiz();
    },700);
  }
}

/* 6) Harf terish — harflardan so'z yig'ing */
function harfBoshlash(){
  const kand=ochiqSozlar(60).filter(w=>/^[a-z]{4,9}$/.test(w[0]));
  O={tur:'harf',royxat:kand.slice(0,8),i:0,togri:0,xp:0};O.jami=O.royxat.length;
  if(!O.jami){oyinlarKo_rsatish();return;}
  harfRaund();
}
function harfRaund(){
  if(O.i>=O.jami){oyinTugadi();return;}
  const [en,uz,d]=O.royxat[O.i];O.en=en;O.uz=uz;O.d=d;
  let b=aralashtir(en.split('').map((h,k)=>k));
  for(let t=0;t<8&&b.map(k=>en[k]).join('')===en;t++)b=aralashtir(b);
  O.bank=b;O.tanlangan=[];O.javoblandi=false;O.natija=null;O.ishora=false;harfChiz();
}
function harfChiz(){
  const tolgan=O.tanlangan.length===O.en.length;
  const qolgan=O.bank.filter(k=>!O.tanlangan.includes(k));
  let slotlar='';
  for(let p=0;p<O.en.length;p++){
    const k=O.tanlangan[p];
    slotlar+=k===undefined?`<span class="chip" style="min-width:34px;text-align:center;opacity:.35;">_</span>`:`<button class="chip" style="min-width:34px;text-align:center;font-weight:700;" onclick="harfOlib(${p})">${O.en[k]}</button>`;
  }
  const bank=qolgan.map(k=>`<button class="chip" style="min-width:42px;min-height:42px;text-align:center;font-weight:700;font-size:16px;" onclick="harfQosh(${k})">${O.en[k]}</button>`).join('');
  let past;
  if(O.javoblandi) past=`<div class="test-fikr ${O.natija?'yaxshi':'yomon'}">${O.natija?"✅ To'g'ri!"+(O.ishora?' +3 XP':' +5 XP'):"❌ To'g'ri yozilishi:"} <strong>${O.en}</strong></div><button class="test-keyingi" onclick="O.i++;harfRaund()">Keyingisi →</button>`;
  else past=`<button class="test-keyingi" ${tolgan?'':'disabled style="opacity:.4;"'} onclick="harfTekshir()">Tekshirish</button> <button class="reset-tugma" onclick="harfIshora()">💡 Ishora</button>`;
  document.getElementById('kontent-joy').innerHTML=oyinSarlavha('🔠 Harf terish',O.i,O.jami)+`<div class="test-karta"><div style="font-size:13px;color:var(--kulrang);margin-bottom:6px;">Inglizchasini yig'ing:</div><div style="font-size:20px;font-weight:700;margin-bottom:6px;">🇺🇿 ${O.uz}</div>${O.ishora?`<div style="font-size:13px;color:var(--sariq);margin-bottom:8px;">Birinchi harf: <strong>${O.en[0]}</strong> · ${O.en.length} ta harf</div>`:''}<div class="javob-joy">${slotlar}</div><div class="chip-qator">${bank}</div>${past}</div>`;
}
function harfQosh(k){if(O.javoblandi)return;O.tanlangan.push(k);harfChiz();}
function harfOlib(p){if(O.javoblandi)return;O.tanlangan.splice(p,1);harfChiz();}
function harfIshora(){if(O.javoblandi)return;O.ishora=true;oyinOvoz(O.en);harfChiz();}
function harfTekshir(){
  if(O.javoblandi||O.tanlangan.length!==O.en.length) return;
  O.natija=O.tanlangan.map(k=>O.en[k]).join('')===O.en;O.javoblandi=true;
  zaifBelgila('soz',sozKaliti(O.d,O.en),O.natija);
  if(O.natija){O.togri++;const x=O.ishora?3:5;O.xp+=x;xpQoshish(x,'oyin');oyinOvoz(O.en);}
  harfChiz();
}

/* 7) Tezkor so'z — 30 soniyada to'g'ri/noto'g'ri */
function tezkorBoshlash(){
  tezkorToxtat();
  O={tur:'tezkor',pool:ochiqSozlar(80),togri:0,jami:0,xp:0,t:30,oxirgi:''};

  tezkorKarta();tezkorChiz();
  O.timer=setInterval(tezkorTik,1000);
}
function tezkorKarta(){
  const p=O.pool;const w=p[Math.floor(Math.random()*p.length)];
  let uz=w[1],togri=true;
  if(Math.random()<0.5){
    const boshqa=aralashtir(p.filter(x=>x[0]!==w[0]&&!uzOxshash(x[1],w[1])));
    if(boshqa.length){uz=boshqa[0][1];togri=false;}
  }
  O.karta={w,uz,togri};
}
function tezkorChiz(){
  const k=O.karta;
  document.getElementById('kontent-joy').innerHTML=`<div class="sahifa-sarlavha"><div class="qator"><h2>⚡ Tezkor so'z</h2><button class="reset-tugma" onclick="tezkorToxtat();oyinlarKo_rsatish()">← Menyu</button></div></div><div class="test-karta" style="text-align:center;"><div class="qator" style="justify-content:space-between;margin-bottom:14px;"><span class="belgi" id="tezkor-vaqt">⏱ ${O.t} s</span><span class="belgi">✅ ${O.togri} / ${O.jami}</span><span class="belgi">⭐ ${O.xp}</span></div><div style="font-size:30px;font-weight:800;margin:18px 0 6px;">${k.w[0]}</div><div style="font-size:20px;color:#d9b382;margin-bottom:22px;">= ${k.uz}</div><div class="qator" style="justify-content:center;gap:14px;"><button class="test-keyingi" style="margin:0;min-width:130px;background:#2c2418;" onclick="tezkorJavob(true)">✅ To'g'ri</button><button class="test-keyingi" style="margin:0;min-width:130px;background:#3a1a22;" onclick="tezkorJavob(false)">❌ Noto'g'ri</button></div><div style="min-height:40px;margin-top:16px;font-size:13px;color:var(--kulrang);">${O.oxirgi}</div></div>`;
}
function tezkorJavob(b){
  if(O.tur!=='tezkor'||O.t<=0) return;
  const k=O.karta;const ok=b===k.togri;O.jami++;
  if(ok){O.togri++;O.xp+=2;xpQoshish(2,'oyin');O.oxirgi=`✅ To'g'ri`;}
  else{O.oxirgi=`❌ To'g'risi: <strong>${k.w[0]}</strong> = ${k.w[1]}`;zaifBelgila('soz',sozKaliti(k.w[2],k.w[0]),false);}
  tezkorKarta();tezkorChiz();
}
function tezkorTik(){
  const el=document.getElementById('tezkor-vaqt');
  if(!el||!O||O.tur!=='tezkor'){tezkorToxtat();return;}
  O.t--;el.textContent=`⏱ ${Math.max(O.t,0)} s`;
  if(O.t<=0){tezkorToxtat();oyinTugadi();}
}
function tezkorToxtat(){if(O&&O.timer){clearInterval(O.timer);O.timer=null;}}
